<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arquitectura — Guía Interactiva</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #171a23;
    --bg3: #1f2330;
    --border: #2a2f3d;
    --text: #e6e9f0;
    --muted: #9aa3b5;
    --accent: #818cf8;
    --accent2: #a5b4fc;
    --green: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
    --estructura: #818cf8;
    --estilos: #22d3ee;
    --practicas: #34d399;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px; background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 18px; letter-spacing: .3px; white-space: nowrap; }
  header h1 span { color: var(--accent2); }
  header .search { flex: 1; min-width: 220px; display: flex; }
  header .search input {
    width: 100%; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); outline: none; font-size: 14px;
  }
  header .search input:focus { border-color: var(--accent); }
  nav.views { display: flex; gap: 6px; }
  nav.views button {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--muted); cursor: pointer; font-size: 14px;
  }
  nav.views button.active { background: var(--accent); color: #111; border-color: var(--accent); }

  main { flex: 1; display: flex; overflow: hidden; }

  aside {
    width: 320px; background: var(--bg2); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 12px;
  }
  aside .cat { margin-bottom: 8px; }
  aside .cat-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); padding: 8px 10px 4px; font-weight: 700;
  }
  aside button.item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 10px; border: 1px solid transparent; border-radius: 8px;
    background: transparent; color: var(--text); cursor: pointer;
    text-align: left; font-size: 14px; margin-bottom: 2px;
  }
  aside button.item:hover { background: var(--bg3); }
  aside button.item.active { background: var(--bg3); border-color: var(--border); }
  aside button.item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  aside button.item .studied { margin-left: auto; color: var(--green); font-size: 12px; }
  aside .progress {
    padding: 12px 10px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
  }
  aside .progress .bar {
    height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-top: 6px;
  }
  aside .progress .fill { height: 100%; background: var(--green); transition: width .3s; }

  section.content { flex: 1; overflow-y: auto; padding: 24px 32px; }
  .pattern-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .pattern-head h2 { font-size: 26px; }
  .badge {
    padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .badge-estructura { background: rgba(129,140,248,.15); color: var(--estructura); }
  .badge-estilos { background: rgba(34,211,238,.15); color: var(--estilos); }
  .badge-practicas { background: rgba(52,211,153,.15); color: var(--practicas); }
  .concepto { color: var(--muted); font-size: 16px; margin-bottom: 20px; font-style: italic; }

  .card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
  }
  .card h3 {
    font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 10px; color: var(--accent2);
  }
  .card h3.none { color: var(--red); }
  .card p, .card li { color: var(--text); }
  .card ul { padding-left: 18px; }
  .card li { margin-bottom: 6px; }

  .senal-row {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid transparent; user-select: none;
  }
  .senal-row:hover { background: var(--bg3); }
  .senal-row.on { background: rgba(52,211,153,.08); border-color: rgba(52,211,153,.4); }
  .senal-row input { margin-top: 4px; accent-color: var(--green); cursor: pointer; }
  .meter { margin-top: 12px; }
  .meter .lbl { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; color: var(--muted); }
  .meter .bar { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
  .meter .fill { height: 100%; transition: width .3s, background .3s; border-radius: 5px; }

  pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.5;
    font-family: "Cascadia Code", Consolas, monospace; color: #c7d2fe;
  }
  .lbl-count { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }

  .empty { color: var(--muted); text-align: center; padding: 40px; font-size: 16px; }

  .diag-intro { color: var(--muted); margin-bottom: 16px; }
  .diag-symp {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid var(--border); background: var(--bg2); user-select: none;
  }
  .diag-symp.on { background: rgba(129,140,248,.1); border-color: var(--accent); }
  .diag-symp input { margin-top: 4px; accent-color: var(--accent); cursor: pointer; }
  .result-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 8px; cursor: pointer;
  }
  .result-item .score { margin-left: auto; font-weight: 700; color: var(--accent2); }
  .result-item .matchbar { height: 6px; background: var(--bg); border-radius: 3px; width: 60px; overflow: hidden; margin-left: 10px; }
  .result-item .matchbar .fill { height: 100%; background: var(--accent2); }

  .quiz-q {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
  }
  .quiz-q .q { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .quiz-q .patron-tag { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .opt {
    display: block; padding: 10px 12px; margin-bottom: 8px; border-radius: 8px;
    border: 1px solid var(--border); cursor: pointer; background: var(--bg);
    transition: all .15s;
  }
  .opt:hover { border-color: var(--accent); }
  .opt.selected { border-color: var(--accent); background: rgba(129,140,248,.12); }
  .opt.correct { border-color: var(--green); background: rgba(52,211,153,.12); }
  .opt.wrong { border-color: var(--red); background: rgba(248,113,113,.12); }
  .quiz-actions { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
  .btn {
    padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--text); cursor: pointer; font-size: 14px;
  }
  .btn.primary { background: var(--accent); color: #111; border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .quiz-score { font-size: 14px; color: var(--muted); }
  .quiz-result { font-size: 18px; font-weight: 700; padding: 12px; border-radius: 10px; text-align: center; margin-top: 10px; }
  .code-block { position: relative; }
  .code-block .lang {
    position: absolute; top: 8px; right: 12px; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px;
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .tabs button {
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--muted); cursor: pointer; font-size: 13px;
  }
  .tabs button.active { background: var(--accent); color: #111; border-color: var(--accent); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>Arquitectura <span>de Software</span></h1>
    <div class="search" v-if="view !== 'diagnostico'">
      <input type="text" v-model="query" placeholder="Buscar enfoque, señal, ejemplo...">
    </div>
    <nav class="views">
      <button :class="{active: view==='estudio'}" @click="view='estudio'">Estudio</button>
      <button :class="{active: view==='diagnostico'}" @click="view='diagnostico'">Diagnóstico</button>
      <button :class="{active: view==='quiz'}" @click="view='quiz'">Quiz</button>
    </nav>
  </header>

  <main>
    <aside v-if="view==='estudio'">
      <div class="progress">
        <div>Progreso: <b>{{ studiedCount }} / {{ techniques.length }}</b> enfoques dominados</div>
        <div class="bar"><div class="fill" :style="{width: (studiedCount/techniques.length*100)+'%'}"></div></div>
      </div>
      <template v-for="cat in categories" :key="cat.id">
        <div class="cat">
          <div class="cat-title">{{ cat.label }}</div>
          <button v-for="t in filteredByCat(cat.id)" :key="t.id"
                  class="item" :class="{active: current.id===t.id}"
                  @click="selectTechnique(t)">
            <span class="dot" :style="{background: catColor(cat.id)}"></span>
            <span>{{ t.name }}</span>
            <span v-if="studied.includes(t.id)" class="studied">listo</span>
          </button>
        </div>
      </template>
    </aside>

    <section class="content">

      <template v-if="view==='estudio'">
        <div v-if="current">
          <div class="pattern-head">
            <h2>{{ current.name }}</h2>
            <span class="badge" :class="'badge-'+current.categoria">{{ catLabel(current.categoria) }}</span>
            <button class="btn" :class="{primary: studied.includes(current.id)}"
                    @click="toggleStudied(current.id)">
              {{ studied.includes(current.id) ? 'Marcada como dominada' : 'Marcar como dominada' }}
            </button>
          </div>
          <p class="concepto">«{{ current.concepto }}»</p>

          <div class="tabs">
            <button v-for="t in tabs" :key="t.id" :class="{active: tab===t.id}" @click="tab=t.id">{{ t.label }}</button>
          </div>

          <template v-if="tab==='guiarapida'">
            <div class="card">
              <h3>Problema que resuelve</h3>
              <p>{{ current.problema }}</p>
            </div>
            <div class="grid2">
              <div class="card">
                <h3>Señales de que lo necesitas</h3>
                <ul>
                  <li v-for="s in current.senales" :key="s">{{ s }}</li>
                </ul>
              </div>
              <div class="card">
                <h3>Cuándo NO usarlo</h3>
                <ul>
                  <li v-for="n in current.noUsar" :key="n">{{ n }}</li>
                </ul>
              </div>
            </div>
            <div class="card">
              <h3>Alternativas a considerar</h3>
              <ul>
                <li v-for="a in current.alternativas" :key="a">{{ a }}</li>
              </ul>
            </div>
            <div class="card">
              <h3>Anti-patrón / olor de código que corrige</h3>
              <p>{{ current.antipatron }}</p>
            </div>
          </template>

          <template v-if="tab==='casos'">
            <div class="card">
              <h3>Casos de uso reales</h3>
              <ul>
                <li v-for="c in current.casos" :key="c">{{ c }}</li>
              </ul>
            </div>
            <div class="card">
              <h3>Análisis: ¿cómo reconocerlo en la práctica?</h3>
              <p>{{ current.analisis }}</p>
            </div>
          </template>

          <template v-if="tab==='autodiagnostico'">
            <div class="card">
              <h3>¿Se aplica a tu proyecto? Marca las señales que veas</h3>
              <div v-for="s in current.senales" :key="s" class="senal-row" :class="{on: estado[current.id] && estado[current.id][s]}" @click="toggleSenal(s)">
                <input type="checkbox" :checked="estado[current.id] && estado[current.id][s]" @click.stop>
                <span>{{ s }}</span>
              </div>
              <div class="meter">
                <div class="lbl"><span>Coincidencia</span><span>{{ senalPct }}%</span></div>
                <div class="bar"><div class="fill" :style="{width: senalPct+'%', background: senalColor}"></div></div>
              </div>
              <div class="lbl-count" v-if="senalPct >= 50">
                Alta coincidencia con este enfoque. Revisa los casos de uso y el ejemplo antes/después para confirmarlo.
              </div>
              <div class="lbl-count" v-else-if="senalPct > 0">
                Baja coincidencia. Verifica los casos de uso o explora otros enfoques en el Diagnóstico.
              </div>
              <div class="lbl-count" v-else>
                Sin señales marcadas todavía.
              </div>
            </div>
          </template>

          <template v-if="tab==='ejemplo'">
            <div class="card">
              <h3>Ejemplo antes / después</h3>
              <div class="code-block">
                <span class="lang">pseudocódigo</span>
                <pre>{{ current.ejemplo }}</pre>
              </div>
              <p style="margin-top:10px; color: var(--muted);">{{ current.explicacion }}</p>
            </div>
          </template>

        </div>
        <div v-else class="empty">Sin resultados para «{{ query }}».</div>
      </template>

      <template v-if="view==='diagnostico'">
        <h2 style="margin-bottom:6px;">Diagnóstico de arquitectura</h2>
        <p class="diag-intro">
          Marca las señales (síntomas) que estés viendo en tu proyecto. La app te sugerirá
          los enfoques de arquitectura con mayor coincidencia. Añade tantas como quieras; se ordenan por relevancia.
        </p>
        <div v-for="s in allSymptoms" :key="s.text" class="diag-symp" :class="{on: diagSelected.includes(s.text)}" @click="toggleDiag(s.text)">
          <input type="checkbox" :checked="diagSelected.includes(s.text)" @click.stop>
          <span>{{ s.text }}</span>
        </div>
        <h3 style="margin:24px 0 12px;">Enfoques sugeridos ({{ sortedResults.length }})</h3>
        <div v-if="sortedResults.length" class="result-item" v-for="r in sortedResults" :key="r.t.id" @click="openTechnique(r.t)">
          <span class="dot" :style="{background: catColor(r.t.categoria)}"></span>
          <span>{{ r.t.name }}</span>
          <span class="matchbar"><span class="fill" :style="{width: (r.score/maxScore*100)+'%'}"></span></span>
          <span class="score">{{ r.score }}</span>
        </div>
        <div v-else class="empty">Marca alguna señal para obtener recomendaciones.</div>
      </template>

      <template v-if="view==='quiz'">
        <div class="quiz-actions">
          <button class="btn" :disabled="submitted" @click="submitQuiz">Corregir</button>
          <button class="btn" @click="resetQuiz">Reiniciar</button>
          <span class="quiz-score" v-if="submitted">Puntaje: {{ score }}/{{ quiz.length }}</span>
          <span class="quiz-score" v-else>Respondidas: {{ answeredCount }}/{{ quiz.length }}</span>
        </div>
        <div class="quiz-q" v-for="(q, i) in quiz" :key="q.id">
          <div class="patron-tag">{{ q.tema }} — Pregunta {{ i+1 }}</div>
          <div class="q">{{ q.question }}</div>
          <div v-for="o in q.options" :key="o" class="opt"
               :class="{
                 selected: answers[q.id]===o,
                 correct: submitted && o===q.answer,
                 wrong: submitted && answers[q.id]===o && o!==q.answer
               }"
               @click="!submitted && (answers[q.id]=o)">
            {{ o }}
          </div>
          <div v-if="submitted" class="quiz-result" :style="{background: q.answer===answers[q.id] ? 'rgba(52,211,153,.1)' : 'rgba(248,113,113,.1)', color: q.answer===answers[q.id] ? 'var(--green)' : 'var(--red)'}">
            {{ q.answer===answers[q.id] ? 'Correcto' : 'Incorrecto — respuesta: ' + q.answer }}
          </div>
        </div>
      </template>

    </section>
  </main>
</div>

<script>
const { createApp } = Vue;

const techniques = [
  {
    id: "capas", name: "Arquitectura por capas", categoria: "estructura",
    concepto: "Organiza el sistema en capas horizontales (presentación, aplicación, dominio, infraestructura) donde cada capa solo depende de la capa inmediatamente inferior.",
    problema: "El código se convierte en una sopa donde presentación, lógica de negocio y acceso a datos se mezclan: cualquier cambio rompe otras partes y la lógica no se puede probar sin la interfaz.",
    senales: [
      "La lógica de negocio está mezclada con la interfaz o con las consultas a la base de datos.",
      "No puedo probar la regla de negocio sin abrir una pantalla o una conexión.",
      "Un cambio en el formulario obliga a tocar la consulta SQL.",
      "No hay un lugar obvio para poner una regla de negocio nueva.",
      "Los archivos acumulan varias responsabilidades (validar, persistir, renderizar)."
    ],
    noUsar: [
      "Proyectos pequeños o prototipos donde las capas añaden archivos y saltos sin beneficio real.",
      "Cuando la separación estricta genera 'capas de paso' que solo copian datos sin aportar lógica."
    ],
    alternativas: ["Arquitectura hexagonal para invertir las dependencias hacia el dominio.", "Modularidad por funcionalidad si los módulos son verticales."],
    antipatron: "Capas perforadas: la presentación accede directamente a la base de datos saltándose la lógica de negocio.",
    casos: [
      "Un sistema de facturación donde la vista no conoce el formato de la base de datos.",
      "Aplicación web con controladores finos, servicios de negocio y repositorios de datos.",
      "Un monolito que prepara el terreno para extraer servicios conservando el dominio intacto."
    ],
    analisis: "Pregunta: ¿puedo cambiar el motor de base de datos o el framework de UI sin reescribir la lógica de negocio? Si la respuesta es no, las capas están perforadas o no existen. Comprueba también qué hace un cambio de pantalla: si obliga a tocar consultas, la separación falló.",
    ejemplo:
`// ANTES: la vista mezcla todo
function renderFormulario() {
  const filas = db.query("SELECT * FROM clientes");        // SQL en la vista
  let total = 0;
  for (const f of filas) { total += calcularIva(f.precio); }  // regla de negocio aquí
  document.body.innerHTML = "Total: " + total;
}

// DESPUÉS: cada capa con su rol
function renderFormulario(clienteService) {
  const clientes = clienteService.listarClientes();        // solo presenta
  document.body.innerHTML = "Clientes: " + clientes.length;
}
class ClienteService {
  listarClientes() {
    return repositorioClientes.todos().map(c => c.aplicarIva());
  }
}
class RepositorioClientes {
  todos() { return db.query("SELECT * FROM clientes"); }   // solo datos
}`,
    explicacion: "La presentación llama al servicio, el servicio aplica la lógica y el repositorio habla con la base de datos. Cada pieza se prueba por separado y cambiar la UI ya no exige tocar las consultas."
  },
  {
    id: "modularidad", name: "Modularidad", categoria: "estructura",
    concepto: "Divide el sistema en módulos independientes con una interfaz pública pequeña y dependencias explícitas, ocultando los detalles internos.",
    problema: "Todo el código comparte el mismo espacio y se importa de forma cruzada sin control: una modificación en un punto 'explota' en módulos sin relación y no se puede razonar sobre qué depende de qué.",
    senales: [
      "No hay frontera clara entre funciones (todo se importa desde cualquier lado).",
      "Cambiar el comportamiento de una función afecta a módulos que no la usan directamente.",
      "Los módulos acumulan decenas de dependencias cruzadas.",
      "Necesito leer la implementación de un módulo para usarlo (su interfaz no es explícita).",
      "Los tests obligan a inicializar medio sistema para probar una unidad."
    ],
    noUsar: [
      "Módulos diminutos con una sola función que añaden archivos sin cohesionar un concepto.",
      "Si la granularidad elegida fuerza dependencias circulares para repartir el trabajo."
    ],
    alternativas: ["Packages/namespaces del lenguaje para acotar las dependencias.", "Límites estrictos (boundaries) cuando la separación debe ser arquitectónica."],
    antipatron: "Dependencias circulares: el módulo A importa a B y B importa a A, haciendo imposible razonar sobre el flujo.",
    casos: [
      "Un carrito de compras como módulo con su propio estado y una interfaz add/remove/total.",
      "Extraer el módulo de pagos para poder sustituir el proveedor sin tocar el resto.",
      "Separar la lógica de envío para probarla aislada y reutilizarla en otra parte."
    ],
    analisis: "Dibuja el grafo de dependencias: si ves ciclos o flechas cruzadas sin control, define módulos con una interfaz pública pequeña (pocos exports) y prohíbe importar lo interno. El ciclo se rompe extrayendo la parte común a un tercer módulo.",
    ejemplo:
`// ANTES: todo importa cualquier cosa (sin frontera)
import { generarCodigo } from "./utils/helpers/aleatorio";
import { bd } from "./bd/coneccion";
export function crearPedido(items) {
  bd.insert("pedidos", { codigo: generarCodigo(), items });
}

// DESPUÉS: módulo con interfaz pública pequeña
import { RepositorioPedidos } from "./pedidos/repositorio";
export function crearPedido(items, repositorio) {
  return repositorio.insertar(items);   // el detalle queda oculto
}`,
    explicacion: "El módulo de pedidos expone solo crearPedido(). Los detalles (código, base de datos) quedan dentro. Cambiar la forma de generar códigos no obliga a tocar a los consumidores."
  },
  {
    id: "boundaries", name: "Boundaries (fronteras)", categoria: "estructura",

const quiz = [
  { id: "q1", tema: "Estructura", question: "Un formulario mezcla SQL, lógica de negocio y renderizado, y no se puede probar nada sin abrir la pantalla. ¿Qué estructura aplicas?",
    options: ["Arquitectura por capas", "CQRS", "Event-driven", "Microservicios"], answer: "Arquitectura por capas" },
  { id: "q2", tema: "Estructura", question: "El módulo A importa a B, B importa a A y no hay una interfaz pública clara. ¿Qué principio aplicas?",
    options: ["Modularidad con dependencias explícitas", "Separación de responsabilidades", "Observabilidad", "Diseño de APIs"], answer: "Modularidad con dependencias explícitas" },
  { id: "q3", tema: "Estructura", question: "Un cambio de pasarela de pago implicaría reescribir la lógica de negocio. ¿Qué necesitas?",

  { id: "q5", tema: "Estilos", question: "Varios servicios deben reaccionar a 'pedido creado' sin que el emisor los conozca, y no se necesita confirmación inmediata. ¿Qué patrón?",

  { id: "q6", tema: "Estilos", question: "Los reportes complejos compiten con las escrituras sobre el mismo modelo y cada optimización perjudica a la otra. ¿Qué patrón aplicas?",

  { id: "q7", tema: "Estilos", question: "Dos equipos se pisan en el mismo deployable, pero aún no hay límites de dominio claros ni infraestructura de despliegue. ¿Qué decisión tomas?",
    options: ["Monolito modular con límites internos", "Dividir en microservicios ya", "Reescribir todo", "CQRS"], answer: "Monolito modular con límites internos" },

    options: ["Strangler fig: migrar pieza a pieza detrás de un flag", "Big bang: reescribir y lanzar todo de una vez", "No migrar nunca", "Congelar el legado sin plan"], answer: "Strangler fig: migrar pieza a pieza detrás de un flag" }
];

createApp({
  data() {
    return {
      techniques,
      quiz,
      view: "estudio",
      query: "",
      tab: "guiarapida",
      tabs: [
        { id: "guiarapida", label: "Guía rápida" },
        { id: "casos", label: "Casos de uso" },
        { id: "autodiagnostico", label: "Autodiagnóstico" },
        { id: "ejemplo", label: "Ejemplo" }
      ],
      categories: [
        { id: "estructura", label: "Estructura" },
        { id: "estilos", label: "Estilos" },
        { id: "practicas", label: "Prácticas" }
      ],
      current: techniques[0],
      estado: JSON.parse(localStorage.getItem("arquitectura_estado") || "{}"),
      studied: JSON.parse(localStorage.getItem("arquitectura_studied") || "[]"),
      diagSelected: JSON.parse(localStorage.getItem("arquitectura_diag") || "[]"),
      submitted: false,
      answers: {}
    };
  },
  computed: {
    studiedCount() { return this.studied.length; },
    senalPct() {
      const cur = this.estado[this.current.id] || {};
      const total = this.current.senales.length;
      const on = Object.values(cur).filter(Boolean).length;
      return Math.round(on / total * 100);
    },
    senalColor() {
      const p = this.senalPct;
      return p >= 50 ? "#34d399" : p > 0 ? "#fbbf24" : "#2a2f3d";
    },
    allSymptoms() {
      const seen = new Map();
      for (const t of this.techniques) {
        for (const s of t.senales) {
          if (!seen.has(s)) seen.set(s, []);
          seen.get(s).push(t.id);
        }
      }
      return Array.from(seen, ([text, tecnicas]) => ({ text, tecnicas }));
    },
    sortedResults() {
      if (!this.diagSelected.length) return [];
      const scores = {};
      for (const t of this.techniques) scores[t.id] = 0;
      for (const s of this.allSymptoms) {
        if (this.diagSelected.includes(s.text)) {
          s.tecnicas.forEach(tid => { scores[tid]++; });
        }
      }
      return Object.entries(scores)
        .filter(([, n]) => n > 0)
        .map(([tid, score]) => ({ t: this.techniques.find(x => x.id === tid), score }))
        .sort((a, b) => b.score - a.score);
    },
    maxScore() {
      const r = this.sortedResults;
      return r.length ? r[0].score : 1;
    },
    filteredPatterns() {
      const q = this.query.trim().toLowerCase();
      if (!q) return this.techniques;
      return this.techniques.filter(t => {
        const hay = [t.name, t.concepto, t.problema, ...t.senales, ...t.casos].join(" ").toLowerCase();
        return hay.includes(q);
      });
    },
    score() {
      return this.quiz.reduce((acc, q) => acc + (this.answers[q.id] === q.answer ? 1 : 0), 0);
    },
    answeredCount() {
      return this.quiz.filter(q => this.answers[q.id]).length;
    }
  },
  methods: {
    selectTechnique(t) { this.current = t; this.tab = "guiarapida"; },
    filteredByCat(catId) {
      return this.filteredPatterns.filter(t => t.categoria === catId);
    },
    catColor(cat) {
      return {
        estructura: "#818cf8", estilos: "#22d3ee", practicas: "#34d399"
      }[cat] || "#fff";
    },
    catLabel(cat) {
      const c = this.categories.find(x => x.id === cat);
      return c ? c.label : cat;
    },
    toggleStudied(id) {
      if (this.studied.includes(id)) this.studied = this.studied.filter(x => x !== id);
      else this.studied.push(id);
      localStorage.setItem("arquitectura_studied", JSON.stringify(this.studied));
    },
    toggleSenal(s) {
      if (!this.estado[this.current.id]) this.estado[this.current.id] = {};
      this.estado[this.current.id][s] = !this.estado[this.current.id][s];
      localStorage.setItem("arquitectura_estado", JSON.stringify(this.estado));
    },
    toggleDiag(s) {
      if (this.diagSelected.includes(s)) this.diagSelected = this.diagSelected.filter(x => x !== s);
      else this.diagSelected.push(s);
      localStorage.setItem("arquitectura_diag", JSON.stringify(this.diagSelected));
    },
    openTechnique(t) {
      this.current = t;
      this.view = "estudio";
      this.tab = "guiarapida";
    },
    submitQuiz() { this.submitted = true; },
    resetQuiz() {
      this.answers = {};
      this.submitted = false;
    }
  },
  watch: {
    view(v) { if (v === "quiz") this.submitted = false; }
  }
}).mount("#app");
</script>
</body>
</html>
