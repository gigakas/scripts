<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git — Manual de Estudio Interactivo</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #171a23;
    --bg3: #1f2330;
    --border: #2a2f3d;
    --text: #e6e9f0;
    --muted: #9aa3b5;
    --accent: #f05032;
    --accent2: #ff7a45;
    --green: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
    --fundamentos: #ff7a45;
    --ramas: #fbbf24;
    --deshacer: #f87171;
    --colaboracion: #60a5fa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* Header */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px; background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 18px; letter-spacing: .3px; white-space: nowrap; }
  header h1 span { color: var(--accent2); }
  header .search { flex: 1; min-width: 220px; display: flex; }
  header .search input {
    width: 100%; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); outline: none; font-size: 14px;
  }
  header .search input:focus { border-color: var(--accent); }
  nav.views { display: flex; gap: 6px; }
  nav.views button {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--muted); cursor: pointer; font-size: 14px;
  }
  nav.views button.active { background: var(--accent); color: #111; border-color: var(--accent); }

  /* Layout */
  main { flex: 1; display: flex; overflow: hidden; }

  /* Sidebar */
  aside {
    width: 320px; background: var(--bg2); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 12px;
  }
  aside .cat { margin-bottom: 8px; }
  aside .cat-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); padding: 8px 10px 4px; font-weight: 700;
  }
  aside button.item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 10px; border: 1px solid transparent; border-radius: 8px;
    background: transparent; color: var(--text); cursor: pointer;
    text-align: left; font-size: 14px; margin-bottom: 2px;
  }
  aside button.item:hover { background: var(--bg3); }
  aside button.item.active { background: var(--bg3); border-color: var(--border); }
  aside button.item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  aside button.item .studied { margin-left: auto; color: var(--green); font-size: 12px; }
  aside .progress {
    padding: 12px 10px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
  }
  aside .progress .bar {
    height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-top: 6px;
  }
  aside .progress .fill { height: 100%; background: var(--green); transition: width .3s; }

  /* Content */
  section.content { flex: 1; overflow-y: auto; padding: 24px 32px; }
  .pattern-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .pattern-head h2 { font-size: 26px; }
  .badge {
    padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .badge-fundamentos { background: rgba(255,122,69,.15); color: var(--fundamentos); }
  .badge-ramas { background: rgba(251,191,36,.15); color: var(--ramas); }
  .badge-deshacer { background: rgba(248,113,113,.15); color: var(--deshacer); }
  .badge-colaboracion { background: rgba(96,165,250,.15); color: var(--colaboracion); }
  .concepto { color: var(--muted); font-size: 16px; margin-bottom: 20px; font-style: italic; }

  .card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
  }
  .card h3 {
    font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 10px; color: var(--accent2);
  }
  .card h3.none { color: var(--red); }
  .card p, .card li { color: var(--text); }
  .card ul { padding-left: 18px; }
  .card li { margin-bottom: 6px; }

  .senal-row {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid transparent; user-select: none;
  }
  .senal-row:hover { background: var(--bg3); }
  .senal-row.on { background: rgba(52,211,153,.08); border-color: rgba(52,211,153,.4); }
  .senal-row input { margin-top: 4px; accent-color: var(--green); cursor: pointer; }
  .meter { margin-top: 12px; }
  .meter .lbl { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; color: var(--muted); }
  .meter .bar { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
  .meter .fill { height: 100%; transition: width .3s, background .3s; border-radius: 5px; }

  pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.5;
    font-family: "Cascadia Code", Consolas, monospace; color: #c7d2fe;
  }
  .lbl-count { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }

  .empty { color: var(--muted); text-align: center; padding: 40px; font-size: 16px; }

  /* Diagnostic */
  .diag-intro { color: var(--muted); margin-bottom: 16px; }
  .diag-symp {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid var(--border); background: var(--bg2); user-select: none;
  }
  .diag-symp.on { background: rgba(240,80,50,.1); border-color: var(--accent); }
  .diag-symp input { margin-top: 4px; accent-color: var(--accent); cursor: pointer; }
  .result-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 8px; cursor: pointer;
  }
  .result-item .score { margin-left: auto; font-weight: 700; color: var(--accent2); }
  .result-item .matchbar { height: 6px; background: var(--bg); border-radius: 3px; width: 60px; overflow: hidden; margin-left: 10px; }
  .result-item .matchbar .fill { height: 100%; background: var(--accent2); }

  /* Quiz */
  .quiz-q {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
  }
  .quiz-q .q { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .quiz-q .patron-tag { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .opt {
    display: block; padding: 10px 12px; margin-bottom: 8px; border-radius: 8px;
    border: 1px solid var(--border); cursor: pointer; background: var(--bg);
    transition: all .15s;
  }
  .opt:hover { border-color: var(--accent); }
  .opt.selected { border-color: var(--accent); background: rgba(240,80,50,.12); }
  .opt.correct { border-color: var(--green); background: rgba(52,211,153,.12); }
  .opt.wrong { border-color: var(--red); background: rgba(248,113,113,.12); }
  .quiz-actions { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
  .btn {
    padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--text); cursor: pointer; font-size: 14px;
  }
  .btn.primary { background: var(--accent); color: #111; border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .quiz-score { font-size: 14px; color: var(--muted); }
  .quiz-result { font-size: 18px; font-weight: 700; padding: 12px; border-radius: 10px; text-align: center; margin-top: 10px; }
  .code-block { position: relative; }
  .code-block .lang {
    position: absolute; top: 8px; right: 12px; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px;
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .tabs button {
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--muted); cursor: pointer; font-size: 13px;
  }
  .tabs button.active { background: var(--accent); color: #111; border-color: var(--accent); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>Git <span>Lab</span></h1>
    <div class="search" v-if="view !== 'diagnostico'">
      <input type="text" v-model="query" placeholder="Buscar comando, señal, ejemplo...">
    </div>
    <nav class="views">
      <button :class="{active: view==='estudio'}" @click="view='estudio'">Estudio</button>
      <button :class="{active: view==='diagnostico'}" @click="view='diagnostico'">Diagnóstico</button>
      <button :class="{active: view==='quiz'}" @click="view='quiz'">Quiz</button>
    </nav>
  </header>

  <main>
    <aside v-if="view==='estudio'">
      <div class="progress">
        <div>Progreso: <b>{{ studiedCount }} / {{ techniques.length }}</b> temas dominados</div>
        <div class="bar"><div class="fill" :style="{width: (studiedCount/techniques.length*100)+'%'}"></div></div>
      </div>
      <template v-for="cat in categories" :key="cat.id">
        <div class="cat">
          <div class="cat-title">{{ cat.label }}</div>
          <button v-for="t in filteredByCat(cat.id)" :key="t.id"
                  class="item" :class="{active: current.id===t.id}"
                  @click="selectTechnique(t)">
            <span class="dot" :style="{background: catColor(cat.id)}"></span>
            <span>{{ t.name }}</span>
            <span v-if="studied.includes(t.id)" class="studied">listo</span>
          </button>
        </div>
      </template>
    </aside>

    <section class="content">

      <template v-if="view==='estudio'">
        <div v-if="current">
          <div class="pattern-head">
            <h2>{{ current.name }}</h2>
            <span class="badge" :class="'badge-'+current.categoria">{{ catLabel(current.categoria) }}</span>
            <button class="btn" :class="{primary: studied.includes(current.id)}"
                    @click="toggleStudied(current.id)">
              {{ studied.includes(current.id) ? 'Marcada como dominada' : 'Marcar como dominada' }}
            </button>
          </div>
          <p class="concepto">«{{ current.concepto }}»</p>

          <div class="tabs">
            <button v-for="t in tabs" :key="t.id" :class="{active: tab===t.id}" @click="tab=t.id">{{ t.label }}</button>
          </div>

          <template v-if="tab==='guiarapida'">
            <div class="card">
              <h3>Problema que resuelve</h3>
              <p>{{ current.problema }}</p>
            </div>
            <div class="grid2">
              <div class="card">
                <h3>Señales de que lo necesitas</h3>
                <ul>
                  <li v-for="s in current.senales" :key="s">{{ s }}</li>
                </ul>
              </div>
              <div class="card">
                <h3>Cuándo NO usarlo</h3>
                <ul>
                  <li v-for="n in current.noUsar" :key="n">{{ n }}</li>
                </ul>
              </div>
            </div>
            <div class="card">
              <h3>Alternativas a considerar</h3>
              <ul>
                <li v-for="a in current.alternativas" :key="a">{{ a }}</li>
              </ul>
            </div>
            <div class="card">
              <h3>Anti-patrón que corrige</h3>
              <p>{{ current.antipatron }}</p>
            </div>
          </template>

          <template v-if="tab==='casos'">
            <div class="card">
              <h3>Casos de uso reales</h3>
              <ul>
                <li v-for="c in current.casos" :key="c">{{ c }}</li>
              </ul>
            </div>
            <div class="card">
              <h3>Análisis: ¿cómo reconocerlo en la práctica?</h3>
              <p>{{ current.analisis }}</p>
            </div>
          </template>

          <template v-if="tab==='autodiagnostico'">
            <div class="card">
              <h3>¿Se aplica a tu flujo de trabajo? Marca las señales que veas</h3>
              <div v-for="s in current.senales" :key="s" class="senal-row" :class="{on: estado[current.id] && estado[current.id][s]}" @click="toggleSenal(s)">
                <input type="checkbox" :checked="estado[current.id] && estado[current.id][s]" @click.stop>
                <span>{{ s }}</span>
              </div>
              <div class="meter">
                <div class="lbl"><span>Coincidencia</span><span>{{ senalPct }}%</span></div>
                <div class="bar"><div class="fill" :style="{width: senalPct+'%', background: senalColor}"></div></div>
              </div>
              <div class="lbl-count" v-if="senalPct >= 50">
                Alta coincidencia con esta técnica. Revisa los casos de uso y el ejemplo antes/después para confirmarlo.
              </div>
              <div class="lbl-count" v-else-if="senalPct > 0">
                Baja coincidencia. Verifica los casos de uso o explora otras técnicas en el Diagnóstico.
              </div>
              <div class="lbl-count" v-else>
                Sin señales marcadas todavía.
              </div>
            </div>
          </template>

          <template v-if="tab==='ejemplo'">
            <div class="card">
              <h3>Ejemplo antes / después</h3>
              <div class="code-block">
                <span class="lang">terminal git</span>
                <pre>{{ current.ejemplo }}</pre>
              </div>
              <p style="margin-top:10px; color: var(--muted);">{{ current.explicacion }}</p>
            </div>
          </template>

        </div>
        <div v-else class="empty">Sin resultados para «{{ query }}».</div>
      </template>

      <template v-if="view==='diagnostico'">
        <h2 style="margin-bottom:6px;">Diagnóstico de Git</h2>
        <p class="diag-intro">
          Marca las señales que estés viendo en tu trabajo diario con Git. La app te sugerirá
          los comandos y técnicas con mayor coincidencia. Añade tantas como quieras; se ordenan por relevancia.
        </p>
        <div v-for="s in allSymptoms" :key="s.text" class="diag-symp" :class="{on: diagSelected.includes(s.text)}" @click="toggleDiag(s.text)">
          <input type="checkbox" :checked="diagSelected.includes(s.text)" @click.stop>
          <span>{{ s.text }}</span>
        </div>
        <h3 style="margin:24px 0 12px;">Técnicas sugeridas ({{ sortedResults.length }})</h3>
        <div v-if="sortedResults.length" class="result-item" v-for="r in sortedResults" :key="r.t.id" @click="openTechnique(r.t)">
          <span class="dot" :style="{background: catColor(r.t.categoria)}"></span>
          <span>{{ r.t.name }}</span>
          <span class="matchbar"><span class="fill" :style="{width: (r.score/maxScore*100)+'%'}"></span></span>
          <span class="score">{{ r.score }}</span>
        </div>
        <div v-else class="empty">Marca alguna señal para obtener recomendaciones.</div>
      </template>

      <template v-if="view==='quiz'">
        <div class="quiz-actions">
          <button class="btn" :disabled="submitted" @click="submitQuiz">Corregir</button>
          <button class="btn" @click="resetQuiz">Reiniciar</button>
          <span class="quiz-score" v-if="submitted">Puntaje: {{ score }}/{{ quiz.length }}</span>
          <span class="quiz-score" v-else>Respondidas: {{ answeredCount }}/{{ quiz.length }}</span>
        </div>
        <div class="quiz-q" v-for="(q, i) in quiz" :key="q.id">
          <div class="patron-tag">{{ q.tema }} — Pregunta {{ i+1 }}</div>
          <div class="q">{{ q.question }}</div>
          <div v-for="o in q.options" :key="o" class="opt"
               :class="{
                 selected: answers[q.id]===o,
                 correct: submitted && o===q.answer,
                 wrong: submitted && answers[q.id]===o && o!==q.answer
               }"
               @click="!submitted && (answers[q.id]=o)">
            {{ o }}
          </div>
          <div v-if="submitted" class="quiz-result" :style="{background: q.answer===answers[q.id] ? 'rgba(52,211,153,.1)' : 'rgba(248,113,113,.1)', color: q.answer===answers[q.id] ? 'var(--green)' : 'var(--red)'}">
            {{ q.answer===answers[q.id] ? 'Correcto' : 'Incorrecto — respuesta: ' + q.answer }}
          </div>
        </div>
      </template>

    </section>
  </main>
</div>

<script>
const { createApp } = Vue;

const techniques = [
  {
    id: "initclone", name: "init / clone", categoria: "fundamentos",
    concepto: "git init crea un repositorio Git vacío en la carpeta actual; git clone copia un repositorio remoto existente en tu máquina con toda su historia.",
    problema: "Empiezas un proyecto nuevo sin control de versiones, o necesitas trabajar en código que ya vive en un servidor remoto (GitHub, GitLab). Sin repositorio no hay historial, ni ramas, ni forma de volver atrás cuando algo se rompe.",
    senales: [
      "Voy a empezar un proyecto nuevo y quiero control de versiones desde el día uno.",
      "Me dieron una URL de repositorio (https:// o git@...) y necesito el código en mi máquina.",
      "Trabajo en una carpeta sin carpeta .git y ya he perdido código antes por no tener historial.",
      "Quiero contribuir a un proyecto open source del que aún no tengo copia local."
    ],
    noUsar: [
      "No hagas git init dentro de un repositorio ya inicializado: crea un repositorio anidado y rompe el seguimiento.",
      "No clones con historia completa si solo necesitas la última versión: usa un clone shallow.",
      "No copies una carpeta .git de otro proyecto: arrastras historial y remotos ajenos."
    ],
    alternativas: [
      "git init --bare para crear un repositorio 'servidor' sin working tree (hoy se usa GitHub/GitLab).",
      "git clone --depth 1 para clonar solo el último commit y ahorrar tiempo.",
      "Descargar el ZIP del proyecto cuando no vas a hacer commits."
    ],
    antipatron: "Carpetas sin control de versiones o la carpeta 'proyecto_final_v2_definitivo': sin repositorio no hay historia y cada 'versión final' es una copia sin contexto.",
    casos: [
      "git init en una carpeta vacía para arrancar un side project personal.",
      "git clone https://github.com/usuario/proyecto.git para trabajar en un repositorio público.",
      "Reclonar el repositorio cuando la carpeta .git local se corrompe o se borró."
    ],
    analisis: "Si en la raíz de tu proyecto no existe la carpeta .git, no hay repositorio: ese es el diagnóstico. Si alguien te pasa una URL de GitHub/GitLab, casi siempre lo que necesitas es un clone. Confírmalo con git status (debe responder 'on branch' en vez de 'not a git repository').",
    ejemplo:
`// ANTES: trabajas en una carpeta sin control de versiones
cd proyecto
echo "# Mi proyecto" > README.md
// (sin historial: un borrón y cuenta nueva, nada recuperable)

// DESPUÉS: creas el repositorio y lo conectas a un remoto
cd proyecto
git init                            // crea la carpeta .git
git add README.md
git commit -m "chore: primer commit"
git remote add origin https://github.com/usuario/proyecto.git
git push -u origin main

// O clonas un proyecto existente con toda su historia:
git clone https://github.com/usuario/proyecto.git`,
    explicacion: "git init da de alta el control de versiones en la carpeta actual; git clone hace lo mismo copiando un remoto completo. A partir de ahí ya tienes historial, ramas y la posibilidad de volver atrás en cualquier momento."
  },
  {
    id: "addcommit", name: "add / commit", categoria: "fundamentos",
    concepto: "git add mueve archivos al área de preparación (staging) y git commit guarda una instantánea del repositorio con un mensaje descriptivo.",
    problema: "Tienes cambios en tus archivos que no están registrados: si se pierden o metes la pata, no hay manera de recuperar una versión buena. Además, sin commits atómicos no puedes entender ni deshacer qué cambió y por qué.",
    senales: [
      "Terminé un cambio y no sé si quedó guardado en el historial.",
      "Me olvido de hacer git add y el commit se queda a medias o incluye archivos que no quería.",
      "Metí cambios no relacionados en el mismo commit (todo revuelto).",
      "Los mensajes de commit no explican por qué hice el cambio."
    ],
    noUsar: [
      "No commitees archivos generados ni con secretos (node_modules, .env, claves): se quedan en la historia para siempre.",
      "No uses git add . cuando mezclas varios temas en un mismo commit.",
      "No guardes 'WIP' o mensajes vacíos como práctica habitual."
    ],
    alternativas: [
      "git add -p para añadir solo partes concretas de un archivo (hunks).",
      "git commit -m para mensajes de una línea, o el editor para añadir un cuerpo que explique el porqué.",
      "git restore --staged para sacar archivos del staging antes de commitear."
    ],
    antipatron: "Commits enormes tipo 'cambios varios' que mezclan 20 temas: es imposible revertir uno solo, el historial no cuenta una historia y la culpa se pierde.",
    casos: [
      "Registrar la corrección de un bug: git add src/bug.js y git commit -m 'fix: corregido el cálculo de IVA'.",
      "Commitear por temas: primero el refactor y luego la feature, con mensajes separados.",
      "Revisar git status antes de commitear para verificar qué está en staging."
    ],
    analisis: "Antes de commitear pregúntate: '¿este commit hace una sola cosa y su mensaje lo explica?'. Si mezcla dos temas o incluye archivos de más, usa add selectivo. La regla de oro es el commit atómico: un cambio lógico por commit, con mensaje que diga el PORQUÉ, no el cómo.",
    ejemplo:
`// ANTES: cambios sin registrar y todo mezclado
// (editas 3 archivos de temas distintos)
git commit -m "cosas"             // incluye todo, sin explicar nada

// DESPUÉS: commit atómico con mensaje claro
git add src/pagos.js              // solo el archivo del bug
git commit -m "fix: corregido el redondeo del IVA"
git add src/busqueda.js           // otra funcionalidad, otro commit

    analisis: "fetch es la 'lectura' y merge/rebase la 'escritura'. Si la duda es '¿qué hay de nuevo ahí fuera?', fetch. La pregunta '¿qué me falta por subir o bajar?' se responde comparando tras un fetch: git log origin/main..HEAD y git log HEAD..origin/main.",
    ejemplo:
`// ANTES: ves una origin/main que puede estar desactualizada
git status
// "Your branch is behind 'origin/main' by 3 commits"   ¿de verdad?

// DESPUÉS: descarga primero, decide después
git fetch origin                 // actualiza las referencias remotas locales
git log --oneline origin/main -5   // ve lo que realmente hay en el remoto
git status                       // ahora el 'behind/ahead' es fiable
git merge origin/main            // solo si decides integrar

// También puedes probar la rama de un compañero sin tocar la tuya:
git fetch origin feature/carrito
git switch feature/carrito       // ahora existe localmente`,
    explicacion: "fetch sincroniza el 'espejo' del remoto (origin/*) sin tocar tu trabajo. Es la herramienta de inspección: te permite ver y decidir antes de integrar. Recuerda que pull = fetch + merge en un solo paso."
  },
  {
    id: "reflog", name: "reflog", categoria: "colaboracion",
    concepto: "git reflog registra cada movimiento de las referencias de tu repositorio local (HEAD, ramas): resets, rebases, checkouts, commits... es el diario de todo lo que ha pasado.",
    problema: "Hiciste un reset --hard, un rebase o un merge y perdiste commits que ya no aparecen en el log. Necesitas recuperar trabajo que Git 'tiró' pero que en realidad sigue en el almacén de objetos.",
    senales: [
      "Acabo de hacer un reset --hard y perdí commits que quería conservar.",
      "Hice un rebase y la historia quedó distinta a la que esperaba.",
      "Borré una rama sin integrar y ahora la necesito.",
      "Algo cambió el estado de mi repo y no sé dónde estaba mi trabajo."
    ],
    noUsar: [
      "El reflog es LOCAL: lo que borraste con reflog desaparece, y el reflog de tu máquina no recupera lo que otros borraron en el remoto.",
      "No confundas reflog con la historia 'oficial': el log muestra commits vivos; el reflog también los 'muertos'.",
      "El reflog caduca (90 días por defecto): no lo uses como backup a largo plazo."
    ],
    alternativas: [
      "git fsck --lost-found para encontrar objetos huérfanos del almacén.",
      "git branch <rama> <hash> para restaurar un punto del reflog como rama.",
      "Backups reales del repositorio para recuperación ante desastres."
    ],
    antipatron: "Pánico ante un reset --hard 'imposible de recuperar': casi siempre se puede volver con reflog. El antipatrón real es no conocer el reflog y creer que el trabajo se perdió para siempre, o usarlo como sustituto de un backup.",
    casos: [
      "git reflog tras un reset --hard para recuperar el commit anterior a la debacle.",
      "git reflog para encontrar el punto exacto antes de un rebase fallido.",
      "Restaurar una rama borrada buscando su hash en el reflog y recreándola con git branch <rama> <hash>."
    ],
    analisis: "Antes de una operación destructiva (reset --hard, rebase, branch -D) anota el HEAD actual: git rev-parse HEAD. Si algo sale mal, git reflog te muestra cada HEAD que ha tenido tu repo y puedes volver con git reset --hard <hash> o creando una rama en ese punto.",
    ejemplo:
`// ANTES: catástrofe, crees que perdiste todo
git reset --hard HEAD~5
git log --oneline -3            // tus commits... ya no están
// pánico: "¿dónde está mi feature?"

// DESPUÉS: el reflog te da la salida
git reflog
//  a1b2c3d HEAD@{0}: reset: moving to HEAD~5
//  9f8e7d6 HEAD@{1}: commit: feat: pagos online   ← ¡aquí estaba!
//  1a2b3c4 HEAD@{2}: commit: fix: login

// Recupera tu trabajo:
git checkout 9f8e7d6            // examina el commit perdido
git branch feature/pagos 9f8e7d6  // o restáuralo como una rama nueva`,
    explicacion: "cada operación queda registrada en el reflog con su hash. Recuperar 'lo perdido' es encontrar la entrada anterior al error y volver a ella con reset, checkout o creando una rama. El reflog convierte la mayoría de 'catástrofes' en un par de comandos."
  }
];

const quiz = [
  { id: "q1", tema: "Fundamentos", question: "Acabas de crear una carpeta vacía para un proyecto nuevo y quieres empezar con control de versiones. ¿Qué comando ejecutas primero?",
    options: ["git commit -m", "git init", "git push origin main", "git clone"], answer: "git init" },
  { id: "q2", tema: "Fundamentos", question: "Editaste un archivo y quieres guardarlo en el historial explicando el cambio. ¿Qué haces?",
    options: ["git init && git push", "git add <archivo> y git commit -m", "git restore <archivo>", "git cherry-pick <hash>"], answer: "git add <archivo> y git commit -m" },
  { id: "q3", tema: "Fundamentos", question: "Quieres saber qué archivos tienes modificados y qué commits no has subido todavía. ¿Qué comandos usas?",
    options: ["git status y git log", "git stash y git stash pop", "git fetch y git revert", "git reset y git rebase"], answer: "git status y git log" },
  { id: "q4", tema: "Ramas", question: "Quieres probar una feature arriesgada sin afectar a la rama principal. ¿Qué haces?",
    options: ["git merge a main", "git reset --hard", "git switch -c feature/experimento", "git restore --staged"], answer: "git switch -c feature/experimento" },
  { id: "q5", tema: "Ramas", question: "Terminaste tu feature en su rama y toca llevarla a main. Estás en main. ¿Qué comando ejecutas?",
    options: ["git merge feature/pagos", "git revert feature/pagos", "git cherry-pick main", "git stash feature/pagos"], answer: "git merge feature/pagos" },
  { id: "q6", tema: "Ramas", question: "Necesitas traer un único commit de corrección desde otra rama sin mezclar la rama entera. ¿Qué usas?",
    options: ["git merge otra-rama", "git rebase otra-rama", "git cherry-pick <hash>", "git pull otra-rama"], answer: "git cherry-pick <hash>" },
  { id: "q7", tema: "Deshacer", question: "Un commit con un bug ya está publicado en main y todo el equipo lo tiene. ¿Cómo lo deshaces con seguridad?",
    options: ["git reset --hard <hash> y git push --force", "git revert <hash>", "git branch -D main", "git restore --staged <hash>"], answer: "git revert <hash>" },
  { id: "q8", tema: "Deshacer", question: "Modificaste un archivo y lo rompiste sin llegar a commitear. Quieres volver al último commit. ¿Qué comando?",
    options: ["git reset --soft HEAD~1", "git restore <archivo>", "git push origin main", "git log --oneline"], answer: "git restore <archivo>" },
  { id: "q9", tema: "Colaboración", question: "Quieres ver qué cambios hay en el remoto sin integrarlos todavía en tu trabajo. ¿Qué comando?",
    options: ["git pull", "git fetch", "git push", "git stash"], answer: "git fetch" },
  { id: "q10", tema: "Deshacer", question: "Acabas de hacer git reset --hard y crees que perdiste varios commits. ¿Cómo los recuperas?",
    options: ["git revert HEAD", "git reflog y volver al hash anterior", "git push --force", "git log --graph --all"], answer: "git reflog y volver al hash anterior" }
];

createApp({
  data() {
    return {
      techniques,
      quiz,
      view: "estudio",
      query: "",
      tab: "guiarapida",
      tabs: [
        { id: "guiarapida", label: "Guía rápida" },
        { id: "casos", label: "Casos de uso" },
        { id: "autodiagnostico", label: "Autodiagnóstico" },
        { id: "ejemplo", label: "Ejemplo" }
      ],
      categories: [
        { id: "fundamentos", label: "Fundamentos" },
        { id: "ramas", label: "Ramas" },
        { id: "deshacer", label: "Deshacer" },
        { id: "colaboracion", label: "Colaboración" }
      ],
      current: techniques[0],
      estado: JSON.parse(localStorage.getItem("git_estado") || "{}"),
      studied: JSON.parse(localStorage.getItem("git_studied") || "[]"),
      diagSelected: JSON.parse(localStorage.getItem("git_diag") || "[]"),
      submitted: false,
      answers: {}
    };
  },
  computed: {
    studiedCount() { return this.studied.length; },
    senalPct() {
      const cur = this.estado[this.current.id] || {};
      const total = this.current.senales.length;
      const on = Object.values(cur).filter(Boolean).length;
      return Math.round(on / total * 100);
    },
    senalColor() {
      const p = this.senalPct;
      return p >= 50 ? "#34d399" : p > 0 ? "#fbbf24" : "#2a2f3d";
    },
    allSymptoms() {
      const seen = new Map();
      for (const t of this.techniques) {
        for (const s of t.senales) {
          if (!seen.has(s)) seen.set(s, []);
          seen.get(s).push(t.id);
        }
      }
      return Array.from(seen, ([text, tecnicas]) => ({ text, tecnicas }));
    },
    sortedResults() {
      if (!this.diagSelected.length) return [];
      const scores = {};
      for (const t of this.techniques) scores[t.id] = 0;
      for (const s of this.allSymptoms) {
        if (this.diagSelected.includes(s.text)) {
          s.tecnicas.forEach(tid => { scores[tid]++; });
        }
      }
      return Object.entries(scores)
        .filter(([, n]) => n > 0)
        .map(([tid, score]) => ({ t: this.techniques.find(x => x.id === tid), score }))
        .sort((a, b) => b.score - a.score);
    },
    maxScore() {
      const r = this.sortedResults;
      return r.length ? r[0].score : 1;
    },
    filteredPatterns() {
      const q = this.query.trim().toLowerCase();
      if (!q) return this.techniques;
      return this.techniques.filter(t => {
        const hay = [t.name, t.concepto, t.problema, ...t.senales, ...t.casos].join(" ").toLowerCase();
        return hay.includes(q);
      });
    },
    score() {
      return this.quiz.reduce((acc, q) => acc + (this.answers[q.id] === q.answer ? 1 : 0), 0);
    },
    answeredCount() {
      return this.quiz.filter(q => this.answers[q.id]).length;
    }
  },
  methods: {
    selectTechnique(t) { this.current = t; this.tab = "guiarapida"; },
    filteredByCat(catId) {
      return this.filteredPatterns.filter(t => t.categoria === catId);
    },
    catColor(cat) {
      return {
        fundamentos: "#ff7a45", ramas: "#fbbf24",
        deshacer: "#f87171", colaboracion: "#60a5fa"
      }[cat] || "#fff";
    },
    catLabel(cat) {
      const c = this.categories.find(x => x.id === cat);
      return c ? c.label : cat;
    },
    toggleStudied(id) {
      if (this.studied.includes(id)) this.studied = this.studied.filter(x => x !== id);
      else this.studied.push(id);
      localStorage.setItem("git_studied", JSON.stringify(this.studied));
    },
    toggleSenal(s) {
      if (!this.estado[this.current.id]) this.estado[this.current.id] = {};
      this.estado[this.current.id][s] = !this.estado[this.current.id][s];
      localStorage.setItem("git_estado", JSON.stringify(this.estado));
    },
    toggleDiag(s) {
      if (this.diagSelected.includes(s)) this.diagSelected = this.diagSelected.filter(x => x !== s);
      else this.diagSelected.push(s);
      localStorage.setItem("git_diag", JSON.stringify(this.diagSelected));
    },
    openTechnique(t) {
      this.current = t;
      this.view = "estudio";
      this.tab = "guiarapida";
    },
    submitQuiz() { this.submitted = true; },
    resetQuiz() {
      this.answers = {};
      this.submitted = false;
    }
  },
  watch: {
    view(v) { if (v === "quiz") this.submitted = false; }
  }
}).mount("#app");
</script>
</body>
</html>
