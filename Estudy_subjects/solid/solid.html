<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLID — Guía Interactiva</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
  :root {
    --bg: #100e1a;
    --bg2: #181429;
    --bg3: #231d3d;
    --border: #2f2847;
    --text: #eae7f4;
    --muted: #a49cbd;
    --accent: #a78bfa;
    --accent2: #c4b5fd;
    --green: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
    --solid: #a78bfa;
    --diseno: #fbbf24;
    --calidad: #34d399;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* Header */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px; background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 18px; letter-spacing: .3px; white-space: nowrap; }
  header h1 span { color: var(--accent2); }
  header .search { flex: 1; min-width: 220px; display: flex; }
  header .search input {
    width: 100%; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); outline: none; font-size: 14px;
  }
  header .search input:focus { border-color: var(--accent); }
  nav.views { display: flex; gap: 6px; }
  nav.views button {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--muted); cursor: pointer; font-size: 14px;
  }
  nav.views button.active { background: var(--accent); color: #111; border-color: var(--accent); }

  /* Layout */
  main { flex: 1; display: flex; overflow: hidden; }

  /* Sidebar */
  aside {
    width: 320px; background: var(--bg2); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 12px;
  }
  aside .cat { margin-bottom: 8px; }
  aside .cat-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); padding: 8px 10px 4px; font-weight: 700;
  }
  aside button.item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 10px; border: 1px solid transparent; border-radius: 8px;
    background: transparent; color: var(--text); cursor: pointer;
    text-align: left; font-size: 14px; margin-bottom: 2px;
  }
  aside button.item:hover { background: var(--bg3); }
  aside button.item.active { background: var(--bg3); border-color: var(--border); }
  aside button.item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  aside button.item .studied { margin-left: auto; color: var(--green); font-size: 12px; }
  aside .progress {
    padding: 12px 10px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
  }
  aside .progress .bar {
    height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-top: 6px;
  }
  aside .progress .fill { height: 100%; background: var(--green); transition: width .3s; }

  /* Content */
  section.content { flex: 1; overflow-y: auto; padding: 24px 32px; }
  .pattern-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .pattern-head h2 { font-size: 26px; }
  .badge {
    padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .badge-solid { background: rgba(167,139,250,.15); color: var(--solid); }
  .badge-diseno { background: rgba(251,191,36,.15); color: var(--diseno); }
  .badge-calidad { background: rgba(52,211,153,.15); color: var(--calidad); }
  .concepto { color: var(--muted); font-size: 16px; margin-bottom: 20px; font-style: italic; }

  .card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
  }
  .card h3 {
    font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 10px; color: var(--accent2);
  }
  .card h3.none { color: var(--red); }
  .card p, .card li { color: var(--text); }
  .card ul { padding-left: 18px; }
  .card li { margin-bottom: 6px; }

  .senal-row {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid transparent; user-select: none;
  }
  .senal-row:hover { background: var(--bg3); }
  .senal-row.on { background: rgba(52,211,153,.08); border-color: rgba(52,211,153,.4); }
  .senal-row input { margin-top: 4px; accent-color: var(--green); cursor: pointer; }
  .meter { margin-top: 12px; }
  .meter .lbl { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; color: var(--muted); }
  .meter .bar { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
  .meter .fill { height: 100%; transition: width .3s, background .3s; border-radius: 5px; }

  pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.5;
    font-family: "Cascadia Code", Consolas, monospace; color: #d6ccff;
  }
  .lbl-count { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }

  .empty { color: var(--muted); text-align: center; padding: 40px; font-size: 16px; }

  /* Diagnostic */
  .diag-intro { color: var(--muted); margin-bottom: 16px; }
  .diag-symp {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid var(--border); background: var(--bg2); user-select: none;
  }
  .diag-symp.on { background: rgba(167,139,250,.1); border-color: var(--accent); }
  .diag-symp input { margin-top: 4px; accent-color: var(--accent); cursor: pointer; }
  .result-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 8px; cursor: pointer;
  }
  .result-item .score { margin-left: auto; font-weight: 700; color: var(--accent2); }
  .result-item .matchbar { height: 6px; background: var(--bg); border-radius: 3px; width: 60px; overflow: hidden; margin-left: 10px; }
  .result-item .matchbar .fill { height: 100%; background: var(--accent2); }

  /* Quiz */
  .quiz-q {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
  }
  .quiz-q .q { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .quiz-q .patron-tag { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .opt {
    display: block; padding: 10px 12px; margin-bottom: 8px; border-radius: 8px;
    border: 1px solid var(--border); cursor: pointer; background: var(--bg);
    transition: all .15s;
  }
  .opt:hover { border-color: var(--accent); }
  .opt.selected { border-color: var(--accent); background: rgba(167,139,250,.12); }
  .opt.correct { border-color: var(--green); background: rgba(52,211,153,.12); }
  .opt.wrong { border-color: var(--red); background: rgba(248,113,113,.12); }
  .quiz-actions { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
  .btn {
    padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--text); cursor: pointer; font-size: 14px;
  }
  .btn.primary { background: var(--accent); color: #111; border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .quiz-score { font-size: 14px; color: var(--muted); }
  .quiz-result { font-size: 18px; font-weight: 700; padding: 12px; border-radius: 10px; text-align: center; margin-top: 10px; }
  .code-block { position: relative; }
  .code-block .lang {
    position: absolute; top: 8px; right: 12px; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px;
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .tabs button {
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--muted); cursor: pointer; font-size: 13px;
  }
  .tabs button.active { background: var(--accent); color: #111; border-color: var(--accent); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>SOLID <span>y principios</span></h1>
    <div class="search" v-if="view !== 'diagnostico'">
      <input type="text" v-model="query" placeholder="Buscar principio, síntoma, código...">
    </div>
    <nav class="views">
      <button :class="{active: view==='estudio'}" @click="view='estudio'">Estudio</button>
      <button :class="{active: view==='diagnostico'}" @click="view='diagnostico'">Diagnóstico</button>
      <button :class="{active: view==='quiz'}" @click="view='quiz'">Quiz</button>
    </nav>
  </header>

  <main>
    <aside v-if="view==='estudio'">
      <div class="progress">
        <div>Progreso: <b>{{ studiedCount }} / {{ techniques.length }}</b> principios dominados</div>
        <div class="bar"><div class="fill" :style="{width: (studiedCount/techniques.length*100)+'%'}"></div></div>
      </div>
      <template v-for="cat in categories" :key="cat.id">
        <div class="cat">
          <div class="cat-title">{{ cat.label }}</div>
          <button v-for="t in filteredByCat(cat.id)" :key="t.id"
                  class="item" :class="{active: current.id===t.id}"
                  @click="selectTechnique(t)">
            <span class="dot" :style="{background: catColor(cat.id)}"></span>
            <span>{{ t.name }}</span>
            <span v-if="studied.includes(t.id)" class="studied">listo</span>
          </button>
        </div>
      </template>
    </aside>

    <section class="content">

      <template v-if="view==='estudio'">
        <div v-if="current">
          <div class="pattern-head">
            <h2>{{ current.name }}</h2>
            <span class="badge" :class="'badge-'+current.categoria">{{ catLabel(current.categoria) }}</span>
            <button class="btn" :class="{primary: studied.includes(current.id)}"
                    @click="toggleStudied(current.id)">
              {{ studied.includes(current.id) ? 'Marcada como dominada' : 'Marcar como dominada' }}
            </button>
          </div>
          <p class="concepto">«{{ current.concepto }}»</p>

          <div class="tabs">
            <button v-for="t in tabs" :key="t.id" :class="{active: tab===t.id}" @click="tab=t.id">{{ t.label }}</button>
          </div>

          <template v-if="tab==='guiarapida'">
            <div class="card">
              <h3>Problema que resuelve</h3>
              <p>{{ current.problema }}</p>
            </div>
            <div class="grid2">
              <div class="card">
                <h3>Señales de que lo necesitas</h3>
                <ul>
                  <li v-for="s in current.senales" :key="s">{{ s }}</li>
                </ul>
              </div>
              <div class="card">
                <h3>Cuándo NO usarlo</h3>
                <ul>
                  <li v-for="n in current.noUsar" :key="n">{{ n }}</li>
                </ul>
              </div>
            </div>
            <div class="card">
              <h3>Alternativas a considerar</h3>
              <ul>
                <li v-for="a in current.alternativas" :key="a">{{ a }}</li>
              </ul>
            </div>
            <div class="card">
              <h3>Anti-patrón / olor de código que corrige</h3>
              <p>{{ current.antipatron }}</p>
            </div>
          </template>

          <template v-if="tab==='casos'">
            <div class="card">
              <h3>Casos de uso reales</h3>
              <ul>
                <li v-for="c in current.casos" :key="c">{{ c }}</li>
              </ul>
            </div>
            <div class="card">
              <h3>Análisis: ¿cómo reconocerlo en la práctica?</h3>
              <p>{{ current.analisis }}</p>
            </div>
          </template>

          <template v-if="tab==='autodiagnostico'">
            <div class="card">
              <h3>¿Se aplica a tu código? Marca las señales que veas</h3>
              <div v-for="s in current.senales" :key="s" class="senal-row" :class="{on: estado[current.id] && estado[current.id][s]}" @click="toggleSenal(s)">
                <input type="checkbox" :checked="estado[current.id] && estado[current.id][s]" @click.stop>
                <span>{{ s }}</span>
              </div>
              <div class="meter">
                <div class="lbl"><span>Coincidencia</span><span>{{ senalPct }}%</span></div>
                <div class="bar"><div class="fill" :style="{width: senalPct+'%', background: senalColor}"></div></div>
              </div>
              <div class="lbl-count" v-if="senalPct >= 50">
                Alta coincidencia con este principio. Revisa los casos de uso y el ejemplo antes/después para confirmarlo.
              </div>
              <div class="lbl-count" v-else-if="senalPct > 0">
                Baja coincidencia. Verifica los casos de uso o explora otros principios en el Diagnóstico.
              </div>
              <div class="lbl-count" v-else>
                Sin señales marcadas todavía.
              </div>
            </div>
          </template>

          <template v-if="tab==='ejemplo'">
            <div class="card">
              <h3>Ejemplo antes / después</h3>
              <div class="code-block">
                <span class="lang">pseudocódigo</span>
                <pre>{{ current.ejemplo }}</pre>
              </div>
              <p style="margin-top:10px; color: var(--muted);">{{ current.explicacion }}</p>
            </div>
          </template>

        </div>
        <div v-else class="empty">Sin resultados para «{{ query }}».</div>
      </template>

      <template v-if="view==='diagnostico'">
        <h2 style="margin-bottom:6px;">Diagnóstico de SOLID y principios</h2>
        <p class="diag-intro">
          Marca los síntomas que estés viendo en tu código. La app te sugerirá
          los principios con mayor coincidencia. Añade tantos como quieras; ordena por relevancia.
        </p>
        <div v-for="s in allSymptoms" :key="s.text" class="diag-symp" :class="{on: diagSelected.includes(s.text)}" @click="toggleDiag(s.text)">
          <input type="checkbox" :checked="diagSelected.includes(s.text)" @click.stop>
          <span>{{ s.text }}</span>
        </div>
        <h3 style="margin:24px 0 12px;">Principios sugeridos ({{ sortedResults.length }})</h3>
        <div v-if="sortedResults.length" class="result-item" v-for="r in sortedResults" :key="r.t.id" @click="openTechnique(r.t)">
          <span class="dot" :style="{background: catColor(r.t.categoria)}"></span>
          <span>{{ r.t.name }}</span>
          <span class="matchbar"><span class="fill" :style="{width: (r.score/maxScore*100)+'%'}"></span></span>
          <span class="score">{{ r.score }}</span>
        </div>
        <div v-else class="empty">Marca algún síntoma para obtener recomendaciones.</div>
      </template>

      <template v-if="view==='quiz'">
        <div class="quiz-actions">
          <button class="btn" :disabled="submitted" @click="submitQuiz">Corregir</button>
          <button class="btn" @click="resetQuiz">Reiniciar</button>
          <span class="quiz-score" v-if="submitted">Puntaje: {{ score }}/{{ quiz.length }}</span>
          <span class="quiz-score" v-else>Respondidas: {{ answeredCount }}/{{ quiz.length }}</span>
        </div>
        <div class="quiz-q" v-for="(q, i) in quiz" :key="q.id">
          <div class="patron-tag">{{ q.tema }} — Pregunta {{ i+1 }}</div>
          <div class="q">{{ q.question }}</div>
          <div v-for="o in q.options" :key="o" class="opt"
               :class="{
                 selected: answers[q.id]===o,
                 correct: submitted && o===q.answer,
                 wrong: submitted && answers[q.id]===o && o!==q.answer
               }"
               @click="!submitted && (answers[q.id]=o)">
            {{ o }}
          </div>
          <div v-if="submitted" class="quiz-result" :style="{background: q.answer===answers[q.id] ? 'rgba(52,211,153,.1)' : 'rgba(248,113,113,.1)', color: q.answer===answers[q.id] ? 'var(--green)' : 'var(--red)'}">
            {{ q.answer===answers[q.id] ? 'Correcto' : 'Incorrecto — respuesta: ' + q.answer }}
          </div>
        </div>
      </template>

    </section>
  </main>
</div>

<script>
const { createApp } = Vue;

const techniques = [
  {
    id: "srp", name: "SRP — Responsabilidad única", categoria: "solid",
    concepto: "Una clase debe tener una sola razón para cambiar: una única responsabilidad, un único motivo de modificación.",
    problema: "Una misma clase agrupa responsabilidades que cambian por motivos distintos: validación, persistencia, presentación o notificación. Cuando la regla de negocio cambia, tocas la misma clase que toca la base de datos y cada cambio exige re-probar todo. Ejemplo violador: class Factura { calcularTotal(); guardarEnBD(); enviarEmail(); }.",
    senales: [
      "Una clase cambia por motivos distintos (negocio + persistencia + presentación).",
      "Necesito mockear demasiadas dependencias ajenas para probar la clase.",
      "Un cambio pequeño en una regla obliga a tocar partes no relacionadas.",
      "Al nombrar la clase no encuentro un sustantivo único que la describa."
    ],
    noUsar: [
      "SRP llevado al extremo: crear una clase por cada método trivial (sobre-fragmentación).",
      "Si separar añade más indirección que la complejidad que elimina."
    ],
    alternativas: [
      "Extraer clases por responsabilidad (repositorio, servicio, presentador).",
      "Niveles de arquitectura: lógica de negocio, persistencia y presentación en capas.",
      "Facade si las responsabilidades son estrechas y siempre se usan juntas."
    ],
    antipatron: "God Class: una clase que lo sabe y lo hace todo, difícil de probar y de modificar.",
    casos: [
      "Separar una clase Factura que calculaba, persistía y enviaba el email.",
      "Sacar la persistencia de una entidad de negocio a un repositorio.",
      "Mover el formateo de salida a un presentador o vista."
    ],
    analisis: "Pregunta: '¿qué razones tendría esta clase para cambiar?'. Si la respuesta incluye dos motivos no relacionados (cambia la regla fiscal Y cambia el esquema de la BD), tiene dos responsabilidades. Cada motivo debe vivir en su propia clase o módulo.",
    ejemplo:
`// ANTES: una clase con tres responsabilidades
class Factura {
  calcularTotal() { /* lógica de negocio */ }
  guardarEnBD() { /* persistencia */ }
  enviarEmail() { /* notificación */ }
}

// DESPUÉS: cada responsabilidad tiene su clase
class Factura {
  calcularTotal() { /* solo cálculo */ }
}
class RepositorioFacturas {
  guardar(factura) { /* persistencia */ }
}
class Notificador {
  enviarEmail(factura) { /* notificación */ }
}`,
    explicacion: "La clase Factura solo cambia cuando cambia la lógica del negocio. La persistencia y la notificación viven aparte y se prueban por separado. Cada motivo de cambio toca exactamente una clase."
  },
  {
    id: "ocp", name: "OCP — Abierto/Cerrado", categoria: "solid",
    concepto: "Las entidades deben estar abiertas para extensión y cerradas para modificación: añadir comportamiento sin tocar el código existente.",
    problema: "Cada nuevo caso (impuesto, formato, tipo de pago) obliga a abrir el switch o el if existente, modificarlo y re-probar todo. La clase crece con condicionales que se ramifican y los clientes quedan acoplados a la lista de casos. Ejemplo violador: switch (pedido.pais) { case 'ES': ... case 'MX': ... }.",
    senales: [
      "Cada variante nueva obliga a editar un switch o if existente.",
      "El mismo condicional de tipo aparece repetido en varios métodos.",
      "Los clientes deben conocer la lista completa de casos para llamar bien.",
      "Añadir una variante afecta o rompe a las existentes."
    ],
    noUsar: [
      "No crees abstracciones por adelantado: OCP no obliga a diseñar para variantes que aún no existen.",
      "No significa 'nunca tocar código existente': la refactorización previa también modifica."
    ],
    alternativas: [
      "Strategy para intercambiar algoritmos sin tocar al cliente.",
      "Template Method cuando el flujo es fijo y solo varían pasos.",
      "Interfaces y polimorfismo en lugar de condicionales de tipo."
    ],
    antipatron: "Switch Statement: cada tipo nuevo exige tocar el switch y volver a validar todo lo demás.",
    casos: [
      "Añadir un impuesto por país sin modificar la función de cálculo existente.",
      "Nuevos formatos de exportación (JSON, CSV, XML) como estrategias.",
      "Métodos de pago nuevos implementando la misma interfaz."
    ],
    analisis: "Si la frase 'para añadir X tengo que tocar el switch' aparece en tu código, reemplaza el condicional por polimorfismo: cada variante es una clase nueva que implementa un contrato. El código existente queda cerrado a modificación.",
    ejemplo:
`// ANTES: cada impuesto nuevo exige editar el switch
function calcularImpuesto(pedido) {
  switch (pedido.pais) {
    case 'ES': return pedido.total * 0.21;
    case 'MX': return pedido.total * 0.16;
    default: return 0;
  }
}

// DESPUÉS: abierto a extensión con Strategy
class ImpuestoEspanol { calcular(t) { return t * 0.21; } }
class ImpuestoMexicano { calcular(t) { return t * 0.16; } }
function calcularImpuesto(pedido) {
  return pedido.estrategiaImpuesto.calcular(pedido.total);
}`,
    explicacion: "Añadir 'ImpuestoAleman' es crear una clase: nada existente se modifica. El switch desapareció y cada variante se prueba de forma aislada."
  },
  {
    id: "lsp", name: "LSP — Sustitución de Liskov", categoria: "solid",
    concepto: "Los subtipos deben poder reemplazar a su tipo base sin alterar la corrección del programa ni sorprender a sus usuarios.",

    antipatron: "God Class / clases con responsabilidades mezcladas donde nada tiene que ver con nada.",
    casos: [
      "Separar persistencia (RepositorioUsuario) de negocio (Usuario).",
      "Sacar el formateo a una vista en vez de un método HTML en la entidad.",
      "Agrupar los campos de dirección en una clase Direccion cohesionada."
    ],
    analisis: "Abre la clase y agrupa por temas: ¿cuántos temas distintos aparecen? Si hay más de uno y sus campos no se tocan entre sí, baja cohesión: sepáralos en clases por tema.",
    ejemplo:
`// ANTES: baja cohesión, temas mezclados
class Usuario {
  constructor() { this.nombre = ''; }
  calcularDescuento() { /* negocio */ }
  guardar() { /* persistencia */ }
  formatearHTML() { /* presentación */ }
}

// DESPUÉS: cada tema tiene su clase cohesionada
class Usuario {
  constructor() { this.nombre = ''; }
  calcularDescuento() { /* negocio */ }
}
class RepositorioUsuario {
  guardar(usuario) { /* persistencia */ }
}
class VistaUsuario {
  formatearHTML(usuario) { /* presentación */ }
}`,
    explicacion: "Cada clase agrupa lo que pertenece junto y se prueba de forma aislada. La clase Usuario solo cambia por motivos de negocio."
  },
  {
    id: "acoplamiento", name: "Acoplamiento", categoria: "calidad",
    concepto: "Minimiza las dependencias entre módulos: cada uno debe conocer lo imprescindible de los demás y acoplarse a contratos estables.",
    problema: "Las clases dependen de detalles internos ajenos (implementaciones concretas, estructuras, navegación interna). Un cambio en un módulo provoca cambios en cascada en todos los que dependen de él. Ejemplo violador: conexion.crearPool().configurar(5).conectar() dentro de la lógica de negocio.",
    senales: [
      "Un cambio en un módulo obliga a tocar varios módulos ajenos.",
      "La clase conoce implementaciones concretas en vez de contratos.",
      "Las clases se acoplan a la estructura interna de otras (cadenas de getters).",
      "Para usar una clase necesitas conocer demasiado de sus dependencias."
    ],
    noUsar: [
      "Cero acoplamiento es imposible: algo tiene que conectarse.",
      "El objetivo es acoplamiento bajo y estable (a abstracciones), no acoplamiento nulo."
    ],
    alternativas: [
      "Depender de interfaces o abstracciones (DIP).",
      "Pasar dependencias inyectadas en vez de crearlas o navegarlas.",
      "Diseñar APIs públicas pequeñas y estables."
    ],
    antipatron: "Acoplamiento rígido: cambios en cascada, pruebas con infraestructura real y código frágil.",
    casos: [
      "Factura usa un Repositorio inyectado en vez de crear la conexión.",
      "Los clientes llaman a pedido.ciudadDelCliente() en vez de navegar la estructura.",
      "Servicios que dependen de contratos (Notificador, Repositorio) intercambiables."
    ],
    analisis: "Mide el acoplamiento con preguntas: '¿cuántos archivos cambian si este módulo cambia?' y '¿cuánto necesito saber de X para usarlo?'. Si las respuestas son altas, introduce contratos y rompe el conocimiento de detalles.",
    ejemplo:
`// ANTES: la clase conoce demasiado de la infraestructura
class Factura {
  imprimir(conexion) {
    conexion.crearPool().configurar(5).conectar();
    conexion.sacarTabla('facturas').insertar(this);
  }
}

// DESPUÉS: acoplamiento bajo a un contrato estable
class Factura {
  imprimir(repositorio) {
    repositorio.guardarFactura(this);
  }
}`,
    explicacion: "Factura ya no conoce pools, conexiones ni tablas: depende del contrato Repositorio. Cambiar la infraestructura no toca la lógica de negocio."
  },
  {
    id: "encapsulacion", name: "Encapsulación", categoria: "calidad",
    concepto: "Oculta el estado interno de un objeto y expón una interfaz controlada. Nadie fuera debe manipular la representación interna.",
    problema: "El estado interno se expone públicamente y cualquiera puede mutarlo sin reglas: una Cuenta deja que le resten saldo arbitrariamente o una lista se modifica desde fuera sin validación. Los invariantes se rompen y los bugs aparecen lejos. Ejemplo violador: cuenta.saldo -= 9999 desde cualquier parte del código.",
    senales: [
      "Campos públicos mutados directamente desde fuera de la clase.",
      "Las colecciones internas se modifican desde fuera (push, splice).",
      "Cambiar la representación interna obligaría a tocar todos los accesos.",
      "No hay validación centralizada al escribir un valor."
    ],
    noUsar: [
      "DTOs y value objects inmutables pueden exponer datos sin métodos.",
      "No envuelvas todo en getters/setters triviales: encapsula cuando hay reglas o representación que proteger."
    ],
    alternativas: [
      "Campos privados + métodos de comportamiento con validación.",
      "Copia defensiva al devolver colecciones internas.",
      "Inmutabilidad: valores que no cambian después de crearse."
    ],
    antipatron: "Estado mutable expuesto: campos públicos y colecciones a la vista que permiten romper los invariantes.",
    casos: [
      "Cuenta con retirar(monto) validando saldo en vez de saldo público.",
      "Pedido con agregarItem() que valida precios en vez de items.push().",
      "Copia defensiva: getItems() devuelve una copia, no la lista real."
    ],
    analisis: "Si desde fuera de la clase se puede dejar al objeto en un estado inválido (saldo negativo, pedido vacío ilegal), la encapsulación falló: cubre los campos, valida en los métodos y devuelve copias.",
    ejemplo:
`// ANTES: estado expuesto y mutable desde cualquier parte
class Cuenta {
  constructor() { this.saldo = 0; }
}
// ...en otro módulo:
cuenta.saldo -= 9999;  // sin control: puede quedar negativa

// DESPUÉS: estado oculto con interfaz controlada
class Cuenta {
  constructor() { this._saldo = 0; }
  retirar(monto) {
    if (monto > this._saldo) throw new Error('saldo insuficiente');
    this._saldo -= monto;
  }
  consultarSaldo() { return this._saldo; }
}`,
    explicacion: "Nadie puede dejar la cuenta en un estado inválido: la regla de saldo vive en retirar(). Si mañana el saldo se guarda en centavos, solo cambia la clase Cuenta."
  }
];

const quiz = [
  { id: "q1", tema: "SOLID", question: "Una clase Factura calcula totales, se guarda en la base de datos y envía emails. ¿Qué principio viola?",
    options: ["DIP", "SRP", "LSP", "OCP"], answer: "SRP" },
  { id: "q2", tema: "SOLID", question: "Añadir un nuevo tipo de impuesto obliga a editar un switch existente y a re-probar todo. ¿Qué principio pide que puedas añadir variantes sin modificar lo existente?",
    options: ["SRP", "ISP", "DIP", "OCP"], answer: "OCP" },
  { id: "q3", tema: "SOLID", question: "class Cuadrado extends Rectangulo redefine setAncho() de forma que rompe las expectativas de quien usa Rectangulo. ¿Qué principio se viola?",
    options: ["LSP", "DIP", "YAGNI", "KISS"], answer: "LSP" },
  { id: "q4", tema: "SOLID", question: "Una interfaz Trabajador obliga a Cocinero a implementar volar() y nadar(), ambos lanzando 'no soportado'. ¿Qué principio sugiere dividirla?",
    options: ["DIP", "ISP", "OCP", "Ley de Demeter"], answer: "ISP" },
  { id: "q5", tema: "SOLID", question: "Un servicio crea internamente new RepositorioMySQL() y ahora hay que cambiarlo por un repositorio en memoria para los tests. ¿Qué principio recomienda inyectar la abstracción?",
    options: ["DRY", "KISS", "DIP", "Composición sobre herencia"], answer: "DIP" },
  { id: "q6", tema: "Principios de diseño", question: "Construí un motor de plugins genérico y configurable 'por si acaso', aunque nadie lo pidió. ¿Qué principio estoy ignorando?",
    options: ["KISS", "YAGNI", "DRY", "OCP"], answer: "YAGNI" },
  { id: "q7", tema: "Principios de diseño", question: "Resolví un problema con una estructura de datos exótica y un algoritmo complejo cuando un simple for resolvía lo mismo. ¿Qué principio pide la solución más simple?",
    options: ["LSP", "SRP", "KISS", "ISP"], answer: "KISS" },
  { id: "q8", tema: "Principios de diseño", question: "Copié el cálculo del IVA en 5 módulos y cada cambio debe replicarse manualmente. ¿Qué principio se viola?",
    options: ["DRY", "YAGNI", "Tell-Don't-Ask", "DIP"], answer: "DRY" },
  { id: "q9", tema: "Principios de diseño", question: "pedido.cliente.direccion.ciudad() — una clase atraviesa la estructura de sus vecinos para llegar a un dato lejano. ¿Qué principio se viola?",
    options: ["Tell-Don't-Ask", "Ley de Demeter", "KISS", "SRP"], answer: "Ley de Demeter" },
  { id: "q10", tema: "Principios de diseño", question: "Heredé de Stack solo para reutilizar push() y pop() en una clase que no es una pila. ¿Qué recomienda el principio de composición sobre herencia?",
    options: ["Usar herencia múltiple", "Extraer una superclase genérica", "Componer: guardar un Stack interno y delegar solo lo necesario", "Duplicar el código en la clase"], answer: "Componer: guardar un Stack interno y delegar solo lo necesario" }
];

createApp({
  data() {
    return {
      techniques,
      quiz,
      view: "estudio",
      query: "",
      tab: "guiarapida",
      tabs: [
        { id: "guiarapida", label: "Guía rápida" },
        { id: "casos", label: "Casos de uso" },
        { id: "autodiagnostico", label: "Autodiagnóstico" },
        { id: "ejemplo", label: "Ejemplo" }
      ],
      categories: [
        { id: "solid", label: "SOLID" },
        { id: "diseno", label: "Principios de diseño" },
        { id: "calidad", label: "Calidad del código" }
      ],
      current: techniques[0],
      estado: JSON.parse(localStorage.getItem("solid_estado") || "{}"),
      studied: JSON.parse(localStorage.getItem("solid_studied") || "[]"),
      diagSelected: JSON.parse(localStorage.getItem("solid_diag") || "[]"),
      submitted: false,
      answers: {}
    };
  },
  computed: {
    studiedCount() { return this.studied.length; },
    senalPct() {
      const cur = this.estado[this.current.id] || {};
      const total = this.current.senales.length;
      const on = Object.values(cur).filter(Boolean).length;
      return Math.round(on / total * 100);
    },
    senalColor() {
      const p = this.senalPct;
      return p >= 50 ? "#34d399" : p > 0 ? "#fbbf24" : "#2f2847";
    },
    allSymptoms() {
      const seen = new Map();
      for (const t of this.techniques) {
        for (const s of t.senales) {
          if (!seen.has(s)) seen.set(s, []);
          seen.get(s).push(t.id);
        }
      }
      return Array.from(seen, ([text, tecnicas]) => ({ text, tecnicas }));
    },
    sortedResults() {
      if (!this.diagSelected.length) return [];
      const scores = {};
      for (const t of this.techniques) scores[t.id] = 0;
      for (const s of this.allSymptoms) {
        if (this.diagSelected.includes(s.text)) {
          s.tecnicas.forEach(tid => { scores[tid]++; });
        }
      }
      return Object.entries(scores)
        .filter(([, n]) => n > 0)
        .map(([tid, score]) => ({ t: this.techniques.find(x => x.id === tid), score }))
        .sort((a, b) => b.score - a.score);
    },
    maxScore() {
      const r = this.sortedResults;
      return r.length ? r[0].score : 1;
    },
    filteredPatterns() {
      const q = this.query.trim().toLowerCase();
      if (!q) return this.techniques;
      return this.techniques.filter(t => {
        const hay = [t.name, t.concepto, t.problema, ...t.senales, ...t.casos].join(" ").toLowerCase();
        return hay.includes(q);
      });
    },
    score() {
      return this.quiz.reduce((acc, q) => acc + (this.answers[q.id] === q.answer ? 1 : 0), 0);
    },
    answeredCount() {
      return this.quiz.filter(q => this.answers[q.id]).length;
    }
  },
  methods: {
    selectTechnique(t) { this.current = t; this.tab = "guiarapida"; },
    filteredByCat(catId) {
      return this.filteredPatterns.filter(t => t.categoria === catId);
    },
    catColor(cat) {
      return {
        solid: "#a78bfa", diseno: "#fbbf24", calidad: "#34d399"
      }[cat] || "#fff";
    },
    catLabel(cat) {
      const c = this.categories.find(x => x.id === cat);
      return c ? c.label : cat;
    },
    toggleStudied(id) {
      if (this.studied.includes(id)) this.studied = this.studied.filter(x => x !== id);
      else this.studied.push(id);
      localStorage.setItem("solid_studied", JSON.stringify(this.studied));
    },
    toggleSenal(s) {
      if (!this.estado[this.current.id]) this.estado[this.current.id] = {};
      this.estado[this.current.id][s] = !this.estado[this.current.id][s];
      localStorage.setItem("solid_estado", JSON.stringify(this.estado));
    },
    toggleDiag(s) {
      if (this.diagSelected.includes(s)) this.diagSelected = this.diagSelected.filter(x => x !== s);
      else this.diagSelected.push(s);
      localStorage.setItem("solid_diag", JSON.stringify(this.diagSelected));
    },
    openTechnique(t) {
      this.current = t;
      this.view = "estudio";
      this.tab = "guiarapida";
    },
    submitQuiz() { this.submitted = true; },
    resetQuiz() {
      this.answers = {};
      this.submitted = false;
    }
  },
  watch: {
    view(v) { if (v === "quiz") this.submitted = false; }
  }
}).mount("#app");
</script>
