<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testing — Guía Interactiva</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #171a23;
    --bg3: #1f2330;
    --border: #2a2f3d;
    --text: #e6e9f0;
    --muted: #9aa3b5;
    --accent: #34d399;
    --accent2: #6ee7b7;
    --green: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
    --teal: #2dd4bf;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px; background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 18px; letter-spacing: .3px; white-space: nowrap; }
  header h1 span { color: var(--accent2); }
  header .search { flex: 1; min-width: 220px; display: flex; }
  header .search input {
    width: 100%; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); outline: none; font-size: 14px;
  }
  header .search input:focus { border-color: var(--accent); }
  nav.views { display: flex; gap: 6px; }
  nav.views button {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--muted); cursor: pointer; font-size: 14px;
  }
  nav.views button.active { background: var(--accent); color: #111; border-color: var(--accent); }

  main { flex: 1; display: flex; overflow: hidden; }

  aside {
    width: 320px; background: var(--bg2); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 12px;
  }
  aside .cat { margin-bottom: 8px; }
  aside .cat-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); padding: 8px 10px 4px; font-weight: 700;
  }
  aside button.item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 10px; border: 1px solid transparent; border-radius: 8px;
    background: transparent; color: var(--text); cursor: pointer;
    text-align: left; font-size: 14px; margin-bottom: 2px;
  }
  aside button.item:hover { background: var(--bg3); }
  aside button.item.active { background: var(--bg3); border-color: var(--border); }
  aside button.item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  aside button.item .studied { margin-left: auto; color: var(--green); font-size: 12px; }
  aside .progress {
    padding: 12px 10px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
  }
  aside .progress .bar {
    height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-top: 6px;
  }
  aside .progress .fill { height: 100%; background: var(--green); transition: width .3s; }

  section.content { flex: 1; overflow-y: auto; padding: 24px 32px; }
  .pattern-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .pattern-head h2 { font-size: 26px; }
  .badge {
    padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .badge-fundamentos { background: rgba(52,211,153,.15); color: var(--accent); }
  .badge-tecnicas { background: rgba(110,231,183,.15); color: var(--accent2); }
  .badge-calidad { background: rgba(45,212,191,.15); color: var(--teal); }
  .concepto { color: var(--muted); font-size: 16px; margin-bottom: 20px; font-style: italic; }

  .card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
  }
  .card h3 {
    font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 10px; color: var(--accent2);
  }
  .card h3.none { color: var(--red); }
  .card p, .card li { color: var(--text); }
  .card ul { padding-left: 18px; }
  .card li { margin-bottom: 6px; }

  .senal-row {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid transparent; user-select: none;
  }
  .senal-row:hover { background: var(--bg3); }
  .senal-row.on { background: rgba(52,211,153,.08); border-color: rgba(52,211,153,.4); }
  .senal-row input { margin-top: 4px; accent-color: var(--green); cursor: pointer; }
  .meter { margin-top: 12px; }
  .meter .lbl { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; color: var(--muted); }
  .meter .bar { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
  .meter .fill { height: 100%; transition: width .3s, background .3s; border-radius: 5px; }

  pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.5;
    font-family: "Cascadia Code", Consolas, monospace; color: #c7d2fe;
  }
  .lbl-count { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }

  .empty { color: var(--muted); text-align: center; padding: 40px; font-size: 16px; }

  .diag-intro { color: var(--muted); margin-bottom: 16px; }
  .diag-symp {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid var(--border); background: var(--bg2); user-select: none;
  }
  .diag-symp.on { background: rgba(52,211,153,.1); border-color: var(--accent); }
  .diag-symp input { margin-top: 4px; accent-color: var(--accent); cursor: pointer; }
  .result-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 8px; cursor: pointer;
  }
  .result-item .score { margin-left: auto; font-weight: 700; color: var(--accent2); }
  .result-item .matchbar { height: 6px; background: var(--bg); border-radius: 3px; width: 60px; overflow: hidden; margin-left: 10px; }
  .result-item .matchbar .fill { height: 100%; background: var(--accent2); }

  .quiz-q {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
  }
  .quiz-q .q { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .quiz-q .patron-tag { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .opt {
    display: block; padding: 10px 12px; margin-bottom: 8px; border-radius: 8px;
    border: 1px solid var(--border); cursor: pointer; background: var(--bg);
    transition: all .15s;
  }
  .opt:hover { border-color: var(--accent); }
  .opt.selected { border-color: var(--accent); background: rgba(52,211,153,.12); }
  .opt.correct { border-color: var(--green); background: rgba(52,211,153,.12); }
  .opt.wrong { border-color: var(--red); background: rgba(248,113,113,.12); }
  .quiz-actions { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
  .btn {
    padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--text); cursor: pointer; font-size: 14px;
  }
  .btn.primary { background: var(--accent); color: #111; border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .quiz-score { font-size: 14px; color: var(--muted); }
  .quiz-result { font-size: 18px; font-weight: 700; padding: 12px; border-radius: 10px; text-align: center; margin-top: 10px; }
  .code-block { position: relative; }
  .code-block .lang {
    position: absolute; top: 8px; right: 12px; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px;
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .tabs button {
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--muted); cursor: pointer; font-size: 13px;
  }
  .tabs button.active { background: var(--accent); color: #111; border-color: var(--accent); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>Testing <span>Lab</span></h1>
    <div class="search" v-if="view !== 'diagnostico'">
      <input type="text" v-model="query" placeholder="Buscar técnica, síntoma, código...">
    </div>
    <nav class="views">
      <button :class="{active: view==='estudio'}" @click="view='estudio'">Estudio</button>
      <button :class="{active: view==='diagnostico'}" @click="view='diagnostico'">Diagnóstico</button>
      <button :class="{active: view==='quiz'}" @click="view='quiz'">Quiz</button>
    </nav>
  </header>

  <main>
    <aside v-if="view==='estudio'">
      <div class="progress">
        <div>Progreso: <b>{{ studiedCount }} / {{ techniques.length }}</b> técnicas dominadas</div>
        <div class="bar"><div class="fill" :style="{width: (studiedCount/techniques.length*100)+'%'}"></div></div>
      </div>
      <template v-for="cat in categories" :key="cat.id">
        <div class="cat">
          <div class="cat-title">{{ cat.label }}</div>
          <button v-for="t in filteredByCat(cat.id)" :key="t.id"
                  class="item" :class="{active: current.id===t.id}"
                  @click="selectTechnique(t)">
            <span class="dot" :style="{background: catColor(cat.id)}"></span>
            <span>{{ t.name }}</span>
            <span v-if="studied.includes(t.id)" class="studied">listo</span>
          </button>
        </div>
      </template>
    </aside>

    <section class="content">

      <template v-if="view==='estudio'">
        <div v-if="current">
          <div class="pattern-head">
            <h2>{{ current.name }}</h2>
            <span class="badge" :class="'badge-'+current.categoria">{{ catLabel(current.categoria) }}</span>
            <button class="btn" :class="{primary: studied.includes(current.id)}"
                    @click="toggleStudied(current.id)">
              {{ studied.includes(current.id) ? 'Marcada como dominada' : 'Marcar como dominada' }}
            </button>
          </div>
          <p class="concepto">«{{ current.concepto }}»</p>

          <div class="tabs">
            <button v-for="t in tabs" :key="t.id" :class="{active: tab===t.id}" @click="tab=t.id">{{ t.label }}</button>
          </div>

          <template v-if="tab==='guiarapida'">
            <div class="card">
              <h3>Problema que resuelve</h3>
              <p>{{ current.problema }}</p>
            </div>
            <div class="grid2">
              <div class="card">
                <h3>Señales de que lo necesitas</h3>
                <ul>
                  <li v-for="s in current.senales" :key="s">{{ s }}</li>
                </ul>
              </div>
              <div class="card">
                <h3>Cuándo NO usarlo</h3>
                <ul>
                  <li v-for="n in current.noUsar" :key="n">{{ n }}</li>
                </ul>
              </div>
            </div>
            <div class="card">
              <h3>Alternativas a considerar</h3>
              <ul>
                <li v-for="a in current.alternativas" :key="a">{{ a }}</li>
              </ul>
            </div>
            <div class="card">
              <h3>Anti-patrón / olor de código que corrige</h3>
              <p>{{ current.antipatron }}</p>
            </div>
          </template>

          <template v-if="tab==='casos'">
            <div class="card">
              <h3>Casos de uso reales</h3>
              <ul>
                <li v-for="c in current.casos" :key="c">{{ c }}</li>
              </ul>
            </div>
            <div class="card">
              <h3>Análisis: ¿cómo reconocerlo en la práctica?</h3>
              <p>{{ current.analisis }}</p>
            </div>
          </template>

          <template v-if="tab==='autodiagnostico'">
            <div class="card">
              <h3>¿Se aplica a tu código? Marca las señales que veas</h3>
              <div v-for="s in current.senales" :key="s" class="senal-row" :class="{on: estado[current.id] && estado[current.id][s]}" @click="toggleSenal(s)">
                <input type="checkbox" :checked="estado[current.id] && estado[current.id][s]" @click.stop>
                <span>{{ s }}</span>
              </div>
              <div class="meter">
                <div class="lbl"><span>Coincidencia</span><span>{{ senalPct }}%</span></div>
                <div class="bar"><div class="fill" :style="{width: senalPct+'%', background: senalColor}"></div></div>
              </div>
              <div class="lbl-count" v-if="senalPct >= 50">
                Alta coincidencia con esta técnica. Revisa los casos de uso y el ejemplo antes/después para confirmarlo.
              </div>
              <div class="lbl-count" v-else-if="senalPct > 0">
                Baja coincidencia. Verifica los casos de uso o explora otras técnicas en el Diagnóstico.
              </div>
              <div class="lbl-count" v-else>
                Sin señales marcadas todavía.
              </div>
            </div>
          </template>

          <template v-if="tab==='ejemplo'">
            <div class="card">
              <h3>Ejemplo antes / después</h3>
              <div class="code-block">
                <span class="lang">pseudocódigo</span>
                <pre>{{ current.ejemplo }}</pre>
              </div>
              <p style="margin-top:10px; color: var(--muted);">{{ current.explicacion }}</p>
            </div>
          </template>

        </div>
        <div v-else class="empty">Sin resultados para «{{ query }}».</div>
      </template>

      <template v-if="view==='diagnostico'">
        <h2 style="margin-bottom:6px;">Diagnóstico de testing</h2>
        <p class="diag-intro">
          Marca los síntomas (señales) que estés viendo en tu trabajo con código. La app te sugerirá
          las técnicas de testing con mayor coincidencia. Añade tantas como quieras; ordena por relevancia.
        </p>
        <div v-for="s in allSymptoms" :key="s.text" class="diag-symp" :class="{on: diagSelected.includes(s.text)}" @click="toggleDiag(s.text)">
          <input type="checkbox" :checked="diagSelected.includes(s.text)" @click.stop>
          <span>{{ s.text }}</span>
        </div>
        <h3 style="margin:24px 0 12px;">Técnicas sugeridas ({{ sortedResults.length }})</h3>
        <div v-if="sortedResults.length" class="result-item" v-for="r in sortedResults" :key="r.t.id" @click="openTechnique(r.t)">
          <span class="dot" :style="{background: catColor(r.t.categoria)}"></span>
          <span>{{ r.t.name }}</span>
          <span class="matchbar"><span class="fill" :style="{width: (r.score/maxScore*100)+'%'}"></span></span>
          <span class="score">{{ r.score }}</span>
        </div>
        <div v-else class="empty">Marca algún síntoma para obtener recomendaciones.</div>
      </template>

      <template v-if="view==='quiz'">
        <div class="quiz-actions">
          <button class="btn" :disabled="submitted" @click="submitQuiz">Corregir</button>
          <button class="btn" @click="resetQuiz">Reiniciar</button>
          <span class="quiz-score" v-if="submitted">Puntaje: {{ score }}/{{ quiz.length }}</span>
          <span class="quiz-score" v-else>Respondidas: {{ answeredCount }}/{{ quiz.length }}</span>
        </div>
        <div class="quiz-q" v-for="(q, i) in quiz" :key="q.id">
          <div class="patron-tag">{{ q.tema }} — Pregunta {{ i+1 }}</div>
          <div class="q">{{ q.question }}</div>
          <div v-for="o in q.options" :key="o" class="opt"
               :class="{
                 selected: answers[q.id]===o,
                 correct: submitted && o===q.answer,
                 wrong: submitted && answers[q.id]===o && o!==q.answer
               }"
               @click="!submitted && (answers[q.id]=o)">
            {{ o }}
          </div>
          <div v-if="submitted" class="quiz-result" :style="{background: q.answer===answers[q.id] ? 'rgba(52,211,153,.1)' : 'rgba(248,113,113,.1)', color: q.answer===answers[q.id] ? 'var(--green)' : 'var(--red)'}">
            {{ q.answer===answers[q.id] ? 'Correcto' : 'Incorrecto — respuesta: ' + q.answer }}
          </div>
        </div>
      </template>

    </section>
  </main>
</div>

<script>
const { createApp } = Vue;

const techniques = [
  {
    id: "unitario", name: "Test unitario", categoria: "fundamentos",
    concepto: "Prueba aislada que verifica el comportamiento de una unidad mínima de código (función, método o clase) sin tocar base de datos, red ni servicios externos.",
    problema: "Sin una red de seguridad de tests unitarios, cualquier cambio en una función puede romper algo en silencio. Las regresiones aparecen en producción y refactorizar es una lotería.",
    senales: [
      "Hago un cambio en una función y no sé si rompí algo en otro módulo.",
      "El mismo error vuelve a aparecer después de 'corregirlo'.",
      "Refactorizo con miedo porque no hay nada que valide el comportamiento.",
      "Depuro con console.log para descubrir qué salió mal."
    ],
    noUsar: [
      "Para validar colaboración real con base de datos o APIs externas (eso es integración).",
      "Como sustituto de los tests E2E del flujo completo de usuario."
    ],
    alternativas: ["Test de integración para la colaboración entre módulos.", "Test E2E para flujos completos.", "Property-based testing para casos de borde automáticos."],
    antipatron: "Tests que prueban la implementación interna en lugar del comportamiento observable, o que tocan red y base de datos y se vuelven lentos y frágiles.",
    casos: [
      "Verificar que calcularDescuento() aplica el 10% sobre el total.",
      "Probar que la validación de email rechaza cadenas mal formadas.",
      "Asegurar que el parser de fechas soporta formato ISO 8601."
    ],
    analisis: "Si una función es determinista y sus dependencias se pueden sustituir fácilmente, es candidata a test unitario. La clave es el aislamiento: rápido, determinista y sin efectos externos.",
    ejemplo:
`// ANTES: cambio el cálculo de descuento sin red de seguridad
function calcularDescuento(total) { return total * 0.1; }

// DESPUÉS: el comportamiento queda fijado por un test
describe("calcularDescuento", () => {
  it("aplica 10% a un total de 1000", () => {
    assert.equal(calcularDescuento(1000), 100);
  });
  it("devuelve 0 cuando el total es 0", () => {
    assert.equal(calcularDescuento(0), 0);
  });
});`,
    explicacion: "El test define el comportamiento esperado y lo aísla de todo lo demás. Si alguien cambia el porcentaje a 0.2, el test fallará y avisará antes de llegar a producción."
  },
  {
    id: "integracion", name: "Test de integración", categoria: "fundamentos",
    concepto: "Prueba que verifica que dos o más módulos funcionan bien juntos: módulo + base de datos, módulo + API, servicio + repositorio.",
    problema: "Cada unidad funciona por separado pero la suma falla: formatos de fecha incompatibles, contratos de API que no coinciden, transacciones mal coordinadas.",
    senales: [
      "Dos módulos pasan sus tests por separado pero fallan al conectarse.",
      "Cambios en el esquema de la base de datos rompen el servicio.",
      "Los contratos entre servicios no están verificados por nadie.",
      "Sospecho que el problema está en la frontera entre componentes."
    ],
    noUsar: [
      "Para verificar una sola función sin colaboración: un unitario basta y es más rápido.",
      "No hagas integración sobre infraestructura que no controlas (usa doubles o contenedores aislados)."
    ],
    alternativas: ["Test unitario para la lógica interna de cada módulo.", "Test E2E si necesitas el flujo completo con interfaz de usuario."],
    antipatron: "Tests que dependen de una base de datos en red que no está en CI: lentos, flaky y que se olvidan de ejecutarse.",
    casos: [
      "Guardar y recuperar un pedido con su fecha intacta entre servicio y repositorio.",
      "Verificar que el adaptador de pagos convierte la respuesta de la API correctamente.",
      "Probar que la migración de esquema no rompe las consultas existentes."
    ],
    analisis: "Si el bug aparece 'en la frontera' (JSON que no se mapea, fechas que cambian de zona, IDs que no casan), es señal de que falta un test de integración que ejercite la colaboración real.",
    ejemplo:
`// ANTES: cada pieza funciona por separado, pero juntas fallan
// (el repositorio guarda en UTC y el servicio lee en local)

// DESPUÉS: un test de integración verifica la colaboración real
describe("PersistirPedido + Repositorio", () => {
  it("guarda y recupera un pedido con su fecha intacta", async () => {
    const pedido = new Pedido("P-1", new Date("2026-08-19T10:00:00Z"));
    await repositorio.guardar(pedido);
    const obtenido = await repositorio.porId("P-1");
    assert.equal(obtenido.fecha.toISOString(), pedido.fecha.toISOString());
  });
});`,
    explicacion: "El test levanta la pieza real (base de datos o API) y verifica la colaboración de verdad. Es más lento que uno unitario, por eso se reserva para las fronteras críticas."
  },
  {
    id: "e2e", name: "Test E2E", categoria: "fundamentos",
    concepto: "Prueba de extremo a extremo que recorre un flujo completo de usuario (login, carrito, pago) en el navegador, con la aplicación real y sus servicios.",
    problema: "Las unidades y los módulos funcionan, pero el usuario final encuentra errores: el botón no está, la navegación falla, la app no se carga. Nadie verifica la experiencia real completa.",
    senales: [
      "Cambios de UI rompen flujos enteros que los tests internos no detectan.",
      "El equipo no sabe si 'comprar un producto' funciona de principio a fin.",
      "Los errores de integración se descubren solo en producción.",
      "Hay que hacer la misma ruta a mano en cada release."
    ],
    noUsar: [
      "Para cubrir toda la lógica: son lentos y frágiles; la cobertura debe venir de los unitarios.",
      "En etapas tempranas sin interfaz estable: escribir E2E sobre UI que cambia a diario es carísimo."

  reloj.avanzar(59);
  assert.notOk(token.expirado());
  reloj.avanzar(1);
  assert.ok(token.expirado());
});`,
    explicacion: "Un test determinista tiene las mismas entradas y el mismo resultado siempre. Si el tiempo o la red son la causa de la inestabilidad, sustitúyelos por un doble controlado: el test deja de mentir."
  },
  {
    id: "mutation", name: "Mutation testing", categoria: "calidad",
    concepto: "Introducir pequeñas mutaciones (cambiar >= por >, invertir un if) en el código y comprobar que los tests las detectan. Mide la fuerza real de la suite.",
    problema: "La cobertura dice 100%, pero los tests no distinguen un código correcto de uno ligeramente roto: la suite aprueba mutaciones y las regresiones pasan a producción.",
    senales: [
      "La cobertura es alta pero los bugs siguen apareciendo.",
      "Cambié '>=' por '>' a propósito y el test seguía pasando.",
      "Los tests no comprueban valores de frontera ni ramas de error.",
      "La suite aprueba cambios que no debería aprobar."
    ],
    noUsar: [
      "Como bloqueo de CI permanente sin analizar los resultados (es costoso en tiempo).",
      "En suites enormes sin pre-filtrar por módulos: ejecútalo por partes."
    ],
    alternativas: ["Cobertura de ramas para empezar a ver huecos.", "Property-based testing para casos no escritos a mano."],
    antipatron: "Tests que son 'espejos' del código: verifican que la implementación hace lo que hace, no que hace lo que debe.",
    casos: [
      "Ejecutar mutantes en una función de cálculo de impuestos y ver cuáles sobreviven.",
      "Descubrir que el test de la condición '>= 18' no detecta un cambio a '> 18'.",
      "Priorizar dónde reforzar los tests según los mutantes que sobreviven."
    ],
    analisis: "Si un mutante sobrevive, hay un test que no protege esa decisión. Cada superviviente es una instrucción para escribir una mejor aserción o un caso de frontera.",
    ejemplo:
`// ANTES: un test que pasa aunque mute la condición del código
function esMayorEdad(edad) { return edad >= 18; }
it("acepta 18", () => assert.ok(esMayorEdad(18)));
// mutante: return edad > 18;  → el test NO lo detecta (18 sigue pasando)

// DESPUÉS: un mutante detectado por el test
function esMayorEdad(edad) { return edad >= 18; }
it("acepta 18", () => assert.ok(esMayorEdad(18)));
it("rechaza 17", () => assert.notOk(esMayorEdad(17)));
// mutante: return edad > 18;  → rechaza 17 (igual) pero 18 también falla: detectado`,
    explicacion: "Mutation testing responde a la pregunta '¿qué pasaría si alguien rompe esto sin querer?'. Los mutantes supervivientes son los huecos reales de la suite, por encima del porcentaje de cobertura."
  },
  {
    id: "snapshots", name: "Snapshot testing", categoria: "calidad",
    concepto: "Guardar la salida de un componente o función en un archivo de referencia y compararla en cada ejecución: un cambio no deseado de formato se detecta al instante.",
    problema: "Los outputs grandes (JSON de UI, renders, serializaciones) con muchos campos no se verifican a mano: o se ignoran o se prueban campo a campo con un test ilegible.",
    senales: [
      "El output de un componente o función es grande y con muchos campos.",
      "No tengo forma de saber si un cambio de UI rompió el render esperado.",
      "Los tests de render se vuelven montañas de asserts difíciles de mantener.",
      "Un cambio accidental de formato pasa desapercibido."
    ],
    noUsar: [
      "Como única verificación: un snapshot 'falso positivo' acepta cambios que debían fallar.",
      "Para lógica con valores volátiles (fechas, IDs aleatorios) sin normalizarlos.",
      "Actualizar el snapshot sin revisar el diff: es aprobar el cambio a ciegas."
    ],
    alternativas: ["Asserts específicos para el comportamiento clave.", "Pruebas de render semánticas que buscan texto y elementos reales."],
    antipatron: "Snapshot que se actualiza 'a lo loco' con --update: el test deja de detectar nada porque cualquier cambio se acepta sin revisar.",
    casos: [
      "Fijar el HTML que renderiza un componente de carrito.",
      "Verificar el JSON que devuelve un serializer de facturas.",
      "Detectar un cambio de estructura no intencionado en una refactorización."
    ],
    analisis: "El snapshot es un contrato visual/datos: sirve para detectar cambios, no para decidir si son correctos. Revísalos en la review y normaliza lo volátil para que el diff sea fiable.",
    ejemplo:
`// ANTES: verifico cada campo a mano y el test se vuelve frágil a cambios de formato
it("serializa el usuario", () => {
  assert.equal(serializar(u).nombre, "Ana");
  assert.equal(serializar(u).email, "ana@x.com");
  // ... 30 líneas más para campos irrelevantes
});

// DESPUÉS: el snapshot captura la salida completa de una vez
it("serializa el usuario de forma estable", () => {
  expect(serializar(u)).toMatchSnapshot();
});`,
    explicacion: "Los snapshots dan feedback inmediato cuando la salida cambia. Su fuerza está en el diff de la revisión: si el cambio es intencionado se actualiza, si no, es un bug detectado a tiempo."
  }
];

const quiz = [
  { id: "q1", tema: "Fundamentos", question: "¿Qué tipo de test verifica una unidad aislada de código sin tocar red, base de datos ni servicios externos?",
    options: ["Test E2E", "Test unitario", "Test de integración", "Snapshot test"], answer: "Test unitario" },
  { id: "q2", tema: "Fundamentos", question: "¿Qué test recorre un flujo completo de usuario (login → carrito → pago) en el navegador real?",
    options: ["Test unitario", "Test de integración", "Test E2E", "Test parametrizado"], answer: "Test E2E" },
  { id: "q3", tema: "Fundamentos", question: "Según la pirámide de testing, ¿cuál es la distribución recomendada?",
    options: ["Muchos E2E, pocos unitarios", "Muchos unitarios, algunos de integración y pocos E2E", "Solo tests E2E", "Mitad E2E y mitad unitarios"], answer: "Muchos unitarios, algunos de integración y pocos E2E" },
  { id: "q4", tema: "Fundamentos", question: "Un test mezcla la preparación y la verificación en un solo párrafo. ¿Qué estructura le falta?",
    options: ["Arrange-Act-Assert", "TDD", "Property-based", "Mutation testing"], answer: "Arrange-Act-Assert" },
  { id: "q5", tema: "Técnicas", question: "¿Cuál es el ciclo de TDD?",
    options: ["Escribir tests → refactor → implementar", "Rojo → verde → refactor", "Implementar → testear → refactor", "Verde → rojo → refactor"], answer: "Rojo → verde → refactor" },
  { id: "q6", tema: "Técnicas", question: "¿Dónde se concentran los errores 'off-by-one' de una condición como edad >= 18?",
    options: ["En el medio del rango (edad 40)", "En los límites (17, 18 y 19)", "Solo con edades muy altas", "No se concentran en ningún sitio"], answer: "En los límites (17, 18 y 19)" },
  { id: "q7", tema: "Técnicas", question: "¿Qué sustituye una pasarela de pagos real en un test unitario para hacerlo determinista?",
    options: ["Un test E2E", "Un test double (stub/fake/mock)", "Un snapshot", "Un test de mutación"], answer: "Un test double (stub/fake/mock)" },
  { id: "q8", tema: "Técnicas", question: "Veo el mismo test copiado 10 veces con solo el valor de entrada distinto. ¿Qué técnica aplico?",
    options: ["Tests parametrizados", "Mutation testing", "Snapshot testing", "TDD"], answer: "Tests parametrizados" },
  { id: "q9", tema: "Calidad", question: "¿Qué descubre el mutation testing?",
    options: ["Qué líneas no se ejecutan", "Qué tests no detectan cambios (mutaciones) en el código", "Qué flujos de usuario fallan", "Qué tan rápido corre la suite"], answer: "Qué tests no detectan cambios (mutaciones) en el código" },
  { id: "q10", tema: "Calidad", question: "Un test falla a veces en CI sin que el código cambie. ¿Cuál es la causa típica?",
    options: ["Dependencia de tiempo, red u orden de ejecución", "La cobertura es demasiado alta", "Hay demasiados tests unitarios", "El lenguaje de programación"], answer: "Dependencia de tiempo, red u orden de ejecución" }
];

createApp({
  data() {
    return {
      techniques,
      quiz,
      view: "estudio",
      query: "",
      tab: "guiarapida",
      tabs: [
        { id: "guiarapida", label: "Guía rápida" },
        { id: "casos", label: "Casos de uso" },
        { id: "autodiagnostico", label: "Autodiagnóstico" },
        { id: "ejemplo", label: "Ejemplo" }
      ],
      categories: [
        { id: "fundamentos", label: "Fundamentos" },
        { id: "tecnicas", label: "Técnicas" },
        { id: "calidad", label: "Calidad" }
      ],
      current: techniques[0],
      estado: JSON.parse(localStorage.getItem("testing_estado") || "{}"),
      studied: JSON.parse(localStorage.getItem("testing_studied") || "[]"),
      diagSelected: JSON.parse(localStorage.getItem("testing_diag") || "[]"),
      submitted: false,
      answers: {}
    };
  },
  computed: {
    studiedCount() { return this.studied.length; },
    senalPct() {
      const cur = this.estado[this.current.id] || {};
      const total = this.current.senales.length;
      const on = Object.values(cur).filter(Boolean).length;
      return Math.round(on / total * 100);
    },
    senalColor() {
      const p = this.senalPct;
      return p >= 50 ? "#34d399" : p > 0 ? "#fbbf24" : "#2a2f3d";
    },
    allSymptoms() {
      const seen = new Map();
      for (const t of this.techniques) {
        for (const s of t.senales) {
          if (!seen.has(s)) seen.set(s, []);
          seen.get(s).push(t.id);
        }
      }
      return Array.from(seen, ([text, tecnicas]) => ({ text, tecnicas }));
    },
    sortedResults() {
      if (!this.diagSelected.length) return [];
      const scores = {};
      for (const t of this.techniques) scores[t.id] = 0;
      for (const s of this.allSymptoms) {
        if (this.diagSelected.includes(s.text)) {
          s.tecnicas.forEach(tid => { scores[tid]++; });
        }
      }
      return Object.entries(scores)
        .filter(([, n]) => n > 0)
        .map(([tid, score]) => ({ t: this.techniques.find(x => x.id === tid), score }))
        .sort((a, b) => b.score - a.score);
    },
    maxScore() {
      const r = this.sortedResults;
      return r.length ? r[0].score : 1;
    },
    filteredPatterns() {
      const q = this.query.trim().toLowerCase();
      if (!q) return this.techniques;
      return this.techniques.filter(t => {
        const hay = [t.name, t.concepto, t.problema, ...t.senales, ...t.casos].join(" ").toLowerCase();
        return hay.includes(q);
      });
    },
    score() {
      return this.quiz.reduce((acc, q) => acc + (this.answers[q.id] === q.answer ? 1 : 0), 0);
    },
    answeredCount() {
      return this.quiz.filter(q => this.answers[q.id]).length;
    }
  },
  methods: {
    selectTechnique(t) { this.current = t; this.tab = "guiarapida"; },
    filteredByCat(catId) {
      return this.filteredPatterns.filter(t => t.categoria === catId);
    },
    catColor(cat) {
      return {
        fundamentos: "#34d399", tecnicas: "#6ee7b7", calidad: "#2dd4bf"
      }[cat] || "#fff";
    },
    catLabel(cat) {
      const c = this.categories.find(x => x.id === cat);
      return c ? c.label : cat;
    },
    toggleStudied(id) {
      if (this.studied.includes(id)) this.studied = this.studied.filter(x => x !== id);
      else this.studied.push(id);
      localStorage.setItem("testing_studied", JSON.stringify(this.studied));
    },
    toggleSenal(s) {
      if (!this.estado[this.current.id]) this.estado[this.current.id] = {};
      this.estado[this.current.id][s] = !this.estado[this.current.id][s];
      localStorage.setItem("testing_estado", JSON.stringify(this.estado));
    },
    toggleDiag(s) {
      if (this.diagSelected.includes(s)) this.diagSelected = this.diagSelected.filter(x => x !== s);
      else this.diagSelected.push(s);
      localStorage.setItem("testing_diag", JSON.stringify(this.diagSelected));
    },
    openTechnique(t) {
      this.current = t;
      this.view = "estudio";
      this.tab = "guiarapida";
    },
    submitQuiz() { this.submitted = true; },
    resetQuiz() {
      this.answers = {};
      this.submitted = false;
    }
  },
  watch: {
    view(v) { if (v === "quiz") this.submitted = false; }
  }
}).mount("#app");
</script>
</body>
</html>
