<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trabajo con IA — Guía Interactiva</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #171a23;
    --bg3: #1f2330;
    --border: #2a2f3d;
    --text: #e6e9f0;
    --muted: #9aa3b5;
    --accent: #22d3ee;
    --accent2: #67e8f9;
    --green: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
    --prompts: #22d3ee;
    --workflow: #67e8f9;
    --limites: #f87171;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* Header */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px; background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 18px; letter-spacing: .3px; white-space: nowrap; }
  header h1 span { color: var(--accent2); }
  header .search { flex: 1; min-width: 220px; display: flex; }
  header .search input {
    width: 100%; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); outline: none; font-size: 14px;
  }
  header .search input:focus { border-color: var(--accent); }
  nav.views { display: flex; gap: 6px; }
  nav.views button {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--muted); cursor: pointer; font-size: 14px;
  }
  nav.views button.active { background: var(--accent); color: #111; border-color: var(--accent); }

  /* Layout */
  main { flex: 1; display: flex; overflow: hidden; }

  /* Sidebar */
  aside {
    width: 320px; background: var(--bg2); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 12px;
  }
  aside .cat { margin-bottom: 8px; }
  aside .cat-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); padding: 8px 10px 4px; font-weight: 700;
  }
  aside button.item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 10px; border: 1px solid transparent; border-radius: 8px;
    background: transparent; color: var(--text); cursor: pointer;
    text-align: left; font-size: 14px; margin-bottom: 2px;
  }
  aside button.item:hover { background: var(--bg3); }
  aside button.item.active { background: var(--bg3); border-color: var(--border); }
  aside button.item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  aside button.item .studied { margin-left: auto; color: var(--green); font-size: 12px; }
  aside .progress {
    padding: 12px 10px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
  }
  aside .progress .bar {
    height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-top: 6px;
  }
  aside .progress .fill { height: 100%; background: var(--green); transition: width .3s; }

  /* Content */
  section.content { flex: 1; overflow-y: auto; padding: 24px 32px; }
  .pattern-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .pattern-head h2 { font-size: 26px; }
  .badge {
    padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .badge-prompts { background: rgba(34,211,238,.15); color: var(--prompts); }
  .badge-workflow { background: rgba(103,232,249,.15); color: var(--workflow); }
  .badge-limites { background: rgba(248,113,113,.15); color: var(--limites); }
  .concepto { color: var(--muted); font-size: 16px; margin-bottom: 20px; font-style: italic; }

  .card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
  }
  .card h3 {
    font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 10px; color: var(--accent2);
  }
  .card h3.none { color: var(--red); }
  .card p, .card li { color: var(--text); }
  .card ul { padding-left: 18px; }
  .card li { margin-bottom: 6px; }

  .senal-row {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid transparent; user-select: none;
  }
  .senal-row:hover { background: var(--bg3); }
  .senal-row.on { background: rgba(52,211,153,.08); border-color: rgba(52,211,153,.4); }
  .senal-row input { margin-top: 4px; accent-color: var(--green); cursor: pointer; }
  .meter { margin-top: 12px; }
  .meter .lbl { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; color: var(--muted); }
  .meter .bar { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
  .meter .fill { height: 100%; transition: width .3s, background .3s; border-radius: 5px; }

  pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.5;
    font-family: "Cascadia Code", Consolas, monospace; color: #c7d2fe;
  }
  .lbl-count { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }

  .empty { color: var(--muted); text-align: center; padding: 40px; font-size: 16px; }

  /* Diagnostic */
  .diag-intro { color: var(--muted); margin-bottom: 16px; }
  .diag-symp {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid var(--border); background: var(--bg2); user-select: none;
  }
  .diag-symp.on { background: rgba(34,211,238,.1); border-color: var(--accent); }
  .diag-symp input { margin-top: 4px; accent-color: var(--accent); cursor: pointer; }
  .result-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 8px; cursor: pointer;
  }
  .result-item .score { margin-left: auto; font-weight: 700; color: var(--accent2); }
  .result-item .matchbar { height: 6px; background: var(--bg); border-radius: 3px; width: 60px; overflow: hidden; margin-left: 10px; }
  .result-item .matchbar .fill { height: 100%; background: var(--accent2); }

  /* Quiz */
  .quiz-q {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
  }
  .quiz-q .q { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .quiz-q .patron-tag { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .opt {
    display: block; padding: 10px 12px; margin-bottom: 8px; border-radius: 8px;
    border: 1px solid var(--border); cursor: pointer; background: var(--bg);
    transition: all .15s;
  }
  .opt:hover { border-color: var(--accent); }
  .opt.selected { border-color: var(--accent); background: rgba(34,211,238,.12); }
  .opt.correct { border-color: var(--green); background: rgba(52,211,153,.12); }
  .opt.wrong { border-color: var(--red); background: rgba(248,113,113,.12); }
  .quiz-actions { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
  .btn {
    padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--text); cursor: pointer; font-size: 14px;
  }
  .btn.primary { background: var(--accent); color: #111; border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .quiz-score { font-size: 14px; color: var(--muted); }
  .quiz-result { font-size: 18px; font-weight: 700; padding: 12px; border-radius: 10px; text-align: center; margin-top: 10px; }
  .code-block { position: relative; }
  .code-block .lang {
    position: absolute; top: 8px; right: 12px; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px;
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .tabs button {
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--muted); cursor: pointer; font-size: 13px;
  }
  .tabs button.active { background: var(--accent); color: #111; border-color: var(--accent); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>Trabajo con IA <span>Guru</span></h1>
    <div class="search" v-if="view !== 'diagnostico'">
      <input type="text" v-model="query" placeholder="Buscar técnica, síntoma, prompt...">
    </div>
    <nav class="views">
      <button :class="{active: view==='estudio'}" @click="view='estudio'">Estudio</button>
      <button :class="{active: view==='diagnostico'}" @click="view='diagnostico'">Diagnóstico</button>
      <button :class="{active: view==='quiz'}" @click="view='quiz'">Quiz</button>
    </nav>
  </header>

  <main>
    <aside v-if="view==='estudio'">
      <div class="progress">
        <div>Progreso: <b>{{ studiedCount }} / {{ techniques.length }}</b> técnicas dominadas</div>
        <div class="bar"><div class="fill" :style="{width: (studiedCount/techniques.length*100)+'%'}"></div></div>
      </div>
      <template v-for="cat in categories" :key="cat.id">
        <div class="cat">
          <div class="cat-title">{{ cat.label }}</div>
          <button v-for="t in filteredByCat(cat.id)" :key="t.id"
                  class="item" :class="{active: current.id===t.id}"
                  @click="selectTechnique(t)">
            <span class="dot" :style="{background: catColor(cat.id)}"></span>
            <span>{{ t.name }}</span>
            <span v-if="studied.includes(t.id)" class="studied">listo</span>
          </button>
        </div>
      </template>
    </aside>

    <section class="content">

      <template v-if="view==='estudio'">
        <div v-if="current">
          <div class="pattern-head">
            <h2>{{ current.name }}</h2>
            <span class="badge" :class="'badge-'+current.categoria">{{ catLabel(current.categoria) }}</span>
            <button class="btn" :class="{primary: studied.includes(current.id)}"
                    @click="toggleStudied(current.id)">
              {{ studied.includes(current.id) ? 'Marcada como dominada' : 'Marcar como dominada' }}
            </button>
          </div>
          <p class="concepto">«{{ current.concepto }}»</p>

          <div class="tabs">
            <button v-for="t in tabs" :key="t.id" :class="{active: tab===t.id}" @click="tab=t.id">{{ t.label }}</button>
          </div>

          <template v-if="tab==='guiarapida'">
            <div class="card">
              <h3>Problema que resuelve</h3>
              <p>{{ current.problema }}</p>
            </div>
            <div class="grid2">
              <div class="card">
                <h3>Señales de que lo necesitas</h3>
                <ul>
                  <li v-for="s in current.senales" :key="s">{{ s }}</li>
                </ul>
              </div>
              <div class="card">
                <h3>Cuándo NO usarlo</h3>
                <ul>
                  <li v-for="n in current.noUsar" :key="n">{{ n }}</li>
                </ul>
              </div>
            </div>
            <div class="card">
              <h3>Alternativas a considerar</h3>
              <ul>
                <li v-for="a in current.alternativas" :key="a">{{ a }}</li>
              </ul>
            </div>
            <div class="card">
              <h3>Anti-patrón / error de IA que corrige</h3>
              <p>{{ current.antipatron }}</p>
            </div>
          </template>

          <template v-if="tab==='casos'">
            <div class="card">
              <h3>Casos de uso reales</h3>
              <ul>
                <li v-for="c in current.casos" :key="c">{{ c }}</li>
              </ul>
            </div>
            <div class="card">
              <h3>Análisis: ¿cómo reconocerlo en la práctica?</h3>
              <p>{{ current.analisis }}</p>
            </div>
          </template>

          <template v-if="tab==='autodiagnostico'">
            <div class="card">
              <h3>¿Se aplica a tu trabajo con IA? Marca las señales que veas</h3>
              <div v-for="s in current.senales" :key="s" class="senal-row" :class="{on: estado[current.id] && estado[current.id][s]}" @click="toggleSenal(s)">
                <input type="checkbox" :checked="estado[current.id] && estado[current.id][s]" @click.stop>
                <span>{{ s }}</span>
              </div>
              <div class="meter">
                <div class="lbl"><span>Coincidencia</span><span>{{ senalPct }}%</span></div>
                <div class="bar"><div class="fill" :style="{width: senalPct+'%', background: senalColor}"></div></div>
              </div>
              <div class="lbl-count" v-if="senalPct >= 50">
                Alta coincidencia con esta técnica. Revisa los casos de uso y el ejemplo antes/después para confirmarlo.
              </div>
              <div class="lbl-count" v-else-if="senalPct > 0">
                Baja coincidencia. Verifica los casos de uso o explora otras técnicas en el Diagnóstico.
              </div>
              <div class="lbl-count" v-else>
                Sin señales marcadas todavía.
              </div>
            </div>
          </template>

          <template v-if="tab==='ejemplo'">
            <div class="card">
              <h3>Ejemplo antes / después</h3>
              <div class="code-block">
                <span class="lang">prompt</span>
                <pre>{{ current.ejemplo }}</pre>
              </div>
              <p style="margin-top:10px; color: var(--muted);">{{ current.explicacion }}</p>
            </div>
          </template>

        </div>
        <div v-else class="empty">Sin resultados para «{{ query }}».</div>
      </template>

      <template v-if="view==='diagnostico'">
        <h2 style="margin-bottom:6px;">Diagnóstico de trabajo con IA</h2>
        <p class="diag-intro">
          Marca los síntomas (señales) que estés viendo en tu forma de trabajar con la IA. La app te sugerirá
          las técnicas con mayor coincidencia. Añade tantas como quieras; ordena por relevancia.
        </p>
        <div v-for="s in allSymptoms" :key="s.text" class="diag-symp" :class="{on: diagSelected.includes(s.text)}" @click="toggleDiag(s.text)">
          <input type="checkbox" :checked="diagSelected.includes(s.text)" @click.stop>
          <span>{{ s.text }}</span>
        </div>
        <h3 style="margin:24px 0 12px;">Técnicas sugeridas ({{ sortedResults.length }})</h3>
        <div v-if="sortedResults.length" class="result-item" v-for="r in sortedResults" :key="r.t.id" @click="openTechnique(r.t)">
          <span class="dot" :style="{background: catColor(r.t.categoria)}"></span>
          <span>{{ r.t.name }}</span>
          <span class="matchbar"><span class="fill" :style="{width: (r.score/maxScore*100)+'%'}"></span></span>
          <span class="score">{{ r.score }}</span>
        </div>
        <div v-else class="empty">Marca algún síntoma para obtener recomendaciones.</div>
      </template>

      <template v-if="view==='quiz'">
        <div class="quiz-actions">
          <button class="btn" :disabled="submitted" @click="submitQuiz">Corregir</button>
          <button class="btn" @click="resetQuiz">Reiniciar</button>
          <span class="quiz-score" v-if="submitted">Puntaje: {{ score }}/{{ quiz.length }}</span>
          <span class="quiz-score" v-else>Respondidas: {{ answeredCount }}/{{ quiz.length }}</span>
        </div>
        <div class="quiz-q" v-for="(q, i) in quiz" :key="q.id">
          <div class="patron-tag">{{ q.tema }} — Pregunta {{ i+1 }}</div>
          <div class="q">{{ q.question }}</div>
          <div v-for="o in q.options" :key="o" class="opt"
               :class="{
                 selected: answers[q.id]===o,
                 correct: submitted && o===q.answer,
                 wrong: submitted && answers[q.id]===o && o!==q.answer
               }"
               @click="!submitted && (answers[q.id]=o)">
            {{ o }}
          </div>
          <div v-if="submitted" class="quiz-result" :style="{background: q.answer===answers[q.id] ? 'rgba(52,211,153,.1)' : 'rgba(248,113,113,.1)', color: q.answer===answers[q.id] ? 'var(--green)' : 'var(--red)'}">
            {{ q.answer===answers[q.id] ? 'Correcto' : 'Incorrecto — respuesta: ' + q.answer }}
          </div>
        </div>
      </template>

    </section>
  </main>
</div>

<script>
const { createApp } = Vue;

const techniques = [
  {
    id: "contexto", name: "Dar contexto", categoria: "prompts",
    concepto: "Proporciona a la IA el contexto necesario (lenguaje, stack, arquitectura, archivos, restricciones) para que genere respuestas relevantes a tu proyecto.",
    problema: "Sin contexto, la IA responde con suposiciones genéricas: código con otro framework, versiones equivocadas o soluciones que no encajan en tu proyecto. Pierdes tiempo iterando en vano.",
    senales: [
      "La IA usa un framework o versión distinta a la del proyecto.",
      "Las respuestas son genéricas y no mencionan mi código real.",
      "Pego un fragmento aislado y la IA asume nombres de variables que no existen.",
      "Necesito varias iteraciones solo para que entienda de qué archivo hablo."
    ],
    noUsar: [
      "No pegues secretos, tokens o datos reales de producción como contexto.",
      "No satures con contexto irrelevante: el ruido también degrada la respuesta.",
      "No reveles datos personales de usuarios solo para dar contexto."
    ],
    alternativas: ["Pega el fragmento de código exacto y señala la línea que falla.", "Menciona el archivo y su rol en la arquitectura, en lugar de todo el repo.", "Cita errores de compilación o stack traces reales."],
    antipatron: "Prompt vago sin contexto: la IA responde con suposiciones y tú aceptas lo primero que llega.",
    casos: [
      "Explicar que trabajas con Vue 3 y tu backend es Node 20, para que la IA use sintaxis compatible.",
      "Describir la estructura del proyecto (carpetas, patrón de nomenclatura) antes de pedir una nueva función.",
      "Indicar que el módulo se ejecuta en el navegador y no tiene acceso a fs ni a variables de entorno del servidor."
    ],
    analisis: "Revisa la primera respuesta: si menciona tecnologías que no usas o propone archivos que no existen, es que faltó contexto. Añade una línea con el stack y repite el prompt.",
    ejemplo:
`// MALO:
Haz una función que valide un email.

// BUENO:
Estoy en un proyecto Node 20 con TypeScript, usando Express 4.
Tengo un archivo src/validators.ts donde van las funciones de validación
(se siguen las convenciones del resto de archivos: arrow functions y
nombres en camelCase). Escribe una función validarEmail que devuelva
true/false y rechace emails sin dominio o con caracteres inválidos.
Adjunto el inicio del archivo para que sigas el estilo.`,
    explicacion: "Con el prompt bueno la IA sabe el lenguaje, el framework, el archivo destino y el estilo. La respuesta encaja a la primera y no requiere reescribirla para tu proyecto."
  },
  {
    id: "estructurado", name: "Prompts estructurados", categoria: "prompts",
    concepto: "Organiza el prompt en secciones claras (objetivo, contexto, restricciones, formato de salida, criterios de aceptación) para obtener respuestas consistentes.",
    problema: "Un prompt en un solo bloque de texto produce respuestas caóticas: sin estructura, la IA mezcla explicaciones, código y consejos, y omite detalles que pediste.",
    senales: [
      "Las respuestas llegan en formatos distintos cada vez (párrafo, lista, código).",
      "La IA se salta restricciones que mencionaste al final del prompt.",
      "Tienes que pedir 'y también...' varias veces porque olvida partes.",
      "Es difícil comparar dos respuestas porque no siguen el mismo esquema."
    ],
    noUsar: [
      "No uses estructura excesiva para tareas triviales de una línea.",
      "No asumas que el formato pedido garantiza que la lógica sea correcta: revisa igualmente."
    ],
    alternativas: ["Pide el formato de salida explícito: 'Devuelve solo JSON con claves...'.", "Lista los criterios de aceptación que debe cumplir la solución.", "Usa una plantilla fija que reutilices en tus prompts habituales."],
    antipatron: "Prompts en 'pared de texto': una sola frase larga sin secciones ni requisitos de salida.",
    casos: [
      "Pedir una función con 'Objetivo / Firmas de entrada / Comportamiento / Restricciones / Salida en código solo'.",
      "Solicitar una revisión de código con 'Errores / Estilo / Sugerencias' como secciones separadas.",
      "Pedir la migración de un script indicando el formato de entrada y salida esperado."
    ],
    analisis: "Si tras varias respuestas notas que falta siempre el mismo dato o el formato varía, estructura el prompt con secciones y un formato de salida fijo. La respuesta se vuelve predecible y fácil de verificar.",
    ejemplo:
`// MALO:
corrige este código que no funciona y explicame que pasa
const x = [1,2,3]; console.log(x.flatten()) // da error

// BUENO:
Objetivo: corregir el código para que aplane el arreglo.
Código:
  const x = [1,2,3];
  console.log(x.flatten());
Error observado: "x.flatten is not a function" (Node 20).
Restricciones: no usar librerías externas; solución con JS nativo.
Salida esperada: [1,2,3] aplanado, es decir [1,2,3].
Formato: primero la causa en una línea, luego el código corregido y al final una alternativa.`,
    explicacion: "Cada sección le dice a la IA qué hacer, en qué condiciones y qué devolver. El resultado es consistente, cumple las restricciones y se puede comprobar contra el objetivo."
  },
  {
    id: "fewshot", name: "Few-shot (ejemplos en el prompt)", categoria: "prompts",
    concepto: "Incluye uno o más ejemplos entrada-salida dentro del prompt para que la IA imite el formato y el comportamiento esperado.",
    problema: "Pedir algo 'en el mismo estilo' no basta: la IA entiende mejor una tarea cuando ve un ejemplo concreto de lo que esperas como entrada y salida.",

const quiz = [
  { id: "q1", tema: "Prompts", question: "La IA usa un framework distinto al tuyo en cada respuesta. ¿Qué le falta a tu prompt?",
    options: ["Contexto del stack y del archivo involucrado", "Más signos de exclamación", "Una contraseña de prueba", "Pedirle que sea más rápido"], answer: "Contexto del stack y del archivo involucrado" },
  { id: "q2", tema: "Prompts", question: "La IA devuelve siempre un formato distinto del que esperas (JSON, tabla...). ¿Qué técnica aplicas?",
    options: ["Descomponer el problema", "Few-shot: mostrar un ejemplo de entrada y salida", "Confiar en que se corrija sola", "Ignorar el formato y adaptarte tú"], answer: "Few-shot: mostrar un ejemplo de entrada y salida" },
  { id: "q3", tema: "Prompts", question: "¿Qué NO deberías incluir jamás en un prompt?",
    options: ["El nombre de tu proyecto", "La versión de Node", "Tokens, contraseñas o claves de producción", "El stack de tecnologías"], answer: "Tokens, contraseñas o claves de producción" },
  { id: "q4", tema: "Workflow", question: "La IA te genera 300 líneas de código a la vez. ¿Cuál es el mejor enfoque?",
    options: ["Pegarlo entero y rezar", "Descomponer la tarea en subtareas pequeñas y revisar cada una", "Pedirlo de nuevo esperando otra respuesta", "Ocultar el código generado"], answer: "Descomponer la tarea en subtareas pequeñas y revisar cada una" },
  { id: "q5", tema: "Workflow", question: "Acabas de pegar el código que generó la IA. ¿Qué haces antes de integrarlo?",
    options: ["Commitearlo directamente", "Leerlo, ejecutarlo y probarlo con casos límite", "Preguntarle a otro modelo si está bien", "Solo comprobar que compile"], answer: "Leerlo, ejecutarlo y probarlo con casos límite" },
  { id: "q6", tema: "Workflow", question: "¿Cómo conviertes la evaluación del código generado en algo objetivo?",
    options: ["Confiar en tu intuición", "Fijarte en lo bien que se ve", "Con tests automatizados: solo integrar si pasan", "Pedirle a la IA que se autoevalúe"], answer: "Con tests automatizados: solo integrar si pasan" },
  { id: "q7", tema: "Workflow", question: "La IA 'asegura' que su solución pasa los tests. ¿Qué significa eso realmente?",
    options: ["Que es garantía de código perfecto", "Que no debes revisarla", "Que es una afirmación que debes verificar ejecutando los tests tú mismo", "Que los tests son innecesarios"], answer: "Que es una afirmación que debes verificar ejecutando los tests tú mismo" },
  { id: "q8", tema: "Límites", question: "La IA te recomienda un método de una librería que no encuentras en la documentación. ¿Qué haces?",
    options: ["Usarlo igualmente", "Verificar su existencia en la doc o ejecutándolo (posible alucinación)", "Pedirle otro método al azar", "Ignorar la documentación oficial"], answer: "Verificar su existencia en la doc o ejecutándolo (posible alucinación)" },
  { id: "q9", tema: "Límites", question: "Una conversación muy larga con la IA empieza a responder peor y 'olvida' tus instrucciones. ¿Qué haces?",
    options: ["Pegar más archivos como contexto extra", "Iniciar una conversación nueva con un resumen de lo esencial", "Repetir el prompt entero más despacio", "Continuar igual y asumir la pérdida de calidad"], answer: "Iniciar una conversación nueva con un resumen de lo esencial" },
  { id: "q10", tema: "Límites", question: "¿Cuál es la mejor práctica de seguridad con dependencias sugeridas por la IA?",
    options: ["Instalarlas sin mirar", "Verificar el nombre exacto, el publicador y ejecutar npm audit", "Instalar la primera opción que diga", "Copiar el nombre de memoria"], answer: "Verificar el nombre exacto, el publicador y ejecutar npm audit" }
];

createApp({
  data() {
    return {
      techniques,
      quiz,
      view: "estudio",
      query: "",
      tab: "guiarapida",
      tabs: [
        { id: "guiarapida", label: "Guía rápida" },
        { id: "casos", label: "Casos de uso" },
        { id: "autodiagnostico", label: "Autodiagnóstico" },
        { id: "ejemplo", label: "Ejemplo" }
      ],
      categories: [
        { id: "prompts", label: "Prompts" },
        { id: "workflow", label: "Workflow" },
        { id: "limites", label: "Límites" }
      ],
      current: techniques[0],
      estado: JSON.parse(localStorage.getItem("ia_estado") || "{}"),
      studied: JSON.parse(localStorage.getItem("ia_studied") || "[]"),
      diagSelected: JSON.parse(localStorage.getItem("ia_diag") || "[]"),
      submitted: false,
      answers: {}
    };
  },
  computed: {
    studiedCount() { return this.studied.length; },
    senalPct() {
      const cur = this.estado[this.current.id] || {};
      const total = this.current.senales.length;
      const on = Object.values(cur).filter(Boolean).length;
      return Math.round(on / total * 100);
    },
    senalColor() {
      const p = this.senalPct;
      return p >= 50 ? "#34d399" : p > 0 ? "#fbbf24" : "#2a2f3d";
    },
    allSymptoms() {
      const seen = new Map();
      for (const t of this.techniques) {
        for (const s of t.senales) {
          if (!seen.has(s)) seen.set(s, []);
          seen.get(s).push(t.id);
        }
      }
      return Array.from(seen, ([text, tecnicas]) => ({ text, tecnicas }));
    },
    sortedResults() {
      if (!this.diagSelected.length) return [];
      const scores = {};
      for (const t of this.techniques) scores[t.id] = 0;
      for (const s of this.allSymptoms) {
        if (this.diagSelected.includes(s.text)) {
          s.tecnicas.forEach(tid => { scores[tid]++; });
        }
      }
      return Object.entries(scores)
        .filter(([, n]) => n > 0)
        .map(([tid, score]) => ({ t: this.techniques.find(x => x.id === tid), score }))
        .sort((a, b) => b.score - a.score);
    },
    maxScore() {
      const r = this.sortedResults;
      return r.length ? r[0].score : 1;
    },
    filteredPatterns() {
      const q = this.query.trim().toLowerCase();
      if (!q) return this.techniques;
      return this.techniques.filter(t => {
        const hay = [t.name, t.concepto, t.problema, ...t.senales, ...t.casos].join(" ").toLowerCase();
        return hay.includes(q);
      });
    },
    score() {
      return this.quiz.reduce((acc, q) => acc + (this.answers[q.id] === q.answer ? 1 : 0), 0);
    },
    answeredCount() {
      return this.quiz.filter(q => this.answers[q.id]).length;
    }
  },
  methods: {
    selectTechnique(t) { this.current = t; this.tab = "guiarapida"; },
    filteredByCat(catId) {
      return this.filteredPatterns.filter(t => t.categoria === catId);
    },
    catColor(cat) {
      return {
        prompts: "#22d3ee", workflow: "#67e8f9", limites: "#f87171"
      }[cat] || "#fff";
    },
    catLabel(cat) {
      const c = this.categories.find(x => x.id === cat);
      return c ? c.label : cat;
    },
    toggleStudied(id) {
      if (this.studied.includes(id)) this.studied = this.studied.filter(x => x !== id);
      else this.studied.push(id);
      localStorage.setItem("ia_studied", JSON.stringify(this.studied));
    },
    toggleSenal(s) {
      if (!this.estado[this.current.id]) this.estado[this.current.id] = {};
      this.estado[this.current.id][s] = !this.estado[this.current.id][s];
      localStorage.setItem("ia_estado", JSON.stringify(this.estado));
    },
    toggleDiag(s) {
      if (this.diagSelected.includes(s)) this.diagSelected = this.diagSelected.filter(x => x !== s);
      else this.diagSelected.push(s);
      localStorage.setItem("ia_diag", JSON.stringify(this.diagSelected));
    },
    openTechnique(t) {
      this.current = t;
      this.view = "estudio";
      this.tab = "guiarapida";
    },
    submitQuiz() { this.submitted = true; },
    resetQuiz() {
      this.answers = {};
      this.submitted = false;
    }
  },
  watch: {
    view(v) { if (v === "quiz") this.submitted = false; }
  }
}).mount("#app");
</script>
</body>
</html>
