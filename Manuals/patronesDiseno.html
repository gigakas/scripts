<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patrones de Diseño — Guía Interactiva</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #171a23;
    --bg3: #1f2330;
    --border: #2a2f3d;
    --text: #e6e9f0;
    --muted: #9aa3b5;
    --accent: #6366f1;
    --accent2: #22d3ee;
    --green: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
    --creacional: #22d3ee;
    --estructural: #a78bfa;
    --comportamental: #34d399;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* Header */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px; background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 18px; letter-spacing: .3px; white-space: nowrap; }
  header h1 span { color: var(--accent2); }
  header .search { flex: 1; min-width: 220px; display: flex; }
  header .search input {
    width: 100%; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); outline: none; font-size: 14px;
  }
  header .search input:focus { border-color: var(--accent); }
  nav.views { display: flex; gap: 6px; }
  nav.views button {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--muted); cursor: pointer; font-size: 14px;
  }
  nav.views button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Layout */
  main { flex: 1; display: flex; overflow: hidden; }

  /* Sidebar */
  aside {
    width: 300px; background: var(--bg2); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 12px;
  }
  aside .cat { margin-bottom: 8px; }
  aside .cat-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); padding: 8px 10px 4px; font-weight: 700;
  }
  aside button.item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 10px; border: 1px solid transparent; border-radius: 8px;
    background: transparent; color: var(--text); cursor: pointer;
    text-align: left; font-size: 14px; margin-bottom: 2px;
  }
  aside button.item:hover { background: var(--bg3); }
  aside button.item.active { background: var(--bg3); border-color: var(--border); }
  aside button.item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  aside button.item .studied { margin-left: auto; color: var(--green); font-size: 12px; }
  aside .progress {
    padding: 12px 10px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
  }
  aside .progress .bar {
    height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-top: 6px;
  }
  aside .progress .fill { height: 100%; background: var(--green); transition: width .3s; }

  /* Content */
  section.content { flex: 1; overflow-y: auto; padding: 24px 32px; }
  .pattern-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .pattern-head h2 { font-size: 26px; }
  .badge {
    padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .badge-creacional { background: rgba(34,211,238,.15); color: var(--creacional); }
  .badge-estructural { background: rgba(167,139,250,.15); color: var(--estructural); }
  .badge-comportamental { background: rgba(52,211,153,.15); color: var(--comportamental); }
  .concepto { color: var(--muted); font-size: 16px; margin-bottom: 20px; font-style: italic; }

  .card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
  }
  .card h3 {
    font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 10px; color: var(--accent2);
  }
  .card h3.none { color: var(--red); }
  .card p, .card li { color: var(--text); }
  .card ul { padding-left: 18px; }
  .card li { margin-bottom: 6px; }

  .senal-row {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid transparent; user-select: none;
  }
  .senal-row:hover { background: var(--bg3); }
  .senal-row.on { background: rgba(52,211,153,.08); border-color: rgba(52,211,153,.4); }
  .senal-row input { margin-top: 4px; accent-color: var(--green); cursor: pointer; }
  .meter { margin-top: 12px; }
  .meter .lbl { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; color: var(--muted); }
  .meter .bar { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
  .meter .fill { height: 100%; transition: width .3s, background .3s; border-radius: 5px; }

  pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.5;
    font-family: "Cascadia Code", Consolas, monospace; color: #c7d2fe;
  }
  .lbl-count { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }

  .empty { color: var(--muted); text-align: center; padding: 40px; font-size: 16px; }

  /* Diagnostic */
  .diag-intro { color: var(--muted); margin-bottom: 16px; }
  .diag-symp {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid var(--border); background: var(--bg2); user-select: none;
  }
  .diag-symp.on { background: rgba(99,102,241,.12); border-color: var(--accent); }
  .diag-symp input { margin-top: 4px; accent-color: var(--accent); cursor: pointer; }
  .result-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 8px; cursor: pointer;
  }
  .result-item .score { margin-left: auto; font-weight: 700; color: var(--accent2); }
  .result-item .matchbar { height: 6px; background: var(--bg); border-radius: 3px; width: 60px; overflow: hidden; margin-left: 10px; }
  .result-item .matchbar .fill { height: 100%; background: var(--accent2); }

  /* Quiz */
  .quiz-q {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
  }
  .quiz-q .q { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .quiz-q .patron-tag { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .opt {
    display: block; padding: 10px 12px; margin-bottom: 8px; border-radius: 8px;
    border: 1px solid var(--border); cursor: pointer; background: var(--bg);
    transition: all .15s;
  }
  .opt:hover { border-color: var(--accent); }
  .opt.selected { border-color: var(--accent); background: rgba(99,102,241,.12); }
  .opt.correct { border-color: var(--green); background: rgba(52,211,153,.12); }
  .opt.wrong { border-color: var(--red); background: rgba(248,113,113,.12); }
  .quiz-actions { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
  .btn {
    padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--text); cursor: pointer; font-size: 14px;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .quiz-score { font-size: 14px; color: var(--muted); }
  .quiz-result { font-size: 18px; font-weight: 700; padding: 12px; border-radius: 10px; text-align: center; margin-top: 10px; }
  .code-block { position: relative; }
  .code-block .lang {
    position: absolute; top: 8px; right: 12px; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px;
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .tabs button {
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--muted); cursor: pointer; font-size: 13px;
  }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>Patrones de <span>Diseño</span></h1>
    <div class="search" v-if="view !== 'diagnostico'">
      <input type="text" v-model="query" placeholder="Buscar patrón, síntoma, caso de uso...">
    </div>
    <nav class="views">
      <button :class="{active: view==='estudio'}" @click="view='estudio'">Estudio</button>
      <button :class="{active: view==='diagnostico'}" @click="view='diagnostico'">Diagnóstico</button>
      <button :class="{active: view==='quiz'}" @click="view='quiz'">Quiz</button>
    </nav>
  </header>

  <main>
    <!-- SIDEBAR -->
    <aside v-if="view==='estudio'">
      <div class="progress">
        <div>Progreso: <b>{{ studiedCount }} / {{ patterns.length }}</b> patrones estudiados</div>
        <div class="bar"><div class="fill" :style="{width: (studiedCount/patterns.length*100)+'%'}"></div></div>
      </div>
      <template v-for="cat in categories" :key="cat.id">
        <div class="cat">
          <div class="cat-title">{{ cat.label }}</div>
          <button v-for="p in filteredByCat(cat.id)" :key="p.id"
                  class="item" :class="{active: current.id===p.id}"
                  @click="selectPattern(p)">
            <span class="dot" :style="{background: catColor(cat.id)}"></span>
            <span>{{ p.name }}</span>
            <span v-if="studied.includes(p.id)" class="studied">listo</span>
          </button>
        </div>
      </template>
    </aside>

    <!-- CONTENT -->
    <section class="content">

      <!-- ====== ESTUDIO ====== -->
      <template v-if="view==='estudio'">
        <div v-if="current">
          <div class="pattern-head">
            <h2>{{ current.name }}</h2>
            <span class="badge" :class="'badge-'+current.categoria">{{ current.categoria }}</span>
            <button class="btn" :class="{primary: studied.includes(current.id)}"
                    @click="toggleStudied(current.id)">
              {{ studied.includes(current.id) ? 'Marcado como estudiado' : 'Marcar como estudiado' }}
            </button>
          </div>
          <p class="concepto">«{{ current.concepto }}»</p>

          <div class="tabs">
            <button v-for="t in tabs" :key="t.id" :class="{active: tab===t.id}" @click="tab=t.id">{{ t.label }}</button>
          </div>

          <template v-if="tab==='guiarapida'">
            <div class="card">
              <h3>Problema que resuelve</h3>
              <p>{{ current.problema }}</p>
            </div>
            <div class="grid2">
              <div class="card">
                <h3>Señales de que lo necesitas</h3>
                <ul>
                  <li v-for="s in current.senales" :key="s">{{ s }}</li>
                </ul>
              </div>
              <div class="card">
                <h3>Cuándo NO usarlo</h3>
                <ul>
                  <li v-for="n in current.noUsar" :key="n">{{ n }}</li>
                </ul>
              </div>
            </div>
            <div class="card">
              <h3>Alternativas a considerar</h3>
              <ul>
                <li v-for="a in current.alternativas" :key="a">{{ a }}</li>
              </ul>
            </div>
            <div class="card">
              <h3>Anti-patrón que evita</h3>
              <p>{{ current.antipatron }}</p>
            </div>
          </template>

          <template v-if="tab==='casos'">
            <div class="card">
              <h3>Casos de uso reales</h3>
              <ul>
                <li v-for="c in current.casos" :key="c">{{ c }}</li>
              </ul>
            </div>
            <div class="card">
              <h3>Análisis: ¿cómo reconocerlo en la práctica?</h3>
              <p>{{ current.analisis }}</p>
            </div>
          </template>

          <template v-if="tab==='autodiagnostico'">
            <div class="card">
              <h3>¿Se aplica a tu caso? Marca las señales que veas</h3>
              <div v-for="s in current.senales" :key="s" class="senal-row" :class="{on: estado[current.id] && estado[current.id][s]}" @click="toggleSenal(s)">
                <input type="checkbox" :checked="estado[current.id] && estado[current.id][s]" @click.stop>
                <span>{{ s }}</span>
              </div>
              <div class="meter">
                <div class="lbl"><span>Coincidencia</span><span>{{ senalPct }}%</span></div>
                <div class="bar"><div class="fill" :style="{width: senalPct+'%', background: senalColor}"></div></div>
              </div>
              <div class="lbl-count" v-if="senalPct >= 50">
                Alta coincidencia con este patrón. Revisa los casos de uso y el ejemplo para confirmarlo.
              </div>
              <div class="lbl-count" v-else-if="senalPct > 0">
                Baja coincidencia. Verifica los casos de uso o explora otros patrones en el Diagnóstico.
              </div>
              <div class="lbl-count" v-else>
                Sin señales marcadas todavía.
              </div>
            </div>
          </template>

          <template v-if="tab==='ejemplo'">
            <div class="card">
              <h3>Ejemplo textual / pseudocódigo</h3>
              <div class="code-block">
                <span class="lang">pseudocódigo</span>
                <pre>{{ current.ejemplo }}</pre>
              </div>
              <p style="margin-top:10px; color: var(--muted);">{{ current.explicacion }}</p>
            </div>
          </template>

        </div>
        <div v-else class="empty">Sin resultados para «{{ query }}».</div>
      </template>

      <!-- ====== DIAGNÓSTICO ====== -->
      <template v-if="view==='diagnostico'">
        <h2 style="margin-bottom:6px;">Diagnóstico de patrón</h2>
        <p class="diag-intro">
          Marca los síntomas que estés viendo en tu código o requisitos. La app te sugerirá
          los patrones con mayor coincidencia. Añade tantos como quieras; ordena por relevancia.
        </p>
        <div v-for="s in allSymptoms" :key="s.text" class="diag-symp" :class="{on: diagSelected.includes(s.text)}" @click="toggleDiag(s.text)">
          <input type="checkbox" :checked="diagSelected.includes(s.text)" @click.stop>
          <span>{{ s.text }}</span>
        </div>
        <h3 style="margin:24px 0 12px;">Patrones sugeridos ({{ sortedResults.length }})</h3>
        <div v-if="sortedResults.length" class="result-item" v-for="r in sortedResults" :key="r.p.id" @click="openPattern(r.p)">
          <span class="dot" :style="{background: catColor(r.p.categoria)}"></span>
          <span>{{ r.p.name }}</span>
          <span class="matchbar"><span class="fill" :style="{width: (r.score/maxScore*100)+'%'}"></span></span>
          <span class="score">{{ r.score }}</span>
        </div>
        <div v-else class="empty">Marca algún síntoma para obtener recomendaciones.</div>
      </template>

      <!-- ====== QUIZ ====== -->
      <template v-if="view==='quiz'">
        <div class="quiz-actions">
          <button class="btn" :disabled="submitted" @click="submitQuiz">Corregir</button>
          <button class="btn" @click="resetQuiz">Reiniciar</button>
          <span class="quiz-score" v-if="submitted">Puntaje: {{ score }}/{{ quiz.length }}</span>
          <span class="quiz-score" v-else>Respondidas: {{ answeredCount }}/{{ quiz.length }}</span>
        </div>
        <div class="quiz-q" v-for="(q, i) in quiz" :key="q.id">
          <div class="patron-tag">{{ q.tema }} — Pregunta {{ i+1 }}</div>
          <div class="q">{{ q.question }}</div>
          <div v-for="o in q.options" :key="o" class="opt"
               :class="{
                 selected: answers[q.id]===o,
                 correct: submitted && o===q.answer,
                 wrong: submitted && answers[q.id]===o && o!==q.answer
               }"
               @click="!submitted && (answers[q.id]=o)">
            {{ o }}
          </div>
          <div v-if="submitted" class="quiz-result" :style="{background: q.answer===answers[q.id] ? 'rgba(52,211,153,.1)' : 'rgba(248,113,113,.1)', color: q.answer===answers[q.id] ? 'var(--green)' : 'var(--red)'}">
            {{ q.answer===answers[q.id] ? 'Correcto' : 'Incorrecto — respuesta: ' + q.answer }}
          </div>
        </div>
      </template>

    </section>
  </main>
</div>

<script>
const { createApp } = Vue;

const patterns = [
  {
    id: "factory", name: "Factory Method", categoria: "creacional",
    concepto: "Una clase delega la creación de sus objetos a un método que las subclases pueden sobrescribir.",
    problema: "El código cliente debe crear objetos sin conocer su clase concreta. Si escribes 'if (tipo == A) new A()' en varios sitios, cada vez que aparece un tipo nuevo tocas el cliente y el acoplamiento crece.",
    senales: [
      "Tengo un switch/if que decide qué clase instanciar según un tipo o condición.",
      "La misma lógica de creación aparece repetida en varios puntos.",
      "Anticipo que aparecerán nuevos tipos de objetos más adelante.",
      "El cliente no debería depender de clases concretas, solo de la interfaz."
    ],
    noUsar: [
      "Solo tienes un tipo fijo de objeto: el patrón añade boilerplate sin beneficio.",
      "Los tipos no cambian nunca y el acoplamiento directo no molesta."
    ],
    alternativas: ["Abstract Factory si hay familias de objetos relacionados.", "Builder si la creación es compleja paso a paso."],
    antipatron: "Switch-case spaghetti de creación y acoplamiento del cliente a clases concretas.",
    casos: [
      "Parser que devuelve distintos tipos de documento (PDF, Word, CSV) según la extensión.",
      "Sistema de notificaciones que instancia el canal correcto (email, SMS, push) según la config.",
      "Carga de datos desde distintas fuentes (base de datos, API, archivo) con la misma interfaz 'Fuente'."
    ],
    analisis: "Pregúntate: ¿mi código instancia objetos basándose en un tipo o cadena que viene de fuera? ¿Tendría que tocar este método cada vez que alguien añade un formato nuevo? Si sí, el lugar de creación debe aislarse en un factory.",
    ejemplo:
`class Notificador {
  crearCanal(tipo) {
    // Factory Method: cada subclase decide el canal concreto
    if (tipo === "email")  return new CanalEmail();
    if (tipo === "sms")    return new CanalSms();
    if (tipo === "push")   return new CanalPush();
  }
}

// Uso: el cliente solo conoce la interfaz Canal
const canal = notificador.crearCanal("sms");
canal.enviar(mensaje);`,
    explicacion: "El cliente pide un 'canal' por nombre y recibe un objeto que implementa la interfaz Canal. Mañana aparece WhatsApp: solo se añade un caso y un CanalWhatsApp, el cliente no cambia."
  },
  {
    id: "abstractfactory", name: "Abstract Factory", categoria: "creacional",
    concepto: "Crea familias de objetos que deben ser compatibles entre sí, sin exponer sus clases concretas.",
    problema: "Necesitas crear grupos de objetos que se usan juntos y deben ser consistentes (misma familia). Si cada objeto se crea de forma independiente puedes mezclar piezas incompatibles sin que el compilador te avise.",
    senales: [
      "Hay conjuntos de objetos que siempre se crean juntos (una 'familia').",
      "Mezclar objetos de conjuntos distintos provocaría errores o comportamiento raro.",
      "El cliente crea muchos objetos de la misma familia y el código es repetitivo.",
      "Quiero cambiar la familia completa en runtime sin tocar el cliente."
    ],
    noUsar: [
      "No existen familias, solo objetos individuales: Factory Method basta.",
      "No cambiarás de familia nunca: la complejidad no compensa."
    ],
    alternativas: ["Factory Method para objetos individuales.", "Builder si cada familia se compone en pasos."],
    antipatron: "Mezclar objetos de familias incompatibles, que falla en runtime.",
    casos: [
      "UI multiplataforma: crear botón, panel y checkbox para Windows o para macOS (nunca mezclar).",
      "Motores gráficos: recursos de DirectX vs OpenGL que no pueden combinarse.",
      "Persistencia: cada familia trae su Connection, Command y Transaction compatibles."
    ],
    analisis: "Cuando veas sustantivos que vienen en 'packs' ('los objetos de Windows', 'los de Mac') y mezclarlos rompe algo, tienes familias. El factory devuelve un conjunto garantizando coherencia.",
    ejemplo:
`// Familias: UI_Light y UI_Dark producen elementos compatibles entre sí
class UILightFactory {
  crearBoton()  { return new BotonClaro(); }
  crearPanel()  { return new PanelClaro(); }
}
class UIDarkFactory {
  crearBoton()  { return new BotonOscuro(); }
  crearPanel()  { return new PanelOscuro(); }
}

// El cliente usa la interfaz; nunca mezcla familias
let factory = config.tema === "dark" ? new UIDarkFactory() : new UILightFactory();
factory.crearBoton().render();
factory.crearPanel().render();`,
    explicacion: "El cliente elige una fábrica y ya no puede mezclar un BotonClaro con un PanelOscuro: la fábrica garantiza coherencia dentro de la familia."
  },
  {
    id: "builder", name: "Builder", categoria: "creacional",
    concepto: "Construye objetos complejos paso a paso, separando la construcción de la representación final.",
    problema: "Un objeto tiene muchos parámetros opcionales o se arma en pasos con validaciones entre ellos. Un constructor gigante es ilegible, propenso a errores de orden y obliga a pasar null.",
    senales: [
      "Constructores con 6+ parámetros.",
      "Tengo que pasar null/undefined para opcionales.",
      "El objeto necesita validarse entre pasos (no puedo calcular X antes de añadir Y).",
      "La construcción encadenada haría el código mucho más legible."
    ],
    noUsar: [
      "Objetos simples de 2-3 parámetros: el builder es sobre-ingeniería.",
      "No hay orden ni validación entre pasos: basta con parámetros nombrados o un record/dict."
    ],

createApp({
  data() {
    return {
      patterns,
      quiz,
      view: "estudio",
      query: "",
      tab: "guiarapida",
      tabs: [
        { id: "guiarapida", label: "Guía rápida" },
        { id: "casos", label: "Casos de uso" },
        { id: "autodiagnostico", label: "Autodiagnóstico" },
        { id: "ejemplo", label: "Ejemplo" }
      ],
      categories: [
        { id: "creacional", label: "Creacionales" },
        { id: "estructural", label: "Estructurales" },
        { id: "comportamental", label: "Comportamentales" }
      ],
      current: patterns[0],
      estado: JSON.parse(localStorage.getItem("patrones_estado") || "{}"),
      studied: JSON.parse(localStorage.getItem("patrones_studied") || "[]"),
      diagSelected: JSON.parse(localStorage.getItem("patrones_diag") || "[]"),
      submitted: false,
      answers: {}
    };
  },
  computed: {
    studiedCount() { return this.studied.length; },
    senalPct() {
      const cur = this.estado[this.current.id] || {};
      const total = this.current.senales.length;
      const on = Object.values(cur).filter(Boolean).length;
      return Math.round(on / total * 100);
    },
    senalColor() {
      const p = this.senalPct;
      return p >= 50 ? "#34d399" : p > 0 ? "#fbbf24" : "#2a2f3d";
    },
    allSymptoms() {
      const seen = new Map();
      for (const p of this.patterns) {
        for (const s of p.senales) {
          if (!seen.has(s)) seen.set(s, []);
          seen.get(s).push(p.id);
        }
      }
      return Array.from(seen, ([text, patrones]) => ({ text, patrones }));
    },
    sortedResults() {
      if (!this.diagSelected.length) return [];
      const scores = {};
      for (const p of this.patterns) scores[p.id] = 0;
      for (const s of this.allSymptoms) {
        if (this.diagSelected.includes(s.text)) {
          s.patrones.forEach(pid => { scores[pid]++; });
        }
      }
      return Object.entries(scores)
        .filter(([, n]) => n > 0)
        .map(([pid, score]) => ({ p: this.patterns.find(x => x.id === pid), score }))
        .sort((a, b) => b.score - a.score);
    },
    maxScore() {
      const r = this.sortedResults;
      return r.length ? r[0].score : 1;
    },
    filteredPatterns() {
      const q = this.query.trim().toLowerCase();
      if (!q) return this.patterns;
      return this.patterns.filter(p => {
        const hay = [p.name, p.concepto, p.problema, ...p.senales, ...p.casos].join(" ").toLowerCase();
        return hay.includes(q);
      });
    },
    score() {
      return this.quiz.reduce((acc, q) => acc + (this.answers[q.id] === q.answer ? 1 : 0), 0);
    },
    answeredCount() {
      return this.quiz.filter(q => this.answers[q.id]).length;
    }
  },
  methods: {
    selectPattern(p) { this.current = p; this.tab = "guiarapida"; },
    filteredByCat(catId) {
      return this.filteredPatterns.filter(p => p.categoria === catId);
    },
    catColor(cat) {
      return { creacional: "#22d3ee", estructural: "#a78bfa", comportamental: "#34d399" }[cat] || "#fff";
    },
    toggleStudied(id) {
      if (this.studied.includes(id)) this.studied = this.studied.filter(x => x !== id);
      else this.studied.push(id);
      localStorage.setItem("patrones_studied", JSON.stringify(this.studied));
    },
    toggleSenal(s) {
      if (!this.estado[this.current.id]) this.estado[this.current.id] = {};
      this.estado[this.current.id][s] = !this.estado[this.current.id][s];
      localStorage.setItem("patrones_estado", JSON.stringify(this.estado));
    },
    toggleDiag(s) {
      if (this.diagSelected.includes(s)) this.diagSelected = this.diagSelected.filter(x => x !== s);
      else this.diagSelected.push(s);
      localStorage.setItem("patrones_diag", JSON.stringify(this.diagSelected));
    },
    openPattern(p) {
      this.current = p;
      this.view = "estudio";
      this.tab = "guiarapida";
    },
    submitQuiz() { this.submitted = true; },
    resetQuiz() {
      this.answers = {};
      this.submitted = false;
    }
  },
  watch: {
    view(v) { if (v === "quiz") this.submitted = false; }
  }
}).mount("#app");
</script>
</body>
</html>
