<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rendimiento — Guía Interactiva</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #171a23;
    --bg3: #1f2330;
    --border: #2a2f3d;
    --text: #e6e9f0;
    --muted: #9aa3b5;
    --accent: #fbbf24;
    --accent2: #fcd34d;
    --green: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
    --analisis: #60a5fa;
    --optimizacion: #34d399;
    --concurrencia: #f472b6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px; background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 18px; letter-spacing: .3px; white-space: nowrap; }
  header h1 span { color: var(--accent2); }
  header .search { flex: 1; min-width: 220px; display: flex; }
  header .search input {
    width: 100%; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); outline: none; font-size: 14px;
  }
  header .search input:focus { border-color: var(--accent); }
  nav.views { display: flex; gap: 6px; }
  nav.views button {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--muted); cursor: pointer; font-size: 14px;
  }
  nav.views button.active { background: var(--accent); color: #111; border-color: var(--accent); }

  main { flex: 1; display: flex; overflow: hidden; }

  aside {
    width: 320px; background: var(--bg2); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 12px;
  }
  aside .cat { margin-bottom: 8px; }
  aside .cat-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); padding: 8px 10px 4px; font-weight: 700;
  }
  aside button.item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 10px; border: 1px solid transparent; border-radius: 8px;
    background: transparent; color: var(--text); cursor: pointer;
    text-align: left; font-size: 14px; margin-bottom: 2px;
  }
  aside button.item:hover { background: var(--bg3); }
  aside button.item.active { background: var(--bg3); border-color: var(--border); }
  aside button.item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  aside button.item .studied { margin-left: auto; color: var(--green); font-size: 12px; }
  aside .progress {
    padding: 12px 10px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
  }
  aside .progress .bar {
    height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-top: 6px;
  }
  aside .progress .fill { height: 100%; background: var(--green); transition: width .3s; }

  section.content { flex: 1; overflow-y: auto; padding: 24px 32px; }
  .pattern-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .pattern-head h2 { font-size: 26px; }
  .badge {
    padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .badge-analisis { background: rgba(96,165,250,.15); color: var(--analisis); }
  .badge-optimizacion { background: rgba(52,211,153,.15); color: var(--optimizacion); }
  .badge-concurrencia { background: rgba(244,114,182,.15); color: var(--concurrencia); }
  .concepto { color: var(--muted); font-size: 16px; margin-bottom: 20px; font-style: italic; }

  .card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
  }
  .card h3 {
    font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 10px; color: var(--accent2);
  }
  .card h3.none { color: var(--red); }
  .card p, .card li { color: var(--text); }
  .card ul { padding-left: 18px; }
  .card li { margin-bottom: 6px; }

  .senal-row {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid transparent; user-select: none;
  }
  .senal-row:hover { background: var(--bg3); }
  .senal-row.on { background: rgba(52,211,153,.08); border-color: rgba(52,211,153,.4); }
  .senal-row input { margin-top: 4px; accent-color: var(--green); cursor: pointer; }
  .meter { margin-top: 12px; }
  .meter .lbl { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; color: var(--muted); }
  .meter .bar { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
  .meter .fill { height: 100%; transition: width .3s, background .3s; border-radius: 5px; }

  pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.5;
    font-family: "Cascadia Code", Consolas, monospace; color: #c7d2fe;
  }
  .lbl-count { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }

  .empty { color: var(--muted); text-align: center; padding: 40px; font-size: 16px; }

  .diag-intro { color: var(--muted); margin-bottom: 16px; }
  .diag-symp {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid var(--border); background: var(--bg2); user-select: none;
  }
  .diag-symp.on { background: rgba(251,191,36,.1); border-color: var(--accent); }
  .diag-symp input { margin-top: 4px; accent-color: var(--accent); cursor: pointer; }
  .result-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 8px; cursor: pointer;
  }
  .result-item .score { margin-left: auto; font-weight: 700; color: var(--accent2); }
  .result-item .matchbar { height: 6px; background: var(--bg); border-radius: 3px; width: 60px; overflow: hidden; margin-left: 10px; }
  .result-item .matchbar .fill { height: 100%; background: var(--accent2); }

  .quiz-q {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
  }
  .quiz-q .q { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .quiz-q .patron-tag { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .opt {
    display: block; padding: 10px 12px; margin-bottom: 8px; border-radius: 8px;
    border: 1px solid var(--border); cursor: pointer; background: var(--bg);
    transition: all .15s;
  }
  .opt:hover { border-color: var(--accent); }
  .opt.selected { border-color: var(--accent); background: rgba(251,191,36,.12); }
  .opt.correct { border-color: var(--green); background: rgba(52,211,153,.12); }
  .opt.wrong { border-color: var(--red); background: rgba(248,113,113,.12); }
  .quiz-actions { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
  .btn {
    padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--text); cursor: pointer; font-size: 14px;
  }
  .btn.primary { background: var(--accent); color: #111; border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .quiz-score { font-size: 14px; color: var(--muted); }
  .quiz-result { font-size: 18px; font-weight: 700; padding: 12px; border-radius: 10px; text-align: center; margin-top: 10px; }
  .code-block { position: relative; }
  .code-block .lang {
    position: absolute; top: 8px; right: 12px; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px;
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .tabs button {
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--muted); cursor: pointer; font-size: 13px;
  }
  .tabs button.active { background: var(--accent); color: #111; border-color: var(--accent); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>Rendimiento <span>Pro</span></h1>
    <div class="search" v-if="view !== 'diagnostico'">
      <input type="text" v-model="query" placeholder="Buscar técnica, síntoma, código...">
    </div>
    <nav class="views">
      <button :class="{active: view==='estudio'}" @click="view='estudio'">Estudio</button>
      <button :class="{active: view==='diagnostico'}" @click="view='diagnostico'">Diagnóstico</button>
      <button :class="{active: view==='quiz'}" @click="view='quiz'">Quiz</button>
    </nav>
  </header>

  <main>
    <aside v-if="view==='estudio'">
      <div class="progress">
        <div>Progreso: <b>{{ studiedCount }} / {{ techniques.length }}</b> técnicas dominadas</div>
        <div class="bar"><div class="fill" :style="{width: (studiedCount/techniques.length*100)+'%'}"></div></div>
      </div>
      <template v-for="cat in categories" :key="cat.id">
        <div class="cat">
          <div class="cat-title">{{ cat.label }}</div>
          <button v-for="t in filteredByCat(cat.id)" :key="t.id"
                  class="item" :class="{active: current.id===t.id}"
                  @click="selectTechnique(t)">
            <span class="dot" :style="{background: catColor(cat.id)}"></span>
            <span>{{ t.name }}</span>
            <span v-if="studied.includes(t.id)" class="studied">listo</span>
          </button>
        </div>
      </template>
    </aside>

    <section class="content">

      <template v-if="view==='estudio'">
        <div v-if="current">
          <div class="pattern-head">
            <h2>{{ current.name }}</h2>
            <span class="badge" :class="'badge-'+current.categoria">{{ catLabel(current.categoria) }}</span>
            <button class="btn" :class="{primary: studied.includes(current.id)}"
                    @click="toggleStudied(current.id)">
              {{ studied.includes(current.id) ? 'Marcada como dominada' : 'Marcar como dominada' }}
            </button>
          </div>
          <p class="concepto">«{{ current.concepto }}»</p>

          <div class="tabs">
            <button v-for="t in tabs" :key="t.id" :class="{active: tab===t.id}" @click="tab=t.id">{{ t.label }}</button>
          </div>

          <template v-if="tab==='guiarapida'">
            <div class="card">
              <h3>Problema que resuelve</h3>
              <p>{{ current.problema }}</p>
            </div>
            <div class="grid2">
              <div class="card">
                <h3>Señales de que lo necesitas</h3>
                <ul>
                  <li v-for="s in current.senales" :key="s">{{ s }}</li>
                </ul>
              </div>
              <div class="card">
                <h3>Cuándo NO usarlo</h3>
                <ul>
                  <li v-for="n in current.noUsar" :key="n">{{ n }}</li>
                </ul>
              </div>
            </div>
            <div class="card">
              <h3>Alternativas a considerar</h3>
              <ul>
                <li v-for="a in current.alternativas" :key="a">{{ a }}</li>
              </ul>
            </div>
            <div class="card">
              <h3>Anti-patrón / olor que corrige</h3>
              <p>{{ current.antipatron }}</p>
            </div>
          </template>

          <template v-if="tab==='casos'">
            <div class="card">
              <h3>Casos de uso reales</h3>
              <ul>
                <li v-for="c in current.casos" :key="c">{{ c }}</li>
              </ul>
            </div>
            <div class="card">
              <h3>Análisis: ¿cómo reconocerlo en la práctica?</h3>
              <p>{{ current.analisis }}</p>
            </div>
          </template>

          <template v-if="tab==='autodiagnostico'">
            <div class="card">
              <h3>¿Se aplica a tu código? Marca las señales que veas</h3>
              <div v-for="s in current.senales" :key="s" class="senal-row" :class="{on: estado[current.id] && estado[current.id][s]}" @click="toggleSenal(s)">
                <input type="checkbox" :checked="estado[current.id] && estado[current.id][s]" @click.stop>
                <span>{{ s }}</span>
              </div>
              <div class="meter">
                <div class="lbl"><span>Coincidencia</span><span>{{ senalPct }}%</span></div>
                <div class="bar"><div class="fill" :style="{width: senalPct+'%', background: senalColor}"></div></div>
              </div>
              <div class="lbl-count" v-if="senalPct >= 50">
                Alta coincidencia con esta técnica. Revisa los casos de uso y el ejemplo antes/después para confirmarlo.
              </div>
              <div class="lbl-count" v-else-if="senalPct > 0">
                Baja coincidencia. Verifica los casos de uso o explora otras técnicas en el Diagnóstico.
              </div>
              <div class="lbl-count" v-else>
                Sin señales marcadas todavía.
              </div>
            </div>
          </template>

          <template v-if="tab==='ejemplo'">
            <div class="card">
              <h3>Ejemplo antes / después</h3>
              <div class="code-block">
                <span class="lang">pseudocódigo</span>
                <pre>{{ current.ejemplo }}</pre>
              </div>
              <p style="margin-top:10px; color: var(--muted);">{{ current.explicacion }}</p>
            </div>
          </template>

        </div>
        <div v-else class="empty">Sin resultados para «{{ query }}».</div>
      </template>

      <template v-if="view==='diagnostico'">
        <h2 style="margin-bottom:6px;">Diagnóstico de rendimiento</h2>
        <p class="diag-intro">
          Marca los síntomas de rendimiento que estés viendo (latencias, memoria, cuellos de botella
          medibles). La app te sugerirá las técnicas con mayor coincidencia. Añade tantas como quieras;
          ordena por relevancia.
        </p>
        <div v-for="s in allSymptoms" :key="s.text" class="diag-symp" :class="{on: diagSelected.includes(s.text)}" @click="toggleDiag(s.text)">
          <input type="checkbox" :checked="diagSelected.includes(s.text)" @click.stop>
          <span>{{ s.text }}</span>
        </div>
        <h3 style="margin:24px 0 12px;">Técnicas sugeridas ({{ sortedResults.length }})</h3>
        <div v-if="sortedResults.length" class="result-item" v-for="r in sortedResults" :key="r.t.id" @click="openTechnique(r.t)">
          <span class="dot" :style="{background: catColor(r.t.categoria)}"></span>
          <span>{{ r.t.name }}</span>
          <span class="matchbar"><span class="fill" :style="{width: (r.score/maxScore*100)+'%'}"></span></span>
          <span class="score">{{ r.score }}</span>
        </div>
        <div v-else class="empty">Marca algún síntoma de rendimiento para obtener recomendaciones.</div>
      </template>

      <template v-if="view==='quiz'">
        <div class="quiz-actions">
          <button class="btn" :disabled="submitted" @click="submitQuiz">Corregir</button>
          <button class="btn" @click="resetQuiz">Reiniciar</button>
          <span class="quiz-score" v-if="submitted">Puntaje: {{ score }}/{{ quiz.length }}</span>
          <span class="quiz-score" v-else>Respondidas: {{ answeredCount }}/{{ quiz.length }}</span>
        </div>
        <div class="quiz-q" v-for="(q, i) in quiz" :key="q.id">
          <div class="patron-tag">{{ q.tema }} — Pregunta {{ i+1 }}</div>
          <div class="q">{{ q.question }}</div>
          <div v-for="o in q.options" :key="o" class="opt"
               :class="{
                 selected: answers[q.id]===o,
                 correct: submitted && o===q.answer,
                 wrong: submitted && answers[q.id]===o && o!==q.answer
               }"
               @click="!submitted && (answers[q.id]=o)">
            {{ o }}
          </div>
          <div v-if="submitted" class="quiz-result" :style="{background: q.answer===answers[q.id] ? 'rgba(52,211,153,.1)' : 'rgba(248,113,113,.1)', color: q.answer===answers[q.id] ? 'var(--green)' : 'var(--red)'}">
            {{ q.answer===answers[q.id] ? 'Correcto' : 'Incorrecto — respuesta: ' + q.answer }}
          </div>
        </div>
      </template>

    </section>
  </main>
</div>

<script>
const { createApp } = Vue;

const techniques = [
  {
    id: "bigo", name: "Complejidad algorítmica (Big-O)", categoria: "analisis",
    concepto: "Estimar cómo crece el tiempo o la memoria de un algoritmo al crecer la entrada (O(1), O(n), O(n²), O(log n)...), para elegir la estructura y el algoritmo adecuados antes de escribir código.",
    problema: "Un algoritmo tiene un coste que crece de forma explosiva con los datos (dobles bucles anidados, búsquedas lineales repetidas), pero nadie lo cuantificó. El sistema funciona en pruebas pequeñas y colapsa en producción.",
    senales: [
      "La latencia de una petición crece de forma desproporcionada al añadir datos.",
      "Hay bucles anidados que recorren listas completas por cada elemento.",
      "Busco con find()/indexOf() dentro de un bucle (accidental O(n²)).",
      "El tiempo de respuesta escala mal: 10 datos va bien, 10.000 datos se cae."
    ],
    noUsar: [
      "Optimizar el Big-O cuando el volumen de datos es pequeño y constante (la diferencia es inapreciable).",
      "Complicar el código con estructuras exóticas para ahorrar microsegundos sin medir antes.",
      "Aplicar optimizaciones teóricas antes de que exista un problema real (premature optimization)."
    ],
    alternativas: [
      "Profiling: medir primero dónde se gasta el tiempo realmente.",
      "Batching / agregación para reducir el número de recorridos.",
      "Estructuras de datos adecuadas (Map/Set en vez de arrays) en lugar de reescribir el algoritmo."
    ],
    antipatron: "Optimizar sin medir: asumir un cuello de botella teórico y complicar el código para algo que nunca fue el problema real.",
    casos: [
      "Filtros y búsquedas: sustituir indexOf dentro de un bucle por un Set (O(1)).",
      "Ordenar con sort() nativo (O(n log n)) en vez de un burbuja manual O(n²).",
      "Deduplicar listas con un Set en vez de includes() dentro de un for."
    ],
    analisis: "Si el tiempo de respuesta se duplica al duplicar los datos, sospecha de O(n²) o peor. Cuenta los bucles anidados: cada nivel que recorra la misma lista añade un factor n. Antes de reescribir, confirma el cuello con profiling.",
    ejemplo:
`// ANTES: búsqueda lineal dentro de un bucle -> O(n^2)
function verificarExistencias(ids, inventario) {
  for (const id of ids) {
    const existe = inventario.find(p => p.id === id);   // O(n) por cada id
    if (!existe) return false;
  }
  return true;
}

// DESPUÉS: índice en un Map -> O(n) total
function verificarExistencias(ids, inventario) {
  const porId = new Map(inventario.map(p => [p.id, p]));
  for (const id of ids) {
    if (!porId.has(id)) return false;   // O(1) por cada id
  }
  return true;
}`,
    explicacion: "Con n ids y m productos el primer caso cuesta n*m (O(n²) si son iguales). Con el Map, construir el índice cuesta m y cada consulta O(1): el tiempo total pasa a ser lineal."
  },
  {
    id: "profiling", name: "Profiling (medir antes de optimizar)", categoria: "analisis",
    concepto: "Medir con un profiler (CPU, memoria, llamadas) qué partes del código consumen más recursos, para decidir dónde optimizar con datos, no con intuiciones.",
    problema: "Se optimiza 'a ciegas': se refactoriza lo que uno cree que es lento sin datos, y el problema real (otro método, otra consulta) sigue ahí porque nadie lo midió.",
    senales: [
      "Escucho que 'algo está lento' pero nadie sabe exactamente qué función o consulta.",
      "El tiempo de respuesta supera el objetivo (p. ej. > 1 s) sin identificar el cuello de botella.",
      "La CPU o la memoria se saturan sin saber qué lo provoca.",
      "Los intentos previos de optimización no mejoraron nada medible."
    ],
    noUsar: [
      "Perfilar en entornos de pruebas con datos diminutos que no representan producción.",
      "Dedicar tiempo a perfilar cuando el problema ya está medido (p. ej. un N+1 visible en el trace).",
      "Perfilar cada microfunción: mide a nivel de flujo o petición, luego profundiza."
    ],
    alternativas: [
      "Benchmarks para comparar alternativas de forma controlada.",
      "Tracing distribuido (latencia por servicio) si el cuello está entre servicios.",
      "Complejidad algorítmica como primer análisis teórico antes de perfilar."
    ],
    antipatron: "Optimizar por corazonada: tocar código 'que parece lento' sin medir, arriesgando bugs y sin resultados (premature optimization).",
    casos: [
      "Un endpoint tarda 2 s y el profiler revela que el 90% es una llamada redundante a la BD.",
      "La API consume mucha CPU y un profiler de memoria muestra objetos que no se liberan.",
      "Comparar dos implementaciones de un parser bajo la misma carga."
    ],
    analisis: "El profiler te dice el porcentaje de tiempo por función. Regla práctica: ataca primero la función con mayor tiempo acumulado (self + hijos). Vuelve a medir tras cada cambio: si el número no mejora, deshaz el cambio.",
    ejemplo:
`// ANTES: optimizar por corazonada
function procesarPedido(pedido) {
  // 'creo que esto es lento' -> se reescribe sin medir
  const items = pedido.items.map(i => i.nombre.toUpperCase());
  return items;
}

// DESPUÉS: medir antes de decidir (el profiler dijo otra cosa)
// 1) Perfilado: 85% del tiempo en validarStockEnBD() llamada 40 veces
// 2) Optimizar lo medido:
async function procesarPedido(pedido) {
  const stock = await validarStockEnBloque(pedido.items);  // 1 llamada, no 40
  return stock;
}`,

    antipatron: "Listeners, timers y closures sin limpiar: objetos 'vivos' que el GC no puede liberar porque algo los referencia. La memoria crece en escalera hasta el OOM.",
    casos: [
      "Un componente SPA que registra addEventListener y nunca hace removeEventListener.",
      "Un setInterval global que se crea en cada montaje y sigue acumulándose.",
      "Un Map usado como caché que crece sin eviction con cada request."
    ],
    analisis: "Con el profiler de memoria, toma un heap snapshot, repite la acción (abrir/cerrar pantalla) y compara: los objetos que quedan retenidos son el leak. Busca quién los referencia (listener, timer, closure). Regla: todo lo que se registra o abre, se desregistra o cierra.",
    ejemplo:
`// ANTES: el listener y el timer nunca se limpian
function crearVisor() {
  const btn = document.getElementById("btn");
  btn.addEventListener("click", onClick);
  const id = setInterval(actualizar, 1000);   // sigue vivo tras destruir
  return () => { /* no hace nada */ };
}

// DESPUÉS: limpieza simétrica
function crearVisor() {
  const btn = document.getElementById("btn");
  btn.addEventListener("click", onClick);
  const id = setInterval(actualizar, 1000);
  return function destruir() {
    btn.removeEventListener("click", onClick);   // quitar listener
    clearInterval(id);                           // matar timer
  };
}
// El llamador invoca destruir() al cerrar la vista.
// Regla: lo que se abre se cierra; lo que se registra se desregistra.`,
    explicacion: "Cada apertura del visor añadía un listener y un interval que nadie limpiaba: la memoria subía en escalera. destruir() libera ambos. La regla de oro es la simetría: todo recurso que se toma debe devolverse."
  },
  {
    id: "eventloop", name: "Event loop / hilos", categoria: "concurrencia",
    concepto: "Entender cómo el event loop ejecuta tareas y microtasks para no bloquear el hilo con trabajo síncrono pesado, y usar hilos/workers o troceo cuando haya CPU-bound.",
    problema: "Código síncrono pesado (cálculo, parseo, procesamiento de imágenes) bloquea el event loop: el servidor deja de responder mientras se ejecuta, congelando todas las peticiones simultáneas.",
    senales: [
      "Una operación CPU-bound larga congela todas las demás peticiones (el p95 se dispara).",
      "El servidor deja de responder durante tareas de parseo o cálculo intensivo.",
      "El hilo principal queda bloqueado por for/parseo de datos grandes.",
      "Las promesas y timers se retrasan por tareas largas (long tasks)."
    ],
    noUsar: [
      "Mover a hilos todo: la sobrecarga de sincronización puede empeorar tareas cortas.",
      "Trocear tareas pequeñas sin medir el beneficio (añade complejidad).",
      "Confundir I/O (ya es no-bloqueante) con CPU-bound (sí bloquea)."
    ],
    alternativas: [
      "Async/await para I/O: ya es no-bloqueante, no hace falta hilos.",
      "Workers/hilos para CPU-bound real.",
      "Batching y caché para no hacer trabajo innecesario."
    ],
    antipatron: "Bloquear el event loop: trabajo síncrono pesado en el hilo principal que congela a todos los usuarios, aunque solo lo pida uno.",
    casos: [
      "Un parseo de un CSV de 2 GB que congela el servidor 5 s.",
      "Redimensionar imágenes en el hilo principal de la API.",
      "Un cálculo de agregación pesado en cada petición (mover a worker o precalcular)."
    ],
    analisis: "Si una tarea larga (long task) mantiene el hilo ocupado, las peticiones entrantes esperan: el event loop es de un solo hilo para JS. La I/O no bloquea (se delega), pero el cómputo síncrono sí. Detecta tareas > 50 ms en el profiler y muévelas a un worker o trocéalas.",
    ejemplo:
`// ANTES: cómputo síncrono que bloquea el event loop
function procesarCSVGrande(datos) {
  const filas = datos.split("\\n");           // trabajo pesado síncrono
  return filas.map(f => f.split(",").map(c => c.trim()));  // congela el servidor
}

// DESPUÉS: mover a un worker (CPU-bound) o trocear en chunks
const { Worker } = require("worker_threads");
function procesarCSVGrande(datos) {
  return new Promise((resolve, reject) => {
    const worker = new Worker("./csv-worker.js");
    worker.on("message", resolve);
    worker.on("error", reject);
    worker.postMessage(datos);               // el hilo principal sigue libre
  });
}`,
    explicacion: "El parseo pesado se delega a un worker: el event loop principal sigue atendiendo otras peticiones. Regla: la I/O ya es asíncrona; el cómputo CPU-bound es lo que bloquea. Para tareas largas, worker o troceo."
  }
];

const quiz = [
  { id: "q1", tema: "Análisis", question: "Un endpoint duplica su latencia cada vez que duplicas los datos, y dentro de un bucle haces find() sobre un array. ¿Qué problema tienes?",
    options: ["N+1 queries", "Complejidad O(n²)", "Memory leak", "Caché sin invalidación"], answer: "Complejidad O(n²)" },
  { id: "q2", tema: "Análisis", question: "El equipo dice que 'algo está lento' pero nadie sabe qué función es. ¿Qué es lo primero que haces?",
    options: ["Reescribir el algoritmo de búsqueda", "Crear índices en todas las tablas", "Perfilar y medir para localizar el cuello de botella", "Añadir una caché global"], answer: "Perfilar y medir para localizar el cuello de botella" },
  { id: "q3", tema: "Análisis", question: "Quieres decidir entre dos librerías de parsing 'cuál es más rápida' con datos fiables. ¿Qué haces?",
    options: ["Elegir la que 'parece' más rápida", "Un benchmark con el mismo input y múltiples iteraciones", "Mirar el número de estrellas del repositorio", "Cachear el resultado de ambas"], answer: "Un benchmark con el mismo input y múltiples iteraciones" },
  { id: "q4", tema: "Optimización", question: "La misma consulta costosa se ejecuta miles de veces por segundo y su resultado apenas cambia. ¿Qué aplicas?",
    options: ["Paginación", "Caché con invalidación definida", "Connection pooling", "Workers"], answer: "Caché con invalidación definida" },
  { id: "q5", tema: "Optimización", question: "Con 100 pedidos el log de la BD muestra 101 consultas: una por cada cliente dentro de un bucle. ¿Qué patrón es?",
    options: ["N+1 queries", "Full table scan", "Memory leak", "Secuencia accidental"], answer: "N+1 queries" },
  { id: "q6", tema: "Optimización", question: "Un endpoint devuelve un millón de filas y el payload crece con el tamaño de la tabla. ¿Qué técnica aplicas?",
    options: ["Lazy loading", "Batching", "Paginación", "Índices de base de datos"], answer: "Paginación" },
  { id: "q7", tema: "Optimización", question: "El EXPLAIN de una consulta lenta muestra 'Seq Scan' sobre una tabla de 5 millones de filas. ¿Qué haces?",
    options: ["Crear un índice sobre las columnas del WHERE/ORDER BY", "Añadir una caché sin invalidación", "Paginación con offset", "Abrir más conexiones"], answer: "Crear un índice sobre las columnas del WHERE/ORDER BY" },
  { id: "q8", tema: "Optimización", question: "La BD lanza 'too many connections' y cada operación abre y cierra su propia conexión. ¿Qué aplicas?",
    options: ["Índices de base de datos", "Connection pooling", "Batching", "Caché"], answer: "Connection pooling" },
  { id: "q9", tema: "Concurrencia", question: "Tres llamadas a la API son independientes y el tiempo total es la suma de las tres. ¿Cómo las mejoras?",
    options: ["Lanzarlas en paralelo con Promise.all", "Encadenarlas con más await", "Cachear la primera", "Aumentar el timeout"], answer: "Lanzarlas en paralelo con Promise.all" },
  { id: "q10", tema: "Concurrencia", question: "La memoria sube en escalera porque un componente registra listeners y timers que nunca se limpian. ¿Qué problema es?",
    options: ["N+1 queries", "Un memory leak", "Caché sin invalidación", "Un cuello de botella de CPU"], answer: "Un memory leak" }
];

createApp({
  data() {
    return {
      techniques,
      quiz,
      view: "estudio",
      query: "",
      tab: "guiarapida",
      tabs: [
        { id: "guiarapida", label: "Guía rápida" },
        { id: "casos", label: "Casos de uso" },
        { id: "autodiagnostico", label: "Autodiagnóstico" },
        { id: "ejemplo", label: "Ejemplo" }
      ],
      categories: [
        { id: "analisis", label: "Análisis" },
        { id: "optimizacion", label: "Optimización" },
        { id: "concurrencia", label: "Concurrencia" }
      ],
      current: techniques[0],
      estado: JSON.parse(localStorage.getItem("rendimiento_estado") || "{}"),
      studied: JSON.parse(localStorage.getItem("rendimiento_studied") || "[]"),
      diagSelected: JSON.parse(localStorage.getItem("rendimiento_diag") || "[]"),
      submitted: false,
      answers: {}
    };
  },
  computed: {
    studiedCount() { return this.studied.length; },
    senalPct() {
      const cur = this.estado[this.current.id] || {};
      const total = this.current.senales.length;
      const on = Object.values(cur).filter(Boolean).length;
      return Math.round(on / total * 100);
    },
    senalColor() {
      const p = this.senalPct;
      return p >= 50 ? "#34d399" : p > 0 ? "#fbbf24" : "#2a2f3d";
    },
    allSymptoms() {
      const seen = new Map();
      for (const t of this.techniques) {
        for (const s of t.senales) {
          if (!seen.has(s)) seen.set(s, []);
          seen.get(s).push(t.id);
        }
      }
      return Array.from(seen, ([text, tecnicas]) => ({ text, tecnicas }));
    },
    sortedResults() {
      if (!this.diagSelected.length) return [];
      const scores = {};
      for (const t of this.techniques) scores[t.id] = 0;
      for (const s of this.allSymptoms) {
        if (this.diagSelected.includes(s.text)) {
          s.tecnicas.forEach(tid => { scores[tid]++; });
        }
      }
      return Object.entries(scores)
        .filter(([, n]) => n > 0)
        .map(([tid, score]) => ({ t: this.techniques.find(x => x.id === tid), score }))
        .sort((a, b) => b.score - a.score);
    },
    maxScore() {
      const r = this.sortedResults;
      return r.length ? r[0].score : 1;
    },
    filteredPatterns() {
      const q = this.query.trim().toLowerCase();
      if (!q) return this.techniques;
      return this.techniques.filter(t => {
        const hay = [t.name, t.concepto, t.problema, ...t.senales, ...t.casos].join(" ").toLowerCase();
        return hay.includes(q);
      });
    },
    score() {
      return this.quiz.reduce((acc, q) => acc + (this.answers[q.id] === q.answer ? 1 : 0), 0);
    },
    answeredCount() {
      return this.quiz.filter(q => this.answers[q.id]).length;
    }
  },
  methods: {
    selectTechnique(t) { this.current = t; this.tab = "guiarapida"; },
    filteredByCat(catId) {
      return this.filteredPatterns.filter(t => t.categoria === catId);
    },
    catColor(cat) {
      return {
        analisis: "#60a5fa", optimizacion: "#34d399", concurrencia: "#f472b6"
      }[cat] || "#fff";
    },
    catLabel(cat) {
      const c = this.categories.find(x => x.id === cat);
      return c ? c.label : cat;
    },
    toggleStudied(id) {
      if (this.studied.includes(id)) this.studied = this.studied.filter(x => x !== id);
      else this.studied.push(id);
      localStorage.setItem("rendimiento_studied", JSON.stringify(this.studied));
    },
    toggleSenal(s) {
      if (!this.estado[this.current.id]) this.estado[this.current.id] = {};
      this.estado[this.current.id][s] = !this.estado[this.current.id][s];
      localStorage.setItem("rendimiento_estado", JSON.stringify(this.estado));
    },
    toggleDiag(s) {
      if (this.diagSelected.includes(s)) this.diagSelected = this.diagSelected.filter(x => x !== s);
      else this.diagSelected.push(s);
      localStorage.setItem("rendimiento_diag", JSON.stringify(this.diagSelected));
    },
    openTechnique(t) {
      this.current = t;
      this.view = "estudio";
      this.tab = "guiarapida";
    },
    submitQuiz() { this.submitted = true; },
    resetQuiz() {
      this.answers = {};
      this.submitted = false;
    }
  },
  watch: {
    view(v) { if (v === "quiz") this.submitted = false; }
  }
}).mount("#app");
</script>
</body>
</html>
