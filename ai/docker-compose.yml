services:
  ai-runtime:
    build: ./ai-runtime
    container_name: chatbot-ai-runtime
    ports:
      - "${CHATBOT_AI_PORT:-8001}:8001"
    env_file:
      - ./ai-runtime/.env
    environment:
      - CHATBOT_AI_HOST=0.0.0.0
      - CHATBOT_AI_PORT=8001
      - CHROMA_PERSIST_DIR=/opt/chatbot-ai-runtime/data/chroma
    volumes:
      - chroma_data:/opt/chatbot-ai-runtime/data/chroma
    networks:
      - ai-network
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-server
    ports:
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      - ${HF_CACHE_DIR:-/tmp/huggingface_cache}:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
    command: >
      --model
      ${VLLM_MODEL:-Qwen/Qwen3-7B}
      --max-model-len
      ${VLLM_MAX_MODEL_LEN:-2048}
      --max-num-seqs
      ${VLLM_MAX_NUM_SEQS:-2}
      --gpu-memory-utilization
      ${VLLM_GPU_MEM_UTIL:-0.88}
      --enforce-eager
      --enable-auto-tool-choice
      --tool-call-parser
      qwen3_xml
      ${VLLM_EXTRA_ARGS:-}
    ipc: host
    networks:
      - ai-network
    restart: unless-stopped
    profiles:
      - vllm
      - gpu
      - full

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-network
    restart: unless-stopped
    profiles:
      - ollama
      - full

volumes:
  chroma_data:
    name: chatbot_chroma_data
  ollama_data:
    name: chatbot_ollama_data

networks:
  ai-network:
    name: chatbot-ai-network
